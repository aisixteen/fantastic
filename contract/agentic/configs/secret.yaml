# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/secret.yaml`.

loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        # One open file bridge: a real bundle every runtime ships, that STORES what
        # it is sent — so a spec can prove the target got the real value (read it
        # back) while every record of the call shows the placeholder.
        - id: vault
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          callable_by:
            keeper: [read, write]

        # An agent-origin caller of the vault — the gated edge the core walks.
        - id: keeper
          handler_module: file_bridge.tools
          allow: ['.']
          can_call:
            vault: [read, write]
