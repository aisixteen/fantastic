# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/namespacing.yaml`.


loaders:
  - id: wing_a
    file: wing_a.yaml
    meta:
      can_call: {$subtree: "*"}
    manifest:
      agents:
        # The persistence provider, DISCOVERED by match: a file_bridge whose
        # root resolves to the loader's own `.fantastic` dir
        # (kernel_state/tools.py `_find_store`, which walks the subtree).
        - id: store
          handler_module: file_bridge.tools
          callable_by: {$parent: "*"}
          allow: ['.']
          root: .fantastic
          ingress_rule: allow_all_ingress
        # Memory is plain FILES on the wing's own notes store.
        #
        # The one grant in this roster, and it is here to be INSUFFICIENT.
        # `persist_blob` names the namespace it writes to in its PAYLOAD
        # (`agent_id`, kernel_state/tools.py:788), so an agent that can reach the
        # loader's byte store can ask for any sidecar it likes. notes_a is handed
        # exactly that egress — and the write still cannot land, because the
        # root's `callable_by` does not accept it. The defence is the root's
        # ingress, not a check of the claimed id.
        - id: notes_a
          handler_module: file_bridge.tools
          callable_by: {$parent: "*"}
          allow: ['.']
          root: notes/a
          ingress_rule: allow_all_ingress
          can_call:
            $root: [persist_blob]
        - id: space_a
          handler_module: file_bridge.tools
          callable_by: {$parent: "*"}
          allow: ['.']
          root: rooms/a
          ingress_rule: allow_all_ingress

  # The mirror image of wing_a, one directory over. Nothing wires the two: no
  # `can_call` names anything across the wings, so every cross-wing probe below
  # is refused by the sender's own egress — the roster IS the boundary.
  - id: wing_b
    file: wing_b.yaml
    meta:
      can_call: {$subtree: "*"}
    manifest:
      agents:
        - id: notes_b
          handler_module: file_bridge.tools
          callable_by: {$parent: "*"}
          allow: ['.']
          root: notes/b
          ingress_rule: allow_all_ingress
        - id: space_b
          handler_module: file_bridge.tools
          callable_by: {$parent: "*"}
          allow: ['.']
          root: rooms/b
          ingress_rule: allow_all_ingress
