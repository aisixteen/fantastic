# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/engine_smoke.yaml`.


loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        # The persistence provider, DISCOVERED by match: a file_bridge whose
        # root resolves to the loader's own `.fantastic` dir
        # (kernel_state/tools.py `_find_store`, which walks the subtree).
        - id: store
          handler_module: file_bridge.tools
          allow: ['.']
          root: .fantastic
          ingress_rule: allow_all_ingress
        # Memory is plain FILES on a data store the worker edits directly.
        - id: memory
          handler_module: file_bridge.tools
          allow: ['.']
          root: memory
          ingress_rule: allow_all_ingress
          callable_by:
            worker: [write, read]
        - id: worker
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          can_call:
            memory: [write, read]
            quiet: [list]
        # `quiet` is reachable-looking and unreachable: worker's can_call names
        # it, quiet's callable_by does not name worker back.
        - id: quiet
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
        - id: island
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
