# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/credential_store.yaml`.

loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        # A credential store whose values live in a file UNDER THE RUNNING DIR —
        # never the user's home. One ref, bound to one host, readable by `reader`.
        - id: creds
          handler_module: credential_store.tools
          file: creds.yaml
          refs:
            openai:
              host: api.openai.com
              readers: [reader]
          callable_by:
            reader: [get, list]
            stranger: [get, list]

        # Two agent-origin callers the gate admits alike: only the ref's own
        # grant tells them apart.
        - id: reader
          handler_module: file_bridge.tools
          can_call:
            creds: [get, list]
        - id: stranger
          handler_module: file_bridge.tools
          can_call:
            creds: [get, list]
