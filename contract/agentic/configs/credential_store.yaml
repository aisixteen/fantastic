# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/credential_store.yaml`.

loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        # A credential store whose values live in a file at an ABSOLUTE path in
        # the running dir — `$workdir` is the runner's (the test's tmp dir), never
        # the user's home; a relative `file` is refused. One ref, DECLARED here
        # (`set` never creates one), bound to one host. Who may call is the
        # call gate alone: `reader` is admitted, `stranger` is not.
        - id: creds
          handler_module: credential_store.tools
          file: $workdir/creds.yaml
          refs:
            openai:
              host: api.openai.com
          callable_by:
            reader: [get, list]

        # Two agent-origin callers that both name the store: only the store's
        # `callable_by` tells them apart.
        - id: reader
          handler_module: file_bridge.tools
          can_call:
            creds: [get, list]
        - id: stranger
          handler_module: file_bridge.tools
          can_call:
            creds: [get, list]
