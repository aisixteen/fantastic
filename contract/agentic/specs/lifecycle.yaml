# Test spec for `configs/lifecycle.yaml` — WHAT THIS SUITE ASSERTS.
# The kernel config it runs against is a separate, deployable file; nothing
# test-specific may leak into it.
config: lifecycle.yaml

name: lifecycle
description: >
  Work in flight and agents at their end of life. The roster declares one
  dispatch that STAYS in flight, one agent wired to watch and kill it, one open
  bundle to ask a nonsense question of, one agent to delete out from under a
  live grant, and one nobody may call. Everything the validator claims is a
  reply this shape can actually produce: a cancelled caller learns, a terminal
  task and a deleted agent both absorb, and the four failure classes stay four
  distinguishable shapes.

requirements: [C14, C15, C16]

expect:
  hydration: ok
  reboot: true
  closed_roster_sender: warden
  steps:
    - name: the task table is readable through a granted edge
      reach: {from: warden, to: $root, send: {type: ps}}
      expect: {allow: true}
    - name: an open bundle answers a granted verb
      reach: {from: warden, to: open_fs, send: {type: list, path: ""}}
      expect: {allow: true}
    - name: the doomed agent is reachable while it exists
      reach: {from: warden, to: doomed, send: {type: list, path: ""}}
      expect: {allow: true}
    - name: an ingress-open agent nobody was granted is still unreachable
      reach: {from: warden, to: stranger, send: {type: list, path: ""}}
      expect: {allow: false, side: egress}
    - name: being cancellable BY warden confers no reach back onto warden
      reach: {from: slowbot, to: warden, send: {type: list, path: ""}}
      expect: {allow: false, side: egress}

    # ── C14 · a cancel stops a live dispatch BEFORE its next step ──
    #
    # THE CASE THE `start`/`collect` VERBS EXIST FOR. Every other assertion in
    # this corpus is about a call that has already returned; this one is about a
    # call that is still running, which no verdict list can express.

    - name: a slow dispatch is launched and left IN FLIGHT
      start: {name: job, from: warden, to: slowbot, send: {type: slow}}
    - name: and it is really running — visible in the kernel-wide task table
      await_task: {name: job, agent: slowbot}
      because: C14

    - name: cancel names the pid it killed
      operator: {to: kernel, send: {type: cancel, task_id: "$job.id"}}
      expect: {contains: {cancelled: true, killed.*: "$job.id"}}
      because: C14

    - name: the blocked caller is RESOLVED with cancelled, not raised at, and
            never gets the handler's own reply
      collect: {name: job}
      expect: {status: cancelled, contains: {cancelled: true}}
      because: C14

    - name: and the killed dispatch has left the live table
      reach: {from: warden, to: kernel, send: {type: ps}}
      expect: {allow: true, not_contains: {tasks.*.verb: slow}}
      because: C14

    # ── C15 · a terminal task and a deleted agent both ABSORB ──────
    #
    # Two different non-existences that must not be confused: a task that is
    # already over, and an agent that is gone. Both absorb further calls; only
    # one of them is a member of the roster at all.

    - name: a second cancel of a finished task is a no-op, not an error
      operator: {to: kernel, send: {type: cancel, task_id: "$job.id"}}
      expect: {contains: {cancelled: false}}
      because: C15

    - name: cancelling an id that never existed is the same no-op
      operator: {to: kernel, send: {type: cancel, task_id: "slowbot:deadbeef"}}
      expect: {contains: {cancelled: false}}
      because: C15

    - name: warden holds a standing grant on `doomed` while it still exists
      reach: {from: warden, to: doomed, send: {type: list, path: ""}}
      expect: {allow: true}
      because: C15

    - name: the operator deletes it — the grant is deliberately left standing
      operator: {to: kernel, send: {type: delete_agent, id: doomed}}
      expect: {contains: {deleted: true}}

    - name: so the refusal is about NON-EXISTENCE, not about authority
      reach: {from: warden, to: doomed, send: {type: list, path: ""}}
      expect: {reason: unknown_agent}
      because: C15

    # ── C16 · the failure classes stay distinguishable ─────────────
    #
    # Four different "no" answers a caller must be able to tell apart, because
    # each has a different fix: an unknown AGENT, an unknown VERB, a payload with
    # no verb at all, and a gate DENIAL. Collapsing any two would make the fix
    # unguessable.

    - name: an unknown agent names the class `unknown_agent`
      reach: {from: warden, to: no_such_agent, send: {type: list, path: ""}}
      expect: {reason: unknown_agent}
      because: C16

    - name: an unknown verb on a REACHABLE agent is the bundle's answer, not the gate's
      reach: {from: warden, to: open_fs, send: {type: frobnicate}}
      expect: {allow: true, contains: {}}
      because: C16

    - name: a payload with no type at all collapses into the same unknown-verb class
      reach: {from: warden, to: open_fs, send: {type: ""}}
      expect: {allow: true}
      because: C16

    - name: and a gate denial is none of those — it names a SIDE
      reach: {from: slowbot, to: open_fs, send: {type: list, path: ""}}
      expect: {allow: false, side: egress}
      because: C16
