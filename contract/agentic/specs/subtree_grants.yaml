# Test spec for `configs/subtree_grants.yaml` — WHAT THIS SUITE ASSERTS.
# The kernel config it runs against is a separate, deployable file; nothing
# test-specific may leak into it.
config: subtree_grants.yaml

name: subtree_grants
description: >
  Two grant forms for agents that are spawned DYNAMICALLY under one owner (a web
  leg's terminals and AIs), so nobody has to name each of them on either side.
  INGRESS: `"$subtree:X"` in a target's `callable_by` accepts X and every live
  descendant of X, resolved at call time — an agent created after the grant is
  covered. EGRESS: a HERITABLE `can_call` entry `{<target>: {verbs: [...], for:
  descendants}}` on X lets X's descendants call that target — never X itself.
  Both behave like structural tokens for privileged verbs: a NAMED verb covers
  one, `*` never does on egress.

requirements: [SUB-1, SUB-2, SUB-3, SUB-4, SUB-5, SUB-6]

expect:
  hydration: ok
  reboot: true
  closed_roster_sender: outsider
  steps:
    # ── setup: the owner and its children, created AFTER hydration ───────
    - name: the owner carries a heritable egress entry on `served`
      operator:
        to: kernel
        send:
          type: create_agent
          parent_id: kernel
          id: hub
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          can_call: {served: {verbs: [list, allow, allowed], for: descendants}}
      expect: {contains: {id: hub}}
    - name: a child spawned under the owner
      operator:
        to: kernel
        send: {type: create_agent, parent_id: hub, id: kid, handler_module: file_bridge.tools, allow: ['.'], ingress_rule: allow_all_ingress}
      expect: {contains: {id: kid}}

    # ── SUB-1 / SUB-3 · both halves come from the owner ──────────────────
    - name: a descendant reaches the target — heritable egress + $subtree ingress
      reach: {from: kid, to: served, send: {type: list, path: ""}}
      expect: {allow: true}
      because: SUB-1
    - name: the holder of the heritable entry is NOT covered by it
      reach: {from: hub, to: served, send: {type: list, path: ""}}
      expect: {allow: false, side: egress}
      because: SUB-3
    - name: a verb the heritable entry does not name dies at egress
      reach: {from: kid, to: served, send: {type: mkdir, path: no_such_grant}}
      expect: {allow: false, side: egress}
      because: SUB-3

    # ── SUB-4 · named privileged verbs are covered ──────────────────────
    - name: a NAMED privileged verb crosses both forms
      reach: {from: kid, to: served, send: {type: allow, path: probe.txt}}
      expect: {allow: true}
      because: SUB-4
    - name: a non-privileged named verb crosses too
      reach: {from: kid, to: served, send: {type: allowed}}
      expect: {allow: true}
      because: SUB-4

    # ── SUB-1 · resolved at CALL time, at any depth ──────────────────────
    - name: a grandchild spawned after every grant was written
      operator:
        to: kernel
        send: {type: create_agent, parent_id: kid, id: grandkid, handler_module: file_bridge.tools, allow: ['.'], ingress_rule: allow_all_ingress}
      expect: {contains: {id: grandkid}}
    - name: is covered by both forms with no record edit
      reach: {from: grandkid, to: served, send: {type: list, path: ""}}
      expect: {allow: true}
      because: SUB-1

    # ── SUB-2 · nobody outside the subtree ───────────────────────────────
    - name: an agent OUTSIDE the subtree is refused by the target even with its own egress
      reach: {from: outsider, to: served, send: {type: list, path: ""}}
      expect: {allow: false, side: ingress}
      because: SUB-2

    # ── SUB-4 · `*` never covers a privileged verb on egress ────────────
    - name: an owner whose heritable entry is `*`
      operator:
        to: kernel
        send:
          type: create_agent
          parent_id: kernel
          id: hub_wild
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          can_call: {served: {verbs: ["*"], for: descendants}}
      expect: {contains: {id: hub_wild}}
    - operator:
        to: kernel
        send: {type: create_agent, parent_id: hub_wild, id: wild_kid, handler_module: file_bridge.tools, allow: ['.'], ingress_rule: allow_all_ingress}
      expect: {contains: {id: wild_kid}}
    - name: "`*` covers an ordinary verb"
      reach: {from: wild_kid, to: served, send: {type: list, path: ""}}
      expect: {allow: true}
      because: SUB-4
    - name: "`*` does not cover a privileged verb"
      reach: {from: wild_kid, to: served, send: {type: allow, path: probe2.txt}}
      expect: {allow: false, side: egress}
      because: SUB-4

    # ── SUB-5 · conferring a heritable entry ─────────────────────────────
    - name: a holder of the entry confers a subset of it to its own child
      reach:
        from: hub
        to: kernel
        send:
          type: create_agent
          parent_id: hub
          id: hub_child
          handler_module: file_bridge.tools
          can_call: {served: {verbs: [list], for: descendants}}
      expect: {allow: true}
      because: SUB-5
    - name: an agent that only BENEFITS from the entry cannot confer it
      reach:
        from: kid
        to: kernel
        send:
          type: create_agent
          parent_id: kid
          id: kid_child
          handler_module: file_bridge.tools
          can_call: {served: {verbs: [list], for: descendants}}
      expect: {allow: false, side: delegation}
      because: SUB-5
    - name: a holder cannot confer MORE than it holds
      reach:
        from: hub
        to: kernel
        send:
          type: create_agent
          parent_id: hub
          id: hub_child2
          handler_module: file_bridge.tools
          can_call: {served: {verbs: [list, disallow], for: descendants}}
      expect: {allow: false, side: delegation}
      because: SUB-5

    # ── SUB-6 · shapes refused at write time ─────────────────────────────
    - name: "`$subtree:` is callable_by-only"
      operator: {to: kernel, send: {type: update_agent, id: outsider, can_call: {"$subtree:hub": [list]}}}
      expect: {reason: invalid_meta}
      because: SUB-6
    - name: "`$subtree:` needs an id"
      operator: {to: kernel, send: {type: update_agent, id: served, callable_by: {"$subtree:": [list]}}}
      expect: {reason: invalid_meta}
      because: SUB-6
    - name: "`$subtree:` names a LOCAL id"
      operator: {to: kernel, send: {type: update_agent, id: served, callable_by: {"$subtree:g1|x": [list]}}}
      expect: {reason: invalid_meta}
      because: SUB-6
    - name: "a heritable entry is `for: descendants`, nothing else"
      operator: {to: kernel, send: {type: update_agent, id: hub, can_call: {served: {verbs: [list], for: siblings}}}}
      expect: {reason: invalid_meta}
      because: SUB-6
    - name: a heritable entry names a literal target, not a token
      operator: {to: kernel, send: {type: update_agent, id: hub, can_call: {"$parent": {verbs: [list], for: descendants}}}}
      expect: {reason: invalid_meta}
      because: SUB-6
    - name: a heritable entry is can_call-only
      operator: {to: kernel, send: {type: update_agent, id: served, callable_by: {hub: {verbs: [list], for: descendants}}}}
      expect: {reason: invalid_meta}
      because: SUB-6
