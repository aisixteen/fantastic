# Test spec for `configs/credential_store.yaml` — WHAT THIS SUITE ASSERTS.
config: credential_store.yaml

name: credential_store
description: >
  Secrets by ref (owner, 2026-10-01). `set` stores a value for a DECLARED ref and
  `get` answers it — the value rides the call and is recorded like any call's
  (owner, 2026-10-04). There are no per-ref access lists: any caller the call gate
  admits reaches a declared ref, and a caller it refuses never reaches the store.
  A read pinned to a host is refused unless the ref is bound to that host — the
  host of its DECLARATION, which `set` never takes. Forgetting drops the value and
  keeps the declaration; a ref is declared (and undeclared) only on the store's
  record (update_agent).

requirements: [CRED-1, CRED-2, CRED-3, CRED-4, CRED-5]

expect:
  hydration: ok
  reboot: true
  steps:
    - name: a set naming a host is refused — the host is the declaration's
      operator:
        to: creds
        send: {type: set, ref: openai, host: evil.example.net, fields: {api_key: sk-live-0123456789abcdef}}
      expect: {reason: bad_arg, error_contains: "takes no host"}
      because: CRED-4
    - name: a set stores the value under the declared host
      operator:
        to: creds
        send: {type: set, ref: openai, fields: {api_key: sk-live-0123456789abcdef}}
      expect: {status: completed, contains: {host: api.openai.com, fields.*: api_key}}
      because: CRED-1
    - name: a get answers the stored value
      operator: {to: creds, send: {type: get, ref: openai}}
      expect: {status: completed, mentions: sk-live-0123456789abcdef}
      because: CRED-2
    - name: a caller the store does not accept never reaches it
      reach: {from: stranger, to: creds, send: {type: get, ref: openai}}
      expect: {allow: false, side: ingress}
      because: CRED-3
    - name: nor its listing
      reach: {from: stranger, to: creds, send: {type: list}}
      expect: {allow: false, side: ingress}
      because: CRED-3
    - name: an admitted caller reads the value
      reach: {from: reader, to: creds, send: {type: get, ref: openai}}
      expect: {allow: true, mentions: sk-live-0123456789abcdef}
      because: CRED-3
    - name: the admitted caller's listing is metadata, never the value
      reach: {from: reader, to: creds, send: {type: list}}
      expect: {allow: true, contains: {refs.*.ref: openai, refs.*.host: api.openai.com}, absent: sk-live-0123456789abcdef}
      because: CRED-3
    - name: a read pinned to another host is refused
      operator:
        to: creds
        send: {type: get, ref: openai, host: "https://evil.example.net/v1"}
      expect: {reason: bad_arg, error_contains: "is bound to host"}
      because: CRED-4
    - name: a read pinned to the ref's host answers
      operator:
        to: creds
        send: {type: get, ref: openai, host: "https://api.openai.com/v1/responses"}
      expect: {status: completed, mentions: sk-live-0123456789abcdef}
      because: CRED-4
    - name: forget drops the value
      operator: {to: creds, send: {type: forget, ref: openai}}
      expect: {status: completed, contains: {ref: openai}}
      because: CRED-5
    - name: and the ref stays declared, with no value
      operator: {to: creds, send: {type: get, ref: openai}}
      expect: {reason: not_found, error_contains: "has no value in the backend"}
      because: CRED-5
    - name: the declaration survived the forget
      reach: {from: reader, to: creds, send: {type: list}}
      expect: {allow: true, contains: {refs.*.ref: openai, refs.*.host: api.openai.com}}
      because: CRED-5
    - name: so a set stores a value again
      operator:
        to: creds
        send: {type: set, ref: openai, fields: {api_key: sk-live-0123456789abcdef}}
      expect: {status: completed, contains: {host: api.openai.com, fields.*: api_key}}
      because: CRED-5
    - name: but never declares a ref — only update_agent does
      operator:
        to: creds
        send: {type: set, ref: undeclared, fields: {api_key: sk-live-0123456789abcdef}}
      expect: {reason: not_found, error_contains: "no such ref"}
      because: CRED-5
