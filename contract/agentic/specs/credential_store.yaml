# Test spec for `configs/credential_store.yaml` — WHAT THIS SUITE ASSERTS.
config: credential_store.yaml

name: credential_store
description: >
  Secrets by ref (owner, 2026-10-01). A value enters the store only from a call
  that marks it secret and leaves only into a call that marks the answer secret,
  so no record ever carries it. A ref answers the agents its grant names and, to
  anyone else, does not exist. A read pinned to a host is refused unless the ref
  is bound to that host — the host of its DECLARATION, which `set` never takes.
  Forgetting drops the value and keeps the declaration; a ref is declared (and
  undeclared) only on the store's record (update_agent).

requirements: [CRED-1, CRED-2, CRED-3, CRED-4, CRED-5]

expect:
  hydration: ok
  reboot: true
  steps:
    - name: a value sent unmarked is refused — it would land in every record
      operator:
        to: creds
        send: {type: set, ref: openai, fields: {api_key: sk-live-0123456789abcdef}}
      expect: {reason: bad_arg, error_contains: "mark the values secret"}
      because: CRED-1
    - name: a set naming a host is refused — the host is the declaration's
      operator:
        to: creds
        send: {type: set, ref: openai, host: evil.example.net, fields: {api_key: sk-live-0123456789abcdef}}
        secret: [payload.fields]
      expect: {reason: bad_arg, error_contains: "takes no host"}
      because: CRED-4
    - name: marked, it is stored under the declared host
      operator:
        to: creds
        send: {type: set, ref: openai, fields: {api_key: sk-live-0123456789abcdef}}
        secret: [payload.fields]
      expect: {status: completed, contains: {host: api.openai.com, fields.*: api_key}}
      because: CRED-1
    - name: no record of the call carries the value
      operator: {to: kernel, send: {type: ledger}}
      expect: {absent: sk-live-0123456789abcdef}
      because: CRED-1
    - name: an unmarked read is refused
      operator: {to: creds, send: {type: get, ref: openai}}
      expect: {reason: bad_arg, error_contains: "mark the answer secret"}
      because: CRED-2
    - name: a marked read answers for real
      operator:
        to: creds
        send: {type: get, ref: openai}
        id: read-openai  # named: the settle keeps the whole (masked) result
        secret: [result]
      expect: {status: completed, mentions: sk-live-0123456789abcdef}
      because: CRED-2
    - name: and is recorded as the placeholder
      operator: {to: kernel, send: {type: ledger}}
      expect: {absent: sk-live-0123456789abcdef, mentions: "<secret>"}
      because: CRED-2
    - name: to an agent the ref does not name, the ref does not exist
      reach: {from: stranger, to: creds, send: {type: get, ref: openai}}
      expect: {allow: true, reason: not_found, error_contains: "no such ref"}
      because: CRED-3
    - name: nor does its listing show it
      reach: {from: stranger, to: creds, send: {type: list}}
      expect: {allow: true, absent: openai}
      because: CRED-3
    - name: the named reader passes the grant — refused only for the missing mark
      reach: {from: reader, to: creds, send: {type: get, ref: openai}}
      expect: {allow: true, reason: bad_arg, error_contains: "mark the answer secret"}
      because: CRED-3
    - name: the reader's listing is metadata, never the value
      reach: {from: reader, to: creds, send: {type: list}}
      expect: {allow: true, contains: {refs.*.ref: openai, refs.*.host: api.openai.com}, absent: sk-live-0123456789abcdef}
      because: CRED-3
    - name: a read pinned to another host is refused
      operator:
        to: creds
        send: {type: get, ref: openai, host: "https://evil.example.net/v1"}
        secret: [result]
      expect: {reason: bad_arg, error_contains: "is bound to host"}
      because: CRED-4
    - name: a read pinned to the ref's host answers
      operator:
        to: creds
        send: {type: get, ref: openai, host: "https://api.openai.com/v1/responses"}
        secret: [result]
      expect: {status: completed, mentions: sk-live-0123456789abcdef}
      because: CRED-4
    - name: forget drops the value
      operator: {to: creds, send: {type: forget, ref: openai}}
      expect: {status: completed, contains: {ref: openai}}
      because: CRED-5
    - name: and the ref stays declared, with no value
      operator:
        to: creds
        send: {type: get, ref: openai}
        secret: [result]
      expect: {reason: not_found, error_contains: "has no value in the backend"}
      because: CRED-5
    - name: its reader still holds the grant — the declaration survived the forget
      reach: {from: reader, to: creds, send: {type: list}}
      expect: {allow: true, contains: {refs.*.ref: openai, refs.*.host: api.openai.com}}
      because: CRED-5
    - name: so a set stores a value again
      operator:
        to: creds
        send: {type: set, ref: openai, fields: {api_key: sk-live-0123456789abcdef}}
        secret: [payload.fields]
      expect: {status: completed, contains: {host: api.openai.com, fields.*: api_key}}
      because: CRED-5
    - name: but never declares a ref — only update_agent does
      operator:
        to: creds
        send: {type: set, ref: undeclared, fields: {api_key: sk-live-0123456789abcdef}}
        secret: [payload.fields]
      expect: {reason: not_found, error_contains: "no such ref"}
      because: CRED-5
