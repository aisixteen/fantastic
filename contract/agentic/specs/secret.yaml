# Test spec for `configs/secret.yaml` — WHAT THIS SUITE ASSERTS.
config: secret.yaml

name: secret
description: >
  Secret values on a call (owner, 2026-10-01). The CALLER marks paths on the
  batch item; the target is handed the real payload and the caller the real
  reply, while every record of the call — the ledger read-back included —
  carries `<secret>` in their place. A malformed mark is refused before anything
  runs, and the verb itself can never be hidden.

requirements: [SEC-1, SEC-2, SEC-3, SEC-4]

expect:
  hydration: ok
  reboot: true
  steps:
    - name: the keeper reaches the vault through its granted edge
      reach: {from: keeper, to: vault, send: {type: read, path: key.txt}}
      expect: {allow: true}
    - name: a verb outside the grant is refused at egress
      reach: {from: keeper, to: vault, send: {type: list, path: ""}}
      expect: {allow: false, side: egress}
    - name: a write whose bytes are marked secret is done for real
      operator:
        to: vault
        send: {type: write, path: key.txt, bytes_utf8: sk-live-0123456789abcdef}
        secret: [payload.bytes]
      expect: {status: completed}
      because: SEC-1
    - name: the target got the REAL value — it is on disk
      operator: {to: vault, send: {type: read, path: key.txt}}
      expect: {mentions: sk-live-0123456789abcdef}
      because: SEC-1
    - name: no record of the call carries it; the placeholder stands in
      operator: {to: kernel, send: {type: ledger}}
      expect: {absent: sk-live-0123456789abcdef}
      because: SEC-2
    - name: a read whose RESULT is marked secret answers the caller for real
      operator:
        to: vault
        send: {type: read, path: key.txt}
        id: read-key
        secret: [result]
      expect: {status: completed, mentions: sk-live-0123456789abcdef}
      because: SEC-3
    - name: and is recorded as the placeholder
      operator: {to: kernel, send: {type: ledger}}
      expect: {absent: sk-live-0123456789abcdef, mentions: "<secret>"}
      because: SEC-3
    - name: the verb can never be hidden — refused before dispatch
      operator:
        to: vault
        send: {type: read, path: key.txt}
        secret: [payload.type]
      expect: {status: failed, reason: bad_arg, error_contains: "cannot hide payload.type"}
      because: SEC-4
    - name: a path that names nothing is refused — a typo would record the value
      operator:
        to: vault
        send: {type: read, path: key.txt}
        secret: [payload.pth]
      expect: {status: failed, reason: bad_arg, error_contains: "names nothing in the payload"}
      because: SEC-4
