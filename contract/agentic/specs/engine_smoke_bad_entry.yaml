# Test spec for `configs/engine_smoke_bad_entry.yaml` — WHAT THIS SUITE ASSERTS.
# The kernel config it runs against is a separate, deployable file; nothing
# test-specific may leak into it.
config: engine_smoke_bad_entry.yaml

name: engine_smoke_bad_entry
description: >
  An engine fixture, not a scenario. The other half of the verdict: a manifest
  that READS fine and names an entry the child bundle refuses. `create_agent`
  boots the loader, discards the reply and swallows the exception, so the create
  looks clean and the roster is silently partial — `good` exists, everything
  from `bogus` on never does. Only the explicit re-boot says so.

expect:
  hydration: boot_error
  error_contains: "is not a rule this bundle implements"
