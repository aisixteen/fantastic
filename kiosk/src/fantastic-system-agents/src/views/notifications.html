<style>
  body { margin: 0; padding: 14px 16px; font: 13px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif; color: #d8d8e4; background: transparent; }
  h2 { margin: 14px 0 6px; font: 600 11px ui-monospace, SFMono-Regular, monospace; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.55); }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); min-width: 0; }
  .item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .item.quiet { opacity: .5; }
  .item.critical b { color: #f7768e; }
  .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dim { color: rgba(255,255,255,.45); font-size: 11px; }
  button { font: inherit; font-size: 12px; color: #e6dcff; background: rgba(183,140,255,.16); border: 1px solid rgba(183,140,255,.45); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: rgba(183,140,255,.32); color: #fff; }
  .empty { color: rgba(255,255,255,.35); padding: 4px 0; }
  .err { color: #f7768e; }
</style>
<h2>Notifications</h2>
<div id="line" class="row"></div>
<div id="items"></div>
<div id="err" class="err"></div>
<script>
const ID = "notifications";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const send = async (msg) => { const r = await fantastic.send(ID, msg); $("err").textContent = r && r.error ? r.error : ""; };
function draw(st) {
  if (!st) return;
  if (!st.available) {
    $("line").innerHTML = `<span class="empty">${esc(st.why || "not available")}</span>`;
    $("items").innerHTML = "";
    return;
  }
  $("line").innerHTML = `<span class="grow dim">${esc(st.server)} · ${st.items.length} shown</span>` +
    `<button id="dnd">do not disturb: ${st.do_not_disturb ? "on" : "off"}</button><button id="all">dismiss all</button>`;
  $("dnd").onclick = () => send({ type: "set_dnd", on: !st.do_not_disturb });
  $("all").onclick = () => send({ type: "dismiss_all" });
  $("items").innerHTML = st.items.length ? st.items.slice().reverse().map((n) =>
    `<div class="item ${esc(n.urgency)}${n.quiet ? " quiet" : ""}"><div class="row"><b class="grow">${esc(n.summary)}</b><span class="dim">${esc(n.app)}</span><button data-d="${n.id}">dismiss</button></div>` +
    (n.body ? `<div class="dim">${esc(n.body)}</div>` : "") +
    (n.actions.length ? `<div class="row">${n.actions.map(([k, label]) => `<button data-i="${n.id}" data-k="${esc(k)}">${esc(label)}</button>`).join("")}</div>` : "") + `</div>`).join("") : `<div class="empty">no notifications</div>`;
  for (const b of $("items").querySelectorAll("[data-d]")) b.onclick = () => send({ type: "dismiss", id: Number(b.dataset.d) });
  for (const b of $("items").querySelectorAll("[data-i]")) b.onclick = () => send({ type: "invoke", id: Number(b.dataset.i), action: b.dataset.k });
}
fantastic.watch(ID, (ev) => { if (ev && ev.type === "state") draw(ev.state); });
fantastic.send(ID, { type: "state" }).then(draw);
</script>
