<style>
  body { margin: 0; padding: 14px 16px; font: 13px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif; color: #d8d8e4; background: transparent; }
  h2 { margin: 14px 0 6px; font: 600 11px ui-monospace, SFMono-Regular, monospace; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.55); }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); min-width: 0; }
  .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dim { color: rgba(255,255,255,.45); font-size: 11px; }
  code { font: 12px ui-monospace, SFMono-Regular, monospace; }
  button { font: inherit; font-size: 12px; color: #e6dcff; background: rgba(183,140,255,.16); border: 1px solid rgba(183,140,255,.45); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: rgba(183,140,255,.32); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .empty { color: rgba(255,255,255,.35); padding: 4px 0; }
  .err { color: #f7768e; }
  input[type=range] { flex: 0 0 120px; accent-color: #b78cff; }
  .vol { flex: 0 0 34px; text-align: right; font: 12px ui-monospace, SFMono-Regular, monospace; color: rgba(255,255,255,.65); }
  button.on { background: rgba(183,140,255,.42); color: #fff; }
</style>
<h2>Outputs</h2>
<div id="sinks"></div>
<h2>Inputs</h2>
<div id="sources"></div>
<div id="err" class="err"></div>
<script>
const ID = "audio";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function send(msg) {
  const r = await fantastic.send(ID, msg);
  $("err").textContent = r && r.error ? r.error : "";
  if (r && !r.error) draw(r);
}
function rows(list, empty) {
  if (!list.length) return `<div class="empty">${empty}</div>`;
  return list.map((d) => `<div class="row" data-id="${d.id}">` +
    `<span class="grow" title="${esc(d.name)}">${esc(d.description)}</span>` +
    `<input type="range" min="0" max="1.5" step="0.01" value="${d.volume}">` +
    `<span class="vol">${Math.round(d.volume * 100)}%</span>` +
    `<button data-a="mute" class="${d.muted ? "on" : ""}">${d.muted ? "muted" : "mute"}</button>` +
    `<button data-a="default" class="${d.default ? "on" : ""}"${d.default ? " disabled" : ""}>default</button>` +
    `</div>`).join("");
}
function bind(box, list) {
  for (const row of box.querySelectorAll(".row")) {
    const id = Number(row.dataset.id);
    const d = list.find((x) => x.id === id);
    const range = row.querySelector("input");
    range.oninput = () => { row.querySelector(".vol").textContent = `${Math.round(range.value * 100)}%`; };
    range.onchange = () => send({ type: "set_volume", id, volume: Number(range.value) });
    row.querySelector('[data-a="mute"]').onclick = () => send({ type: "set_mute", id, muted: !d.muted });
    row.querySelector('[data-a="default"]').onclick = () => send({ type: "set_default", id });
  }
}
function draw(st) {
  if (!st) return;
  if (!st.available) {
    $("sinks").innerHTML = `<div class="empty">${esc(st.why || "not available")}</div>`;
    $("sources").innerHTML = "";
    return;
  }
  $("sinks").innerHTML = rows(st.sinks, "no outputs");
  $("sources").innerHTML = rows(st.sources, "no inputs");
  bind($("sinks"), st.sinks);
  bind($("sources"), st.sources);
}
fantastic.watch(ID, (ev) => { if (ev && ev.type === "state") draw(ev.state); });
fantastic.send(ID, { type: "state" }).then(draw);
</script>
