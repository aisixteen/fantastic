# plan item id → what proves it.
#
# `capture` selectors are `family/<file glob>`, optionally with a JSON path or a
# text anchor. `unit` twins are `file::test` — a proof kind for items with NO
# observable wire effect, where the proof is that the named twin exists, pins the
# python text verbatim, and the §5.9 suites are green.
#
# `diff.py --check-proofs` reads every item id out of `tmp/py_parity_plan.md` and
# reports:
#   * an id with no entry here                → UNPROVEN (an item nothing measures)
#   * an entry whose selector matches no file → STALE (a selector pointing nowhere)
# Both are failures of the harness, not of the port.
#
# The maps below are §5.4's file → item maps, transcribed. Where §5.4 gives a
# family a single list for a file, every id in that list selects that file.

version: 3

