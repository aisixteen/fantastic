# ── proof: unit — no observable wire effect ──────────────────────────────────
# Pass = the named twin EXISTS, `diff.py` greps its name in its file, and the
# §5.9 suites are green. These are the items §5.5 lists.
unit:
  A0.1: {rust: "crates/fantastic-bundle/src/pyfmt.rs::py_repr", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::pyRepr"}
  A0.2: {rust: "crates/fantastic-bundle/src/pyfmt.rs::py_str", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::pyStr"}
  A0.3: {rust: "crates/fantastic-bundle/src/pyfmt.rs::py_truthy", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::pyTruthy"}
  A0.4: {rust: "crates/fantastic-bundle/src/pyfmt.rs::py_json_dumps", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::pyJSONDumps"}
  A0.5: {rust: "crates/fantastic-bundle/src/pyfmt.rs::os_error_str", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::osErrorStr"}
  A0.6: {rust: "crates/fantastic-bundle/src/pyfmt.rs::py_int", swift: "Tests/FantasticJSONTests/PyFormatTests.swift::pyInt"}
  A5.9: {rust: "crates/bundles/fantastic-scheduler/src/tests.rs", swift: "Tests/FantasticSchedulerTests"}
  A5.12: {rust: "crates/bundles/fantastic-scheduler/src/tests.rs", swift: "Tests/FantasticSchedulerTests"}
  A7.10: {rust: "crates/bundles/fantastic-bridge/src/tests.rs", swift: "Tests/FantasticBridgeTests"}
  A7.24: {rust: "crates/bundles/fantastic-bridge/src/tests.rs", swift: "Tests/FantasticBridgeTests"}
  A11.30: {rust: "crates/bundles/fantastic-web/src/tests.rs", swift: "Tests/FantasticWebTests"}
  B2.10: {rust: "crates/bundles/fantastic-ai-core/src/tests.rs", swift: "Tests/FantasticAICoreTests"}
  B2.19: {rust: "crates/bundles/fantastic-ai-core/src/tests.rs", swift: "Tests/FantasticAICoreTests"}
  C44: {rust: "crates/fantastic-kernel/src/tests.rs", swift: "Tests/FantasticKernelTests", note: "records under 64 KiB in every capture"}
  C49: {rust: "crates/fantastic-kernel/src/tests.rs", swift: "Tests/FantasticKernelTests"}
  C51: {rust: "crates/fantastic-kernel/src/tests.rs", swift: "Tests/FantasticKernelTests"}
  C82: {rust: "crates/fantastic-cli/src/tests.rs", swift: "Tests/FantasticCliBundleTests"}

# ── proof: capture+unit — the capture may not reach it every run ─────────────
capture_and_unit:
  A5.8: "a cancelled fire is best effort"
  B1.18: "the ctx chain may not reach the backstop"
  A13.18: "slow only (--slow)"

# ── proof: none — open until the owner records a decision ────────────────────
no_proof:
  # §9.2's "stderr lines of A15.1/A15.2/C87" row, unchanged: no capture drives a
  # malformed bridge frame, a failing scheduler persist, a raising subscriber or a
  # failing shutdown hook, and A15.3 is a LOG FORMAT the harness does not read as
  # a comparable document. These need a family that can make the kernel fail
  # INSIDE a hook; the harness has no such lever, so they are named open here
  # rather than given a selector that would pass by never matching.
  A15.1: "no capture drives a malformed inbound bridge frame (§9.2)"
  A15.2: "no capture makes a scheduler persist fail (§9.2)"
  A15.3: "rust log FORMAT; not a document this diff compares (§9.2)"
  C87: "no capture makes a subscriber raise or a shutdown hook fail (§9.2)"
