# Normalisation rules. `diff.py` implements them; this file is the CONTRACT.
#
# Every rule runs identically on python, rust and swift — a rule that fires on
# one runtime and not another is a rule that manufactures agreement. Every
# placeholder keeps SHAPE and TYPE (`<ID#3:int>` is not `<ID#3:str>`), so a
# format item stays diffable after the value is gone.
#
# Each rule carries:
#   why          — what it hides, and why hiding it is not hiding a difference
#   must_not_hide — the items that would become invisible if the rule were wider
#                   than it is. A rule that starts hiding one of these is broken,
#                   whatever the diff then says.
#   landed_gate  — the rule is DELETED once this item is in landed.yaml (it exists
#                  only to bridge a port that has not landed yet).
#
# NEVER NORMALISED, because each is itself an item: key order, value types, JSON
# spacing, the escaping of raw frames and headers, header order and presence,
# status codes, exit codes, stdout vs stderr, close codes, and the FORMAT of
# send_id / serial / corr / ws-client ids.

version: 10

rules:
  - id: N1
    name: root_alias
    why: >
      Rust and swift called the root `core` before the port; python calls it
      `kernel_state`. Until C12 lands in a runtime, every reply that names the
      root differs for that one reason and buries everything else in the file.
      Whole-token only — `core` inside `fantastic-core`, `core.py` or a sentence
      is left alone.
    landed_gate: C12
    enabled_by_flag: --root-alias
    pattern: '(?<![\w./-])core(?![\w.-])'
    replacement: kernel_state
    applies_to: [string_values, object_keys, text]
    must_not_hide:
      - C12   # the root handler module and the root frame itself
      - C2    # the root reflect shape
      - A14.7 # `reflect core` / `reflect kernel_state` from the CLI

  - id: N2
    name: runtime_token
    why: >
      The root reflect and the cli intro line name the runtime they are. That is
      correct behaviour and differs by definition; the rest of both documents is
      not.
    paths:
      - $.runtime
      - cli intro_booting runtime token
      # …and `runtime=<name>` in TEXT. The root reflect is rendered into every
      # system prompt, so the token sits in every recorded request body.
      - 'runtime=(python|rust|swift) as a whole token'
      # …and the same field as JSON INSIDE TEXT, quoted once or
      # more: `"runtime": "python"` in a cli stdout, `\"runtime\":\"python\"`
      # in a recorded REST body.
      - '"runtime": "(python|rust|swift)" inside text, any quoting depth'
    # A `stdout_bytes` whose stdout is recorded only as a HEAD (so
    # N10 cannot see the text it counts) is compared PAIRWISE and forgiven when it
    # differs by EXACTLY len(python name) − len(port name): the reflect it counts
    # prints its runtime once. Any other difference is a line.
    name_length_delta: stdout_bytes, exact
    replacement: <RUNTIME>
    must_not_hide:
      - A9.5  # the SHAPE of the intro line, which keeps its other fields
      - C2

  - id: N3
    name: guid
    why: >
      A kernel mints its own guid at first boot. Nothing about the value is
      comparable; that one was minted, and its SHAPE, are.
    keys: [guid, owner_guid, partner_guid]
    shape: '^[0-9a-f]{32}$'
    #: …and in TEXT, as `guid=<hex32>` / `"guid": "<hex32>"`. The root reflect is
    #: quoted verbatim into every system prompt, into cli stdout and into HTTP
    #: bodies recorded as strings, where the key-based pass never sees it.
    #: …and as the kernel half of a qualified caller, `<hex32>|<agent>` — every
    #: bridge call names its sender that way; the agent half stays compared.
    text_forms: ['guid[:=]\s*"?[0-9a-f]{32}', '[0-9a-f]{32}(?=\|)']
    replacement: <GUID:hex32>
    literal_when_shape_mismatch: true
    must_not_hide:
      - A7.16  # an identity the operator SET, which is not minted
      - C12

  - id: N4
    name: minted_ids
    why: >
      Row ids, task ids and pids come from a counter whose starting point depends
      on how many executions the boot itself ran. Renaming them per file by first
      appearance keeps every RELATIONSHIP (which row a reply cites, which parent a
      fold names) while dropping a number that means nothing across runtimes. The
      TYPE is kept in the placeholder because an int id and a digit-string id are
      a difference (C17, A4.20, B5.9).
    keys: [id, ids, parent, task_id, job_id, message_id, pid, refs, expand, after, next,
           bundles_next, view_ids, killed, covers, msg, re]
    only_when: int or digit-string; never an agent-id string
    text_anchors:
      - '\[reply to (\d+)'
      # the ↑ arrow ESCAPED, as a frame's raw `text` carries it (`\u2191118`)
      - '\\+u2191(\d+)'
      - '↑(\d+)'
      - 'in batch (\d+)'
      - '<pid>(\d+)</pid>'
      - '<task_id>(\d+)</task_id>'
      - '<message_id>(\d+)</message_id>'
      - '\[fold (\d+) ·'
      - '\[recall (\d+) ·'
      - 'msg (\d+) · re (\d+)'
      - 'joined execution (\d+)'
      # the dedup note of a settled reply
      - 'reply in row (\d+)'
      - '^(\d+) · '
      # The same digest line reached as the RAW request body the stub recorded,
      # where the newline is still `\` `n` inside a json string and `^` never
      # sees it.
      - '\\n(\d+) · '
    id_lists:
      # The context_status projection and the grep hint the kernel writes into a
      # settled reply. Inside an `<ids>`/`<view_ids>` BLOCK only: `<to><item>5`
      # and `<options><item>true` carry values the HARNESS chose.
      - '<(ids|view_ids|refs|expand)>(<item>N</item>)+</\1>'
      # …and a ledger flush row's `covers`, quoted as embedded json by the memory
      # store's state event; singly or doubly quoted.
      - '\\?"(expand|ids|refs|view_ids|covers)\\?": [N, …]'
      # A row quoted as json inside a prompt (the fold prompt does this), reached
      # both singly and doubly quoted.
      - '\\?"(id|task_id|message_id|parent_row|row_id|msg|re)\\?": N'
    reservation_mark: >
      `next_id=<n>` in text → `next_id=<NEXT_ID>`. The id counter's RESERVATION
      MARK as the root record renders it into a system prompt: the kernel reserves
      ids in blocks and persists the block's end, so the mark says how many ids a
      run had consumed — and the loader's debounced persistence consumes a
      different number on every run (measured 2026-09-30, python self-diff:
      `next_id=2001` against `1001`, the prompt otherwise identical). Its presence
      and place stay compared.
    replacement: <ID#n:int> / <ID#n:str>
    doc_literals: >
      The kernel's OWN documentation examples, printed into every AI system
      prompt, are literals and are fenced off before any renaming:
      `[from solver_1 · to solver_2, solver_3 · msg 412]` → `msg <DOC:412>` and
      `<ids><item>12</item><item>15</item></ids>` → `<DOC:12>`/`<DOC:15>`. Renamed
      as ids, they shared a placeholder with a REAL row that happened to carry
      the same number on one run only (measured 2026-10-02, python self-diff,
      `ctx/req/ai_compact_main_t11.json`). Exact text only: an example whose
      number changed is renamed like any id, and is a line.
    never_rename:
      # Harness-chosen ids are deterministic: renaming them would hide a runtime
      # that echoed the WRONG one back.
      - 'wirecap-\d+'
      - 'p-.*'
      - 'x-.*'
      - 's-.*'
      - 'kv-.*'
      - 'CASE=.*'
      - 'reuse-1'
    must_not_hide:
      - C17   # the cursor TYPE a walk accepts and returns
      - A4.20 # `task_id` as an int
      - B5.9  # a pid rendered into prompt text

  - id: N5
    name: os_pids
    why: >
      A process id is the operating system's, not the kernel's. What the kernel
      does with it (report it, kill it, write it into a lock) is the item.
    keys: [pid]
    contexts: [lock.json, '(pid=N)', 'pid=N', 'pid N', 'kill N',
               '"pid":N inside an embedded json document']
    replacement: <OSPID>
    keep_literal: ['999999', '0']   # the stale-lock pids the HARNESS wrote
    must_not_hide:
      - A14.10  # a STALE lock's pid, which the harness WROTE (999999 / 0)

  - id: N6
    name: kernel_time
    why: >
      A timestamp is when the run happened. Its PRESENCE, its key, its type
      (float vs int vs ISO string) and its place in the reply are all kept — only
      the instant goes.
    keys: [ts, started_at, queued_at, created_at, next_run, last_run, elapsed, duration_ms]
    conditional_keys: [since, last_seen]   # only when kernel-minted
    also: ['messages.xml ts="…"', 'ISO-8601 in log lines', 'the HTTP `date` header value',
           'the same keys inside an EMBEDDED json document — a ws frame''s `text`,
            an HTTP body recorded as a string, and either of those quoted a
            second time inside a recorded request body']
    replacement: <TS:float|int|isostr>
    must_not_hide:
      - A5.6   # `next_run` relative to `interval_seconds`, kept as a TYPE
      - C42    # the persisted record's own time fields

  - id: N7
    name: random_tokens
    why: >
      Ids minted from randomness. Each is replaced BY SHAPE, and a value that
      does not match the shape stays literal and becomes a diff line — which is
      the point: the format of a send_id is an item, so a port that mints an
      8-hex id where python mints 11 base64url characters must show up.
    shapes:
      send_id: ['^[A-Za-z0-9_-]{11}$ → <SEND_ID:b64url11>',
                'snd_[0-9a-f]{8} → <SEND_ID:snd_hex8>',
                'snd_[0-9A-F]{8} → <SEND_ID:snd_HEX8>',
                'otherwise → <SEND_ID:len=N>']
      serial: '^[0-9a-f]{6}$ → <SERIAL:hex6>'
      schedule_id: 'sch_[0-9a-f]{6} → <SCH:hex6>'
      corr: '^<bridge_id>-(\d+)$ → <CORR:<bridge_id>-#n>'
      forward_frame_id: '<leg>-<hex12>-<n> → <leg>-<NONCE:hex12>-<n>   # the boot
        nonce of a bridge forward id (audit IO-5); the leg and the count stay compared'
      ws_client: '_ws_[0-9a-f]{6} → <WS_CLIENT:hex6>'
      correlation_pid: '<agent>:<hex8> → <CPID:hex8>   # a stream id too (`ai2:…`)'
      websocket_accept: 'Sec-WebSocket-Accept → <WS_ACCEPT>'
      websocket_key: 'Sec-WebSocket-Key → <WS_KEY>   # 16 random bytes the CLIENT
        mints per connection (RFC 6455 §4.1); the kernel chooses nothing about
        it, and what it derives from it IS compared, one line above'
      tmpdir: 'mkdtemp suffixes under $TMPDIR → <TMPSUFFIX>'
    keep: ['relay dir_<n>']
    #: send_id and serial are recognised inside an EMBEDDED json document
    #: too (`{"send_id":"<b64url11>"}` in a ws frame's `text`), singly or doubly
    #: quoted. Same shapes, same placeholders — a port that mints a different
    #: shape still becomes a diff line there.
    also_embedded: [send_id, serial]
    must_not_hide:
      - A7.27  # the correlation id FORMAT, which the shape preserves
      - C36    # a send_id carried into a row

  - id: N8
    name: ports
    why: >
      The OS picks the number; the harness picks the ROLE. Which role answered is
      the measurement — a reply naming the web2 port where python named main is a
      real difference and survives this rule.
    forms: ['<host>:N where <host> is an IPv4 literal, `localhost` or `[::1]`',
            'port as an integer VALUE',
            '`port` followed by `:`, `=` or a space, then N — `"port": 54928` in a
             persisted agent.yaml, `bound on port N` in a cli line']
    never: 'a bare `:N`. That form read `"max_tokens":4096` as a port in every
            prompt the capture recorded, and the count max_tokens carries is an
            item (measured 2026-09-20).'
    replacement: <PORT:role>
    unknown_port: <PORT:?>      # a diff line, never a silent pass
    keep_literal: [':9', ':8080', ':11434']   # fixed constants, not run-time ports
    must_not_hide:
      - A11.13  # a webapp with NO port
      - A7.13   # the unreachable :9 peer, whose port is the fixture
      - B5.3    # max_tokens / output_reserve, which the v3 form ate

  - id: N9
    name: paths
    why: >
      NOTHING is normalised. The workdirs are identical strings on every runtime
      (`spec.family_workdir`), so a path difference is a real one — a leaked
      `/var/folders/…/T/` or a `fantastic-kernel-out-*` is a diff line, and the
      raw-vs-resolved pair (`/var` vs `/private/var`) stays visible because A2.17
      and A2.20 are exactly that.
    replacement: none
    must_not_hide:
      - A2.17
      - A2.20

  - id: N10
    name: derived_counts
    why: >
      A count over text is only comparable when the text is. Where the same object
      carries the text, the count is compared as `count − len(text)` in python's
      unit (code points for kernel counts, bytes for HTTP), so a count that is
      right about a different string does not read as a count bug. Everywhere else
      it is compared exactly.
    keys: [bytes, size, body_len, content-length, __bytes_len__]
    unverifiable: context_status estimates whose id-digit signatures differ → flagged count-unverifiable
    #: THE PLACES A COUNT IS DROPPED, each with the text it
    #: counts compared in full somewhere the diff does read:
    #:   1. a count (`len`/`body_len`/`bytes_len`/`size`/`length`) beside the
    #:      text it measures, where that text carries `<ID#n>`, `<TS:float|int>`
    #:      or `<OSPID>` — placeholders whose ORIGINAL had no fixed width, so the
    #:      same document is a different number of bytes on two runs. The
    #:      `content-length` of the same exchange goes with it. A guid and a
    #:      send_id are fixed-width, so a count over a text carrying only those
    #:      is still compared EXACTLY. (A job's id is a counter id — N4.)
    #:   2. the stub request index's `body_len` and echoed `content-length`: the
    #:      body is not in the entry at all, it is `req_<n>.bin` beside it, and
    #:      that file is compared whole.
    #:   3. the `<n>B` of a message DIGEST line
    #:      (`<id> · <role> · "<title>" · <n>B · ↑<parent>`) — the count is over
    #:      the row's content, which is not in the line. Fires only on a line the
    #:      id renaming already touched.
    #:   4. the `ctx` request CENSUS — `bytes` and `system_chars` of an
    #:      entry carrying `{n, bytes, system_chars, messages, keys}`. Case 2's
    #:      argument, in the other recorder: the body is `ctx/stub/req_<n>.bin`
    #:      beside it and is compared whole. The numbers differ by the
    #:      `runtime=` word (N2) and the id digit width (N4).
    #:      A ZERO IS KEPT AS ZERO: a request with NO system block at all is a
    #:      different thing from one with a shorter one, and stays a diff line.
    #:   5. the `context_recall` header's two estimates, in TEXT:
    #:      `the digests use <N>` (a token count over the digest block printed
    #:      directly under it — the same `<n>B` lines case 3 has already
    #:      dropped) and `your budget for the body is
    #:      <N> tokens` (window − reserve − the system block's own token count,
    #:      and the system block carries `<RUNTIME>`).
    #:      The window and the reserve are compared exactly in `meta.json` and
    #:      in the agent record, and the SAME budget recorded as a FIELD
    #:      (`$.rows[n].budget`) is left alone — it is a diff line, owned by
    #:      residual R-N2-1.
    #:   6. a ledger EXECUTION's outcome `bytes` — the size of the
    #:      reply that settled it, a reply the family that made the call records
    #:      WHOLE in its own file and compares there. Case 2's argument again.
    #:      A zero stays a zero; `status` and
    #:      `attempts` beside it stay exact.
    #:   7. a memory-store ROW's `bytes` where its `head` carries a
    #:      renamed id — the head is the content cut at a fixed width, so the
    #:      content carries the id too (case 1 with the text truncated). The
    #:      HEAD is then compared on the prefix both sides show, and only when
    #:      both raw heads have the same length (the kernel's cap): the cut
    #:      lands where the raw digit widths put it.
    #:   8. `<RUNTIME>` joins the placeholders of no fixed width
    #:      (case 1): the name it stands for is 4, 5 or 6 characters. And
    #:      `stdout` joins the texts, `stdout_bytes` the counts.
    #:   9. A token BUDGET — `window − reserve − the system block's
    #:      tokens`, and the system block names the runtime — is compared
    #:      PAIRWISE with a tolerance of ONE token, never blanked: as a field
    #:      (`budget` beside `why`, a recall reply or a view row) and as text
    #:      (`<budget>N</budget>`, `"budget": N`, in a prompt or a row's content;
    #:      both texts must carry the same number of budgets). A port two tokens
    #:      off is a line.
    self_check: diff.py rulecheck — 6 cases (census both ways, recall header
      both ways), plus 7 for cases 6 and 7 (the size forgiven; status, a zero,
      a differing prefix, a different raw width and an id-free head still lines),
      plus 6 for cases 8 and 9 (forgiven; a differing body, a budget two tokens
      off, another count changed beside a budget — lines)
    must_not_hide:
      - A2.21  # a symlinked file's SIZE, where the text is not in the reply
      - C44    # the 64 KiB record read, which is about a LENGTH
      - C13    # the request's MESSAGE COUNT, its `keys` set and its flags —
               # every other field of a census entry is compared exactly
      - B5.3   # the window/reserve the budget is derived FROM

  - id: N11
    name: stream_order
    why: >
      Order inside one socket is a contract; order BETWEEN independent sockets and
      timers is not. Frames are grouped by (mark, sock) and compared exactly
      inside a group.
    implemented_as: >
      `frames.jsonl` (the whole-family stream) and any `frames` array inside a
      case are cut at each `mark` — the family's own phase boundary, written on
      sock `-` — and inside a phase the frames are grouped by `sock`. Every
      per-socket sequence survives byte for byte; only the interleaving BETWEEN
      sockets goes. Measured: two runs of the same immutable tree swapped `ctrl`
      and `proto` at four places out of 400 frames, and at three places in
      `wire/protocol.jsonl`. A frame that crossed a phase boundary, or moved
      within its own socket, is still a diff line.
    relaxations:
      - consecutive identical state_event payloads are deduped
      - terminal output is compared as the concatenated data of a step
      - the first two schedule_fired only
      - heartbeat count >= 1
      - ctx requests aligned by (agent, kind, turn)
      - kernel_log compared as ordered lines per emitter prefix
    must_not_hide:
      - C76   # the ORDER of a state stream within one subscription — ONE sock
      - B2.13 # the token/status event sequence of one turn — ONE sock

  - id: N12
    name: persisted_files
    why: >
      `agent.yaml`, `readme.md` and `docs/**` are compared BYTE FOR BYTE — they
      are the product. The four files the kernel rewrites continuously are parsed
      first and then normalised by N4–N6, and their sha and length are excluded,
      because `ledger.json` is rewritten DURING the snapshot that reads it (C47)
      and a byte compare of a moving file measures the clock.
    exact: [agent.yaml, readme.md, 'docs/**']
    # A rewritten file's read REPEATS its moving size in words: the
    # `origin` line `bytes 0-193 of 193 — read_stream {…, offset: 0, length: 193}`.
    # Its numbers are blanked the way the record's own `size`/`length` are; the
    # words, the path and the verb stay compared (a float `next_run` can print to
    # a different digit count).
    origin_numbers: blanked inside a REWRITTEN record only
    parsed_then_normalised: [schedules.yaml, lock.yaml, history lines]
    #: A record ABOUT one of the four keeps its path, its keys and its envelope,
    #: and loses every number over its moving bytes and the bytes themselves.
    #: `store.py` records each persisted file three ways, so the same moving
    #: length appears as `listed_size`, as the read's `length`, as the reply's
    #: `next_offset` and as the raw sidecar's byte count.
    blanked_keys: [sha256, __sha256__, size, bytes_len, len, listed_size, length,
                   next_offset, offset, __bytes_len__, __raw_bytes_in_raw_file__,
                   utf8, __utf8__, text, head_hex]
    #: `ledger.json` is reduced to its SHAPE, and the distinct shapes are SORTED,
    #: not kept in first-appearance order: its rows are already declared
    #: unordered (N15), so an index into an arrival-ordered shape list is itself
    #: a different document every run.
    distinct_shapes: sorted
    #: BOTH shape reductions are SETS KEYED BY THE SHAPE, never lists:
    #: `__distinct_shapes__` for `ledger.json` and `__tag_shapes__` for
    #: `messages.xml`. `flatten` indexes a list POSITIONALLY, so in a list one
    #: shape present on one side only would shift every index after it. Keyed, a
    #: one-sided shape is exactly one line, it NAMES the shape, and the key-set line beside it says the difference once more. Nothing is hidden:
    #: a shape on one side only is still `<absent>` on the other.
    keyed_shape_sets: [__distinct_shapes__, __tag_shapes__]
    self_check: diff.py rulecheck — 2 cases (a reordered shape set, a one-sided
      shape)
    must_not_hide:
      - C42   # the persisted record's KEYS and their order
      - C45   # the readme bytes as written
      - C63   # a row shape only one runtime ever writes — named, not indexed

  # N13 — retired; the id is not reused.

  - id: N14
    name: harness_fields
    why: >
      Everything the harness owns — a wall-clock instant, a wait, a poll count, a
      request ordinal — is written under a `harness` key by `record.py` and
      dropped here by SCHEMA. Round 2 mixed them into the kernel's own reply and
      every file then needed a per-key exception.
    drops_key: harness
    must_not_hide: []     # nothing the kernel said is under this key

  - id: N15
    name: unordered_where_declared
    why: >
      Order is a contract in most places and not in three, each MEASURED by the
      python self-diff (two runs of the same immutable tree disagreed on 4270
      lines, all of them one of these):
        * `ai_paths/**` row arrays — the family runs two AI agents that call each
          other, so the chains interleave differently every run and every row id
          after the first crossing shifts. The items there are the content, the
          cycle depth and whether a guard fired; none is positional. The messages
          digest, where ORDER IS the item, lives in `store/s3` and is untouched.
        * `ledger.json` and `messages.xml` — rewritten WHILE they are read (C47),
          so the row count moves between two reads of one run.
        * `http.json`, `peer_frames.json`, `relay_frames.json` — whole-family
          transport logs. Every exchange is already recorded in its own case file;
          these are dumps whose order follows whichever concurrent step answered
          first.
      The array LENGTH is kept as its own field, so a runtime that produced fewer
      rows is still a diff line — only the interleaving is forgiven.
    globs:
      - {glob: "ai_paths/**", keys: [rows]}
      - {glob: "**/store_files_*/**/ledger.json", keys: "*"}
      - {glob: "**/store_files_*/**/messages.xml", keys: "*"}
      - {glob: "**/http.json", keys: "*"}
      - {glob: "**/relay_frames.json", keys: "*"}
      - {glob: "**/peer_frames.json", keys: "*"}
    must_not_hide:
      - C63   # the messages digest ORDER — `store/s3`, outside every glob
      - C64
      - C65
      - C66
      - C67
      - C68
      - C18
      - C76   # the state-stream order — per SOCKET in `wire/frames.jsonl` (N11)
      - B2.13

  - id: N16
    name: digest_of_minted_bytes
    why: >
      A digest over bytes that embed a value the rules have already declared
      incomparable can only ever differ, and it says nothing about the file.
      `agent.yaml` is the case: the root's carries the kernel's minted guid (N3),
      a web leg's its OS-chosen port and an ai leg's the stub endpoint (N8). The
      BYTES ARE STILL COMPARED — normalised — everywhere the capture recorded
      them: `store/*/raw/agent.yaml`, `store/*/disk_raw/agent.yaml`, the `utf8`
      field beside the digest in `store/*/body/agent.yaml.json`, and the `text`
      field beside it in the cli's before/after snapshots. Only the sha goes, and
      only for that file.
    files: [agent.yaml]
    drops_keys: [sha256, __sha256__]
    replacement: <DIGEST_OF_MINTED>
    must_not_hide:
      - C42   # the persisted record's keys and their order — compared as TEXT
      - C45   # the readme bytes — a different file, digest untouched
      - C15   # what `create_agent` persisted, which is the text, not the sha

  - id: N17
    name: terminal_output_coalescing
    why: >
      A PTY IS A BYTE STREAM, and where it is cut into `output` events is READ
      TIMING, not behaviour. Python's single event loop runs the pty fd callback
      only after the in-flight write dispatch has finished, so one shell turn's
      echo + output + prompt arrive in ONE read and are coalesced BY ACCIDENT;
      the ports read on their own thread and see each write as it lands. No
      runtime has coalescing code, so there is nothing for a port to mirror.

      MEASURED, 2026-09-21 acceptance captures (`wire/frames.jsonl`): python
      emitted 3 `output` frames for the shell turn, rust 5 and then 4 after its
      drain fix, swift 6-9 — and the CONCATENATED BYTES were identical in every
      capture. The frame stream is diffed POSITIONALLY, so the one extra ctrl
      frame cascaded into ~200 diff lines; the ws census read ctrl 175 (python)
      vs 176 (rust) vs 179 (swift) with every other leg matching exactly.

      So: before diffing, a RUN of consecutive terminal `output` events on ONE
      leg becomes ONE frame whose `data` is the run's concatenation, byte order
      preserved, and `frames_index.json`'s `total` is RECOMPUTED from the joined
      stream rather than dropped. A run is consecutive after N11, i.e. within
      its own leg and within one phase; the run key is (leg, direction, frame
      kind, every payload field except `data`). Anything else breaks the run and
      is emitted untouched — a reply, an error, another event type, another
      leg's frame, a phase mark, and an `output` payload with NO `data` (python
      writes one at PTY EOF). A run of length 1 is rebuilt the same way, so a
      leg that never coalesced and one that did produce the same shape.

      THE DECISION (owner, 2026-09-21): normalise in the HARNESS. The
      alternatives were a kernel rule serialising the PTY reader against
      in-flight dispatches — inventing latency to imitate python's accident —
      and a coalescing timer, a new timing contract in three runtimes. Neither
      is behaviour anyone wants.

      COST, stated plainly: the RAW `text` of an output frame is no longer
      compared byte for byte. It is re-rendered from the joined payload on BOTH
      sides, so a JSON spacing or escaping difference INSIDE AN OUTPUT FRAME
      ONLY would not show. Every other event frame still carries its recorded
      `text`.

      `diff.py rulecheck` is this rule's own test: same bytes with different
      chunking must be 0 lines, and each of different bytes, an interleaved
      reply, a second leg, a different payload field and a data-less payload
      must still be a line.
    files: [frames.jsonl, frames_index.json]
    joins: {event_type: output, per: [sock, dir, kind, payload_fields_except_data]}
    must_not_hide:
      - A14.9    # the PTY output BYTES — the concatenation is compared, always
      - A14.10
      - C76      # the state-stream ORDER within one socket (N11), untouched
      - B2.13    # a turn's token/status sequence — not `output`, never joined
      - A13.17   # the frame TOTAL, recomputed rather than dropped

  - id: N18
    name: loader_own_persistence
    why: >
      THE LOADER'S OWN PERSISTENCE TRAFFIC IS A DEBOUNCE ARTEFACT. Before an
      ON-DISK `ledger.json` or `messages.xml` snapshot is compared, that traffic
      is dropped from BOTH sides: in the ledger, every row satisfying the
      kernels' shared `_is_own_persistence` predicate (python
      `kernel_state/tools.py`, rust `persistence.rs::is_own_persistence`) — a
      `call` row with NO origin, addressed to the DISCOVERED store; in
      `messages.xml`, the `ledger_flush` / `message_pump_flush` / `persist_writer`
      task rows and any settle whose parent is one of them. (Own-persistence
      CALLS never reach the message log at all — that is the first half of the
      same predicate, inside the kernel.) The predicate is applied HERE to the
      RECORDED JSON; no kernel code is imported. The store is DISCOVERED from the
      document — the target of the no-origin rows whose result names
      `ledger.json` / `messages.xml` — never hardcoded, and the id it discovered
      is written into the compared document, so two sides that found DIFFERENT
      stores are a diff line.

      WHY THIS IS NOT HIDING A DIFFERENCE: python runs one event loop, so a batch
      of rows is spread over more 150 ms debounce windows and each window writes;
      the ports burst and one write covers the batch. The rows the kernel
      EXECUTED are the same; only how many times they were written out differs.

      MEASURED, 2026-09-21 acceptance captures, `store_files_final/disk_raw`:

        |                             | python | rust | swift |
        | `ledger.json` write rows    |   379  |  132 |  102  |
        | `messages.xml` append rows  |    56  |   29 |   20  |
        | own-persistence rows, total |   535  |  261 |  222  |
        | NON-persistence ledger rows |   482  |  483 |  536  |
        | persisted ledger rows       |  1017  |  744 |  758  |

      On RUST the hypothesis holds exactly: 274 fewer rows on disk, ALL of them
      the loader's own, and the non-persistence total lands inside the ±1 already
      known (+1 = −1 `kernel_state`←`rest`, +1 `rest`←`web`, +1 `ws`←`web`). On
      SWIFT it does NOT: swift carries 55 extra `kernel_state`←`ai` rows and 3
      fewer `kernel_state`←`rest`. Those rows HAVE an origin, so this rule never
      touches them — they are a real divergence and they stay in the diff. That
      is the point of discovering the store and of the census below.

      THE TAIL. `ledger.json` is rewritten WHILE the snapshot reads it (C47), so
      the last rows may not be on disk yet. After the drop, if one side's row
      list is a STRICT PREFIX of the other's, the surplus at the END of the
      longer one is cut from BOTH — FOR THE SHAPE REDUCTION ONLY. It is NOT cut
      from the census, because an on-disk file cannot tell an un-flushed tail
      from a row that never happened: the rulecheck case "a MISSING
      non-persistence row" FAILED (0 lines) while the census was taken after the
      cut, and passes now that it is taken before. So a tail costs exactly one
      census line instead of a shape cascade. A surplus in the MIDDLE is not a
      tail and is never cut. Measured: on these three captures the clause is
      INERT — the common prefix is 2 rows, the runtimes diverge at the `rest`
      boot row.

      WHAT REPLACES THE DROPPED ROWS: `__row_census__`, a DICT of row signature →
      count, compared as VALUES (outside `shape_of`, which would turn a count of
      55 into `"int"`). A ledger signature is (target, origin, named, name,
      outcome status); a `messages.xml` signature is (kind, verb, agent, origin,
      PARENT ROW's own kind/verb/agent, outcome status), the parent resolved
      through the WHOLE log so a row re-parented onto a dropped flush task still
      moves bucket. One line per signature, not one per row.

      THE DECISION (owner, 2026-09-21): normalise in the HARNESS. The alternative
      was to make the ports' debounce imitate python's event-loop turn
      boundaries — a new timing contract in three runtimes, to make a write count
      match that measures nothing but which thread read the rows.

      NOT DECIDABLE, NOT GUESSED: a recorded row that does not CARRY an `origin`
      field is left alone. The live `ledger` verb projection
      (`*/final/kernel_ledger.json`) drops the field, and reading a missing key
      as "no origin" would drop every store row there, including ones an operator
      really sent. With no decidable row no store is discovered and the rule is
      inert on that file — measured inert on all six `final/kernel_ledger.json`
      captures, firing on the four `store_files_*/…/ledger.json` snapshots.
    files: [ledger.json, kernel_ledger.json, messages.xml]
    drops:
      - 'ledger rows where kind in (absent, call) AND origin is recorded AND null
         AND target == the discovered store'
      - 'messages.xml `task` rows whose verb is ledger_flush / message_pump_flush
         / persist_writer, plus settles whose parent is one of them'
      - 'the un-flushed TAIL, for the shape reduction only, and only when the
         shorter side is a strict PREFIX of the longer'
    adds: [__store__, __row_census__]
    self_check: diff.py rulecheck — 11 cases, both ways
    must_not_hide:
      - C42   # the persisted record's keys — the SHAPE comparison is unchanged
      - C46
      - C47   # the flusher's own contract: that it flushes, not how often
      - C63   # a missing or extra NON-persistence row — the census counts it
      - C18   # a differing outcome — the status is in every signature
      - C12   # a row re-parented onto a different kind of row

  - id: N19
    name: row_id_order_within_a_turn
    why: >
      N4 numbers a minted row id `<ID#n>` BY FIRST APPEARANCE, i.e. by MINT
      ORDER. This rule throws that numbering away and re-derives it from the ROWS
      THEMSELVES: every dict whose `id` is an N4 placeholder is a row, each row
      is keyed by (agent, kind, verb, PARENT'S canonical ordinal, hash of its own
      content with every id placeholder masked), the rows are ranked by that key
      with parents before children, and the ordinal an id gets is its row's rank.
      A placeholder no row defines — an `expand` list, a `<pid>` in prompt text —
      is numbered afterwards by first appearance in the ALREADY-CANONICALISED
      document. The result is `<CID#k:type>`; the TYPE is still carried, so an int
      id and a digit-string id stay a difference.

      WHY: python's single event loop cannot run a spawned task body until the
      handler that spawned it SUSPENDS; rust's runs concurrently on another
      thread. Within one turn 2–3 ids are therefore handed out in a different
      order, and the sequence RE-CONVERGES on the next row — the same rows, the
      same parents, the same content, a permuted id assignment.

      MEASURED (2026-09-21 acceptance captures, `ai_paths/**`): the SAME 408 ids
      on both sides, 20 + 9 occurrences of the permutation, 1515 diff lines, row
      bodies byte-identical apart from the ordinal (`"id": "<ID#36:int>"` on
      python against `"<ID#34:int>"` on rust). The amplification is the numbering,
      not the rows: one offset early in a file shifts every ordinal after it.

      THE DECISION (owner, 2026-09-21): normalise in the HARNESS. THREE
      kernel-side mirrors were built and measured, and ALL THREE made the diff
      WORSE — the code was reverted. Making a port imitate python's suspension
      point is inventing a scheduling contract nobody wants, to make a number
      match that means nothing.

      SUPERSEDES `renumber()` (v4), which re-numbered placeholders in the order
      they appeared in the BAGGED document. That was circular: the bag is sorted
      by strings still carrying the OLD numbering, so a permutation changed the
      sort, which changed the new numbering. Deriving the ordinal from CONTENT
      breaks the cycle, which is why this pass runs BEFORE `bagify` — the bag then
      sorts strings that are already canonical.
    replacement: <CID#k:int> / <CID#k:str> / <CID#u<n>:…> for an id no row defines
    self_check: diff.py rulecheck — permutation → 0 lines; dropped row,
      re-parented row and changed verb → lines
    must_not_hide:
      - C17   # the cursor TYPE — carried in the placeholder, as in N4
      - A4.20
      - B5.9
      - C63   # a missing or extra row — fewer ordinals, different array length
      - C12   # a WRONG PARENT — `parent` renders the parent's CANONICAL ordinal,
              # derived from the parent's own content, so a re-parent is a line

  # ── ORDER that is not a contract ──
  # (`tmp/todo.md`, "parity leftovers (c)"): each rule names exactly the order it
  # frees and keeps every other order compared.

  - id: N20
    name: reply_vs_event_on_one_socket
    why: >
      On ONE socket a call's REPLY and the EVENTS a watch pushes are written by
      different tasks, and which reaches the socket first is scheduling.
      Measured 2026-10-01 on `wire/frames.jsonl`: the `ctrl` socket's
      `wirecap-N` reply one or two frames earlier or later among
      `reflect`/`status` events — rust at 8 places (124 diff lines), swift at 1.
      Inside a RUN of consecutive incoming reply/event frames on one socket, the
      replies are put after the events; each kind keeps its own order.
    scope: wire frame streams (`frames_view`) — after N11, before N17
    runs_end_at: an outgoing frame, a mark, another socket, any other frame type,
      and a terminal OUTPUT event (N17's chunk order against a reply stays a
      contract)
    self_check: diff.py rulecheck — swap → 0 lines; a missing reply, two events
      reordered, a reply crossing an outgoing call → lines
    must_not_hide:
      - C76   # the order of events within one subscription
      - B2.13 # a turn's token/status sequence
      - A13.14

  - id: N21
    name: self_reflect_vs_reply_delivery
    why: >
      An agent busy with one turn is sent a PEER message and, a moment later, the
      reply its own earlier call was waiting for. The peer turn's self-`reflect`
      and the reply's DELIVERY race: python records the reflect right after the
      peer `send`; swift records the reply's `send` and its `queued` status first
      (measured 2026-10-01, `ai_paths/events.json` 386–388 and
      `ai_paths/cases/cycle.json`, 28 + 31 swift lines). The first `reflect`
      after a peer `send` (a `send` event with no `client_id`) is moved to right
      after it — across `send` events and `queued` statuses ONLY.
    scope: [ai_paths/events.json, ai_paths/cases/cycle.json]
    not_reordered: >
      A `thinking` status in between — the two TURNS ran in the other order. Rust
      shows exactly that in the cycle case (the reply's turn takes the agent's
      queue first, its `queue_depth`s and `queued` status follow), and it stays
      a diff line: who waits changes the events' CONTENTS, not just their order.
    self_check: diff.py rulecheck — reflect after the reply's delivery → 0
      lines; the turns in the other order → lines
    must_not_hide:
      - B2.13
      - B2.14
      - B2.15

  - id: N22
    name: stub_requests_paired_per_agent
    why: >
      `ai_paths` runs TWO AI agents and the stub numbers their requests in
      ARRIVAL order across both: when `ai2`'s turn reaches the stub before
      `ai`'s, every number after it shifts (measured 2026-10-01: swift
      `req_068` is `ai2`'s request, python's is `req_069`, so both files read as
      wholly different). Each agent's OWN request sequence is a contract and stays
      compared in order: the k-th request of agent X (the `id=<agent>  model=`
      line of its system block) is paired with the other side's k-th request of X.
    scope: 'ai_paths/stub/req_*.bin'
    unpaired: a request one side made and the other did not is still a missing /
      extra file
    self_check: diff.py rulecheck — on real files, the per-agent pairing; an
      agent's extra request stays unpaired
    must_not_hide:
      - B1.3
      - B1.6

  - id: N23
    name: kv_conversation_digest
    why: >
      `vllm_backend` reflects the endpoint's KV session table, and each live
      conversation is named by `sha256(system text + first user turn)[:16]`. That
      prefix embeds values the rules already declare incomparable — the root's
      minted guid (N3), the stub's OS-chosen port (N8), the runtime naming itself
      (N2) — so the id can only differ between two captures of the same tree.
      Measured 2026-10-02 on the python self-diff: every stub request body of
      `ai_paths`, `ctx`, `store`, `tree` and `wire` differed in exactly this token
      (the agent's own reflect is rendered into its system prompt). The ids go;
      HOW MANY there are, their position, `live`, `evicted` and `rejected` stay
      compared, and a `conversations` entry that is not a 16-hex id is compared
      as it is.
    keys: [conversations]
    text: '`<conversations> <item>hex16</item> … </conversations>` and an embedded
      json `"conversations": ["hex16", …]`'
    replacement: <KV_CONVERSATION:hex16>
    self_check: diff.py rulecheck — the id forgiven in a reflect and in a prompt;
      a different count, a non-hex entry and a different `evicted` are still lines
    must_not_hide:
      - B1.12   # the reflect statics around the table
      - B1.23   # the reflect base and its ordered extras (`kv` is one) — key order and the list length stay compared

  # ── store bookkeeping and catalog differences ──

  - id: N24
    name: memory_rows_without_flush
    why: >
      The memory store's reflect `rows` (`store/s1/readme_true/memory.json`)
      counts every row it holds, and that includes one `flush` row per batch the
      kernel's ledger flusher wrote. HOW MANY batches a run wrote is the
      flusher's debounce against the runtime's speed: measured python 334, rust
      and swift 333 on the same scenario. That is C47's "how often", which C47
      itself says is not the contract. The kernel has no verb that settles the
      flusher, and a sleep would only move the race, so the flush rows are
      COUNTED instead: `store.py` takes a census of the whole store — one `dump`,
      `{rows, flush}` of one instant — immediately before and immediately after
      the reflect, under `harness.flush_rows` (N14 drops it after this rule has
      read it). A flush appends a batch, so the census whose `rows` equals the
      reflect's is the store the reflect saw; its `flush` is subtracted, and
      `rows` becomes `<ROWS_EXCLUDING_FLUSH:n>`, compared EXACTLY. Both sides,
      the same way.
    not_fired: >
      No census on a side, no census whose `rows` equals the reflect's (a flush
      on BOTH sides of it), or two matching censuses with different flush counts.
      The raw count then stays and is a line; `store.py` also writes a note.
    cost: >
      Two `dump` calls per run that were not there before — on every runtime,
      so every later ledger census carries the same two extra `memory` rows.
    measured: >
      2026-10-02, python capture `hk_n24`: the reflect saw 305 rows, both
      censuses read 305 rows / 2 flush, so `<ROWS_EXCLUDING_FLUSH:303>`. Against
      the `vllm_20261002` python store family (taken before the census existed)
      the whole family differed in exactly 2 lines: this count, and the final
      ledger census of `memory` calls, 13 → 15 (the two `dump`s).
    self_check: diff.py rulecheck — 7 cases (the flush count forgiven; the second
      census used when a flush landed before the reflect; a different non-flush
      count, no matching census, two disagreeing censuses, no census and another
      reflect field — lines)
    must_not_hide:
      - C47   # the flusher's contract: that it flushes — the non-flush rows it wrote are counted exactly
      - C45   # the readme body in the same reflect, untouched

  - id: N25
    name: port_catalog_without_foundation_models
    why: >
      Python ships no `foundation_models_backend` (owner, 2026-10-02: py has no
      FM); rust and swift do. Every comparison of a WHOLE bundle catalog (C10 —
      `bundles=ids|all`, and C8's paging over it) therefore differs by that one
      name. The name is dropped from the RUST/SWIFT side only. This is
      deliberately one-sided, as N13 was: on the python side the rule would
      fire on nothing, and if python ever carried the bundle again it must stay
      visible.
    forms:
      - 'a `bundles` list in a reply — names (`bundles=ids`) or
         `{name, handler_module, schema}` objects (`bundles=all`)'
      - 'the comma-joined `bundles=a,b,c` every AI system prompt carries'
      - 'a `"bundles": [...]` list of NAMES inside text — compact in a REST body,
         indented in a cli stdout (there the WHOLE LINE goes, before the text is
         cut into lines), quoted once or more'
      - 'a PAGED catalog walk (`store/s2/*/bundles_*_limit2_pages.json`): one
         extra name shifts every later page boundary (python 16 names in 8 pages
         of 2, a port 17 in 9), so the walk is RE-PAGED from the port catalog
         minus the name, in chunks of the walk''s `limit` — ONLY when the port''s
         own walk is a well-formed limit paging in python''s convention (every
         page but the last holds exactly `limit`, names its last entry as
         `bundles_next`, the next page asks `after` it, the last page has none).
         Each page keeps every other field of the port''s own page. A paging bug
         is never re-paged away: the walk is then compared as recorded'
    not_covered: >
      A COUNT derived from a prompt that carries the port's catalog — a token
      estimate or a `budget` (window − reserve − the system block) — is not
      touched: the name is ~26 characters, more than N10's one-token tolerance.
      Not measured on a port capture yet (none was taken with this rule).
    measured: >
      Simulated on the python capture `vllm_20261002` (the name inserted into
      each catalog where a port puts it): the eight `store/s2` walks went from
      1225 lines to 0, a prompt, a cli stdout (text and json) and a REST body
      from 1 line each to 0.
    self_check: diff.py rulecheck — 17 cases (a list of names and of objects, a
      prompt, a compact and an indented list, a raw stdout, three walks — 0
      lines; another extra or missing bundle in each form, python carrying it,
      a port that pages wrongly, another field on a re-paged page — lines)
    must_not_hide:
      - C10   # the catalog itself — any OTHER extra or missing bundle is a line
      - C8    # the paging keys (`bundles_next` only when non-null) — a port that pages wrongly is never re-paged
      - C17   # the cursor values, re-derived exactly as the port's own walk derived them

  # ── by-design catalog differences ──

  - id: N26
    name: apple_fm_catalog_entry
    why: >
      Rust and swift ship `foundation_models_backend` (Apple's on-device model);
      python has no such bundle. Every system prompt renders the bundle catalog as
      `bundles=a,b,…`, so the ports' prompt carries one more name. Owner decision
      2026-10-04 (A): a by-design catalog difference. Only that entry of a
      `bundles=` list in TEXT goes; every other name and the list order stay
      compared. The counts derived from the longer prompt (its token count, the
      recall budget, the extra page of a paged `bundles` walk) are residual R-C1-1.
    keys: []
    text: '`bundles=…foundation_models_backend,…` inside a prompt'
    replacement: (the entry removed)
    self_check: diff.py rulecheck — the entry forgiven in a prompt; another
      catalog difference beside it is still a line
    must_not_hide:
      - B1.12
