  # ── new 2026-09-20: transport-library header sets, PTY chunk boundaries ──
  - id: R-D4-9
    decision: D4
    state: pending-owner
    runtimes: [rust, swift]
    # The stub writes one `requests.json` per provider family with the header
    # table of every request it was sent (`e2e/parity/stubs/__init__.py:55-66`).
    file_glob: "**/requests.json"
    # Two alternatives, and the `where` slot decides which — nothing outside a
    # recorded header table can match either.
    #   1. The table's own SHAPE: its length (`headers · len`, 9 vs 6), a pair's
    #      length, and the NAME slot `headers[i][0]`. Because the tables are
    #      compared BY POSITION, one missing header slides every later name by
    #      one, so `Accept-Encoding` lands opposite `x-api-key` and the name slot
    #      of a credential header IS part of the census (94 such lines on rust,
    #      measured 2026-09-21b) — the old lookahead dropped exactly those and
    #      left them unmapped.
    #   2. The VALUE slot, as before, and only when the line names no credential
    #      header: a credential VALUE that differs is a kernel difference, not a
    #      client default.
    anchor: '"where": "\$\[[0-9]+\]\.headers(\[[0-9]+\])?( · len|\[0\])"|^(?!.*[Aa]uthorization)(?!.*[Xx]-[Aa][Pp][Ii]-[Kk]ey).*headers\[[0-9]+\]'
    allowed_tail_regex: ".*"
    items: []
    note: >
      The model-endpoint REQUEST header block is the HTTP CLIENT's, not the
      kernel's. python's providers run on httpx, which sends its own default set
      (`Host`, `Accept`, `Accept-Encoding`, `Connection`, `User-Agent:
      python-httpx/<ver>`) in its own order; rust runs on reqwest/hyper and swift
      on its own client, both of which send a smaller set and, because
      `http::HeaderName` is lowercase and hyper's writer emits it verbatim,
      cannot write a capitalised name at all. Matching the set would mean
      claiming httpx's User-Agent and pinning its version — a library identity,
      not a behaviour. Blast radius: a genuinely missing REQUEST header (e.g. a
      `content-type` the kernel chooses) hides here too, and — new with the name
      slot — so does a request header NAME the port never sends at all.

  - id: R-D4-12
    decision: D4
    state: pending-owner
    runtimes: [rust, swift]
    # The SAME census, in the stub's OTHER record. `stubs/__init__.py` writes the
    # header table twice: into `requests.json` (R-D4-9) and into the `index.json`
    # summary beside it. Only `ai_paths/stub/` and `store/stub/` reach it — 400
    # lines each on rust, 400 on swift, every one unmapped before this entry
    # (measured 2026-09-21b) — and `index.json` exists nowhere else, so this is
    # R-D4-9's file_glob widened by the one file it could not name (fnmatch has
    # no alternation).
    file_glob: "**/stub/index.json"
    anchor: '"where": "\$\[[0-9]+\]\.headers(\[[0-9]+\])?( · len|\[0\])"|^(?!.*[Aa]uthorization)(?!.*[Xx]-[Aa][Pp][Ii]-[Kk]ey).*headers\[[0-9]+\]'
    allowed_tail_regex: ".*"
    items: []
    note: >
      Same difference, same decision, same blast radius as R-D4-9 — see its note.
      Kept as its own entry rather than a broader glob so neither selector can
      reach a file that is not one of the stub's two header records.

  # ── new 2026-09-22: three BY-DESIGN differences, each pinned to one slot ──
  - id: R-N2-1
    decision: N2
    state: pending-owner
    runtimes: [rust, swift]
    # The COUNT SLOTS ONLY, by `where`, in the two families that record one.
    # Not the text they count, not `bytes`, not `system_chars` (N10 drops those
    # two in the request census because the body beside them is compared whole).
    file_glob: "**/*"
    anchor: '"where": "[^"]*\.(budget|stdout_bytes)"'
    allowed_tail_regex: ".*"
    items: []
    note: >
      THE `runtime=` WORD, which N2 declares incomparable BY DEFINITION — the
      root reflect names the runtime it is, and that reflect is rendered into
      every system prompt and every `cli` stdout. `runtime=python` is one byte
      longer than `runtime=swift` and two longer than `runtime=rust`, so every
      COUNT over a document carrying it is off by exactly that much. Measured
      2026-09-21b: `ctx/ai_fold/rows_read_*.json $.rows[n].budget` 3870 vs 3871
      (17 lines — python's budget is one token SMALLER because its system block
      is one byte BIGGER), and `cli/**/*.json $.stdout_bytes` 661 vs 665, 3462
      vs 3461 (16 lines). The window and the reserve those numbers are derived
      from are compared EXACTLY, in `meta.json` and in the agent record, and the
      text itself is compared everywhere it was recorded. Blast radius, stated
      plainly: a budget or a stdout length that is wrong by a few bytes for some
      OTHER reason hides here — which is why this is a residual (the line is
      still reported) and not a rule.

  - id: R-D13-2
    decision: D13
    state: pending-owner
    runtimes: [rust, swift]
    # ONE census bucket, named in full. Every other signature, and every other
    # outcome in this one, is compared exactly.
    file_glob: "kernel_verbs/**"
    anchor: 'kernel_state <- None · named=False · name=None · errored'
    allowed_tail_regex: ".*"
    items: []
    note: >
      THE LONE SURROGATE `"\udcff"`. `kernel_verbs/C13/persist_non_utf8` posts a
      body containing an unpaired UTF-16 surrogate. Python's json accepts it, so
      the call reaches `persist_blob` and ERRORS there, leaving a row; the ports
      reject the body at the HTTP layer (`web_rest: request body is not valid
      JSON`, 400) and no row is ever made. One row, two ledger snapshots:
      `kernel_verbs/bare/ledger.json` 37 vs 36 errored and
      `kernel_verbs/final/kernel_ledger.json` 43 vs 42, identical on rust and
      swift (measured 2026-09-21b and 2026-09-22). Blast radius: an extra or
      missing errored row in THIS ONE bucket — no-origin, unnamed, on the root —
      hides here. Every other signature, and the `completed` count of this one,
      is untouched.

  - id: R-D16-3
    decision: D16
    state: pending-owner
    runtimes: [swift]
    # The `bytes` slot of a recorded frame payload, and nothing else.
    file_glob: "wire/**"
    anchor: '"where": "[^"]*\.bytes", "base": "\[.{1,2}NoneType'
    allowed_tail_regex: ".*"
    items: []
    note: >
      `bytes` PRESENT-AND-NULL against ABSENT in a `read`/`read_stream` outcome.
      Raw bytes ride OUT OF BAND (the io_bridge binary-frame codec), so the JSON
      reply carries no byte payload on any runtime; python still emits the key
      with a `null`, swift omits it. Measured 2026-09-21b/2026-09-22:
      `wire/protocol.jsonl $[18]` and `$[22]`,
      `frames.__by_sock__.proto[1].head.data.bytes` — 2 lines, and 0 on rust,
      which emits the key. The anchor pins the NULL form, so a `bytes` slot that
      ever carried a VALUE is a diff line on every runtime.

  - id: R-D16-2
    decision: D16
    state: pending-owner
    runtimes: [rust]
    file_glob: "wire/**"
    anchor: '"(Upgrade|upgrade|Sec-WebSocket-Accept|sec-websocket-accept)"'
    allowed_tail_regex: ".*"
    items: [A13.17, A13.7]
    note: >
      RESPONSE header NAME CASE on the 101 upgrade. python's `websockets` writes
      `Upgrade`, `Connection`, `Sec-WebSocket-Accept`; rust builds exactly those
      names in exactly that order
      (`RB/fantastic-web/src/handlers.rs:702-728`) but hyper's writer lowercases
      every `HeaderName` on the way out, and nothing short of replacing the
      writer changes that. Values, order and the set already match. swift is NOT
      named: it DROPS `Connection`, which is a real fix, not a residual.

  # ── new 2026-09-21: the `http` census carries the client's header NAMES ──
  - id: R-D4-10
    decision: D4
    state: pending-owner
    runtimes: [rust, swift]
    # EVERY family's `http` census, not just `bundle_verbs`: the census is
    # written by the same recorder wherever a case records its HTTP exchange,
    # and the difference is the CLIENT's, so scoping it to one family left the
    # identical lines unmapped elsewhere (measured 2026-09-22 on the swift
    # capture: 134 in `bundle_verbs`, 2 in `kernel_verbs`, and both scored
    # REGRESSION because the files carry landed items). The ANCHOR, not the
    # glob, is what keeps this narrow: `$.http[i].headers[j][0]` is the NAME
    # slot of a recorded REQUEST header table and nothing else matches it.
    file_glob: "**/*"
    # The NAME slot of the recorded request header table (`headers[i][0]`) and
    # nothing else. The VALUE slot is NOT covered: `headers[2][1]` is
    # `content-length`, and 124 vs 109 there is a real body-size difference
    # (`file_bridge/readonly_write`, `terminal/resize_cols_70000`,
    # `terminal/write_invalid_bytes`, measured 2026-09-21) that must stay visible.
    # Neither is the table's LENGTH (`$.http[i].headers · len`), so a request
    # header a port never sends at all is still a diff line.
    anchor: '\$\.http\[[0-9]+\]\.headers\[[0-9]+\]\[0\]'
    allowed_tail_regex: ".*"
    items: []
    note: >
      `Connection` vs `connection` on the HTTP census — 136 lines on swift, 5 on
      rust, one physical difference. Same client-library class as R-D4-9 and
      R-D16-2: `http::HeaderName` is lowercase by construction and hyper's
      writer emits it verbatim, so rust cannot write a capitalised request
      header name at all, while python's client sends httpx's own casing; swift
      lowercases for its own reasons. The SET, the ORDER and the VALUES are
      compared as before. Blast radius: a request header whose name the kernel
      itself chooses hides here.
