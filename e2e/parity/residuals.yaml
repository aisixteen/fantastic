# Known, DECIDED differences. A residual is not a waiver: it is a decision with
# an owner, a shape and a blast radius.
#
#   state: accepted       — the owner decided; a line matching it does not stop a
#                           run being CLEAN.
#   state: pending-owner  — the decision is not made. A line matching it counts
#                           OPEN, and the run is not clean while it does.
#
# Two rules make a residual honest:
#   * every residual must MATCH AT LEAST ONCE on each runtime it names. One that
#     matches nothing is stale and FAILS the run — a residual outliving its
#     difference is how a real regression gets a place to hide.
#   * a line matching a residual whose items are ALL in landed.yaml is a
#     REGRESSION, not a residual.

version: 5
#
# v5 (2026-09-22) — R-D4-10 widened from `bundle_verbs/**` to every family and
# from `[rust]` to `[rust, swift]`: the request header NAME slot is the HTTP
# CLIENT's, wherever a case records one, and scoping it to one family left the
# identical lines scoring REGRESSION in `kernel_verbs` and on swift. The ANCHOR
# is what keeps it narrow, and it is unchanged. Three new entries, each pinned
# to ONE slot: R-N2-1 (the `runtime=` word inside a `budget`/`stdout_bytes`
# COUNT), R-D13-2 (the lone surrogate `"\udcff"` — one ledger census bucket) and
# R-D16-3 (`bytes` present-and-null against absent in a read outcome).
#
# v4 — the state this file was in on 2026-09-21b.

