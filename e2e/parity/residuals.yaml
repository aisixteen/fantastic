  # ── new 2026-09-20: transport-library header sets, PTY chunk boundaries ──

  # ── new 2026-09-22: three BY-DESIGN differences, each pinned to one slot ──
  - id: R-D13-2
    decision: D13
    state: pending-owner
    runtimes: [rust, swift]
    # ONE census bucket, named in full. Every other signature, and every other
    # outcome in this one, is compared exactly.
    file_glob: "kernel_verbs/**"
    anchor: 'kernel_state <- None · named=False · name=None · errored'
    allowed_tail_regex: ".*"
    items: []
    note: >
      THE LONE SURROGATE `"\udcff"`. `kernel_verbs/C13/persist_non_utf8` posts a
      body containing an unpaired UTF-16 surrogate. Python's json accepts it, so
      the call reaches `persist_blob` and ERRORS there, leaving a row; the ports
      reject the body at the HTTP layer (`web_rest: request body is not valid
      JSON`, 400) and no row is ever made. One row, two ledger snapshots:
      `kernel_verbs/bare/ledger.json` 37 vs 36 errored and
      `kernel_verbs/final/kernel_ledger.json` 43 vs 42, identical on rust and
      swift (measured 2026-09-21b and 2026-09-22). Blast radius: an extra or
      missing errored row in THIS ONE bucket — no-origin, unnamed, on the root —
      hides here. Every other signature, and the `completed` count of this one,
      is untouched.

  - id: R-D16-3
    decision: D16
    state: pending-owner
    runtimes: [swift]
    # The `bytes` slot of a recorded frame payload, AND (2026-10-01) what that
    # one key moves in the same BINARY frame: its whole-frame encodings —
    # `head_len`, `len`, `hex`, `sha256` — and the head's key set when python's
    # has `bytes`. The decoded `head` and the body (`body_hex`, `body_len`) are
    # compared field by field and are NOT covered, so a head or body that differs
    # for any other reason is still its own line.
    file_glob: "wire/**"
    anchor: '"where": "[^"]*\.bytes", "base": "\[.{1,2}NoneType|"where": "(\$\[[0-9]+\]|[^"]*__by_sock__[^"]*\[[0-9]+\])\.(head_len|len|hex|sha256)"|"where": "[^"]*\.head\.data · keys", "base": "\[[^\]]*\\"bytes\\"'
    allowed_tail_regex: ".*"
    items: []
    note: >
      `bytes` PRESENT-AND-NULL against ABSENT in a `read`/`read_stream` outcome.
      Raw bytes ride OUT OF BAND (the io_bridge binary-frame codec), so the JSON
      reply carries no byte payload on any runtime; python still emits the key
      with a `null`, swift omits it. Measured 2026-09-21b/2026-09-22:
      `wire/protocol.jsonl $[18]` and `$[22]`,
