    anchor: 'ERROR: +Exception in ASGI application|Traceback \(most recent call last\):|"(base|other)": "(  File |    )'
    allowed_tail_regex: ".*"
    items: []
    note: >
      PYTHON THROWS INSIDE ASGI and the ports do not, so the ORACLE's log carries
      `ERROR:    Exception in ASGI application` plus a uvicorn/h11 traceback where
      rust's line is empty. Measured 2026-09-21: 118 lines in `wire/kernel_log.txt`,
      12 in `providers/openai/nim_429_twice/`, 32 across `providers/anthropic/**`.
      R-D4-8 already owned the TEXT under D4 ("a library's own text"), but its
      items are all in `landed.yaml`, so every one of those lines scored a
      REGRESSION on a port that has nothing to regress. This entry says what the
      difference actually is — a python-side fault, not a port behaviour — and
      carries no items, so it counts OPEN until the owner rules on the fault
      itself. Blast radius: a port that starts printing its OWN traceback into a
      kernel log hides here.

  - id: R-D4-8
    decision: D4
    state: pending-owner
    runtimes: [rust, swift]
    file_glob: "**/kernel_log*.txt"
    # The anchor is a REGEX. `Traceback (most recent call last):` was written
    # unescaped in v3, so its parentheses were a group and it searched for
    # `Traceback most recent call last:` — which matches nothing. Measured
    # 2026-09-20: 120 lines in `wire/kernel_log.txt`, 68 in `store/`, and ~70
    # across `providers/**` were python's traceback and were reported UNMAPPED
    # because of the escaping.
    # The traceback BODY is one diff line per FRAME, so the anchor has to name
    # the frame shapes too: `  File "…"`, the 4-space-indented source line, and
    # the caret row. Scoped to a kernel log, where nothing else is indented four
    # spaces (the kernel's own lines are indented two).
    anchor: 'skipping malformed frame: |Traceback \(most recent call last\):|ERROR: +Exception in ASGI application|"(base|other)": "(  File |    )'
    allowed_tail_regex: ".*"
    items: [A15.1, A15.2, B2.1]
    note: >
      Python's `logger.exception` prints a traceback body and
      `ai_core/core.py:2329` calls `traceback.print_exc()` on stderr; rust and
      swift print no traceback at all. `ERROR:    Exception in ASGI application`
      is uvicorn's own header line for the same traceback — one difference, two
      lines, measured 2026-09-20.

