# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: reboot_continuity
group: coding
title: "a live run rebooted half-way: same store, fresh process state, the work continues"
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 80
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {E2E_WINDOW: "12000"}  # the squeeze the fold family measures under (the harness default is 32k)
