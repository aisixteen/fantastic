# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: fold_long
group: coding
title: "24 fillers, 8 rules over 4 files — folds fire in batches and the rules still bind"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 80
  no_progress_turns: 8
  turn_chars: 60000
  turn_seconds: 300
env: {}
