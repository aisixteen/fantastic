# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: grep_glob
group: coding
title: glob-filtered search — the marker hides among decoys, only *.cfg counts
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 16
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
