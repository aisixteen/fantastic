# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: peer_review
group: coding
title: a reviewer agent catches the flaw in a coder agent's diff
runner: probe.py
# PYTHON ONLY while the ask verb rolls out — `question` on an AI agent exists
# in the python ai_core first; rust and swift rejoin when theirs carries it.
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 16
  no_progress_turns: 8
  turn_chars: 60000
  turn_seconds: 300
env: {}
