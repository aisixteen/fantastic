# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: multipatch
group: coding
title: ONE patch transaction edits TWO files — coordinated, atomic, self-cleaning
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 16
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
