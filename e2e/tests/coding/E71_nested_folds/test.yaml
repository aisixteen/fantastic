# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: nested_folds
group: coding
title: "long enough for folds of folds — every level summarized, grep finds a grandchild"
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
long: true  # the live version runs > 8 min; the past is planted — re-measure before dropping this
limits:
  idle_seconds: 60
  max_turns: 140
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "6000"}  # 6k: at 4.5k a turn of two grep replies did not fit beside the 2.3k system block; fillers still inline (under the cap)
