# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: misleading_fold
group: coding
title: "a planted fold whose summary contradicts its members — does the model verify by descending?"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 60
  no_progress_turns: 10
  turn_chars: 60000
  turn_seconds: 300
env: {}
