# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: memory_distill
group: coding
title: salient facts distilled to a file survive a COLD session
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 20
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
