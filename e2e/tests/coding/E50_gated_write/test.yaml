# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: gated_write
group: coding
title: denied, the writer asks a PEER agent who opens the gate
runner: probe.py
runtimes: [python, rust]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 18
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
