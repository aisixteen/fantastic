# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: compaction
group: coding
title: the early fact survives compaction — recall pages it back
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 22
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
