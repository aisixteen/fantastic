# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: fold_paging
group: coding
title: "many small tasks → many folds; find the one that matters, open only it"
runner: probe.py
runtimes: [rust]
costs: passes
long: true  # > 8 min measured; at most 2 run at once (run.py LONG_LANES)
limits:
  idle_seconds: 60
  max_passes: 120
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {E2E_WINDOW: "32000"}  # 32k ONLY: a multi-root test needs room; at 12k the model loses every deliverable
