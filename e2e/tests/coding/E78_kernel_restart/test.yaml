# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: kernel_restart
group: coding
title: "work, folds, shutdown, a NEW kernel on the same dir: two AI agents each continue from their own hydrated rows"
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 40
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {E2E_WINDOW: "16000"}  # squeezed so folds fire before the stop; 12k left no body budget under a 6-agent tree (sys prompt ~5.4k tok)
