# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: recall_through_folds
group: coding
title: "after several folds, recall reaches the very first instruction and grep reaches inside a fold"
runner: probe.py
runtimes: [python]
costs: turns
long: true  # > 8 min measured; at most 2 run at once (run.py LONG_LANES)
limits:
  idle_seconds: 60
  max_turns: 80
  no_progress_turns: 10
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "12000"}  # this test MEASURES folds: it keeps the squeeze (the harness default is 32k)
