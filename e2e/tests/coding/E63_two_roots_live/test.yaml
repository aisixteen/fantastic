# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: two_roots_live
group: coding
title: "the human sends a second task mid-run — two chains interleave, two reports, no cross-talk"
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
long: true  # many lanes push turns past the 180 s proxy limit; at most 2 long run at once
limits:
  idle_seconds: 60
  max_turns: 60
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "12000"}  # the squeeze the fold family measures under (the harness default is 32k)
