# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: file_edit
group: coding
title: the model EDITS a file with the file agent's edit verb — surgical, not a rewrite
runner: probe.py
runtimes: [python, rust]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 16
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
