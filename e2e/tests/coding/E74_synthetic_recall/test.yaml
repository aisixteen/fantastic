# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: synthetic_recall
group: coding
title: "a store planted from above; the agent boots, recalls its own view, and works from it"
runner: probe.py
runtimes: [python, rust]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 40
  no_progress_turns: 10
  turn_chars: 60000
  turn_seconds: 300
env: {}
