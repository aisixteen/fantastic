# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: fanout
group: coding
title: N independent lookups in ONE turn's batch, not N turns
runner: probe.py
runtimes: [python, rust]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 12
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
