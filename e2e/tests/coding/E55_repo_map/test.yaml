# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: repo_map
group: coding
title: an unfamiliar REPO is mapped by the model — organs only, weights can't answer
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
limits:
  max_tokens: 8192
  idle_seconds: 60
  max_turns: 20
  no_progress_turns: 8
  turn_chars: 60000
  turn_seconds: 300
env: {}
