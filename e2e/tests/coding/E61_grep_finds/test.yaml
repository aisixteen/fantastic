# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: grep_finds
group: coding
title: "FIND the line: one of eight identical fillers carries a marker — grep, then pull only the hit"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 40
  no_progress_turns: 8
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "12000"}  # this test MEASURES folds: it keeps the squeeze (the harness default is 32k)
