# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: user_fold
group: coding
title: "the human folds the agent's finished work mid-run through the verb — and the rules still hold"
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 80
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {E2E_WINDOW: "12000"}  # above the 9000 squeeze, so the fold is the squeeze's doing (planted past)
