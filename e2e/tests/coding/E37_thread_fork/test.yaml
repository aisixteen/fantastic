# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: thread_fork
group: coding
title: a forked agent starts from the original's head by grant (share → fork_from), nothing copied
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 18
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
