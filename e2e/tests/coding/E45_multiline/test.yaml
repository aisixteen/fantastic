# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: multiline_edit
group: coding
title: a MULTILINE, multi-hunk edit — whole blocks move, the rest byte-identical
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 16
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
