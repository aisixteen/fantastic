# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: grant
group: coding
title: denied by the gate, the model asks the HUMAN for access, then finishes
runner: probe.py
# PYTHON ONLY while the human-as-agent conversion rolls out. The `grants`
# policy this arm needs exists in the python probe first; rust and swift come
# back once their bundle carries it too.
runtimes: [python]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 16
  no_progress_turns: 8
  turn_chars: 60000
  turn_seconds: 300
env: {}
