# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: job_mail
group: coding
title: the model steers a RUNNING job by mail mid-run
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 16
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
