roster:
- id: <agent_id>
  parent_id: <home(root)>
  can: '<{lines.ROOT: lines.call(''reflect''), ''readings'': lines.ALL, ''totals'':
    lines.ALL, ''clock'': lines.ALL, ''brain'': lines.ALL, ''user'': lines.ALL, EXECUTOR_LEG:
    lines.ALL, store[''id'']: lines.ALL, memory.MEMORY: lines.ALL}>'
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: readings
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: totals
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: user
  handler_module: user_probe.tools
  parent_id: <home(root)>
- id: clock
  handler_module: scheduler.tools
  parent_id: <home(root)>
- id: <EXECUTOR_LEG>
  handler_module: <EXEC_MODULE>
  parent_id: <home(root)>
