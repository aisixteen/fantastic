# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: subai
group: agentic_advanced
title: it builds sub-agents that outlive the conversation
runner: probe.py
# ONE probe, three kernels. `RUNTIME` is the plug the probe reads; the same
# assertions run against each. python is in-process (its asserts read the live
# tree); rust and swift are spawned and driven over REST.
runtimes: [python, rust, swift]
costs: turns
limits:
  # THE THINK BUDGET. This probe writes long turns — it is authoring a whole
  # agent — and at the endpoint default it ran out mid-generation:
  # `stop_reason='max_tokens' blocks=['thinking','text']` at 16,815 chars.
  # Thought present, answer truncated. That is a budget problem wearing a model
  # failure's clothes, and it is a per-test knob for exactly this reason.
  max_tokens: 16384
  idle_seconds: 60
  max_turns: 50
  no_progress_turns: 12
  turn_chars: 120000
  turn_seconds: 600
env: {}
selftest:
  runner: selftest.py
  costs: free
  title: the subai fixture is passable by a perfect actor
