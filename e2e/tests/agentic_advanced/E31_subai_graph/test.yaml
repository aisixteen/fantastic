# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: subai_graph
group: agentic_advanced
title: the same build, scored as a GRAPH — edges, not just nodes
runner: probe.py
# `RUNTIME` is the plug the probe reads: the rust host, spawned and driven over
# REST. The Python product keeps the old grant model (#170).
runtimes: [rust]
costs: passes
# Free twin of the key line: subai_key_twin (E167).
# 30 min: it builds live agents, and every docs reply (a reflect with `tier`/`verb`/
# `part`) leaves the view after one message, so planning re-pulls docs; 15 min can stop it mid-build.
hard_stop_minutes: 30
limits:
  idle_seconds: 60
  max_passes: 50
  no_progress_passes: 0   # disabled: planning-heavy — repeated reflects are not "no progress"; max_passes is the backstop
  pass_chars: 120000
  pass_seconds: 600
env: {FANTASTIC_AI_SEND_TIMEOUT: "420", UNATTENDED: "240"}  # the first planning passes run long thinking; 180 s can cut a progressing run
exclusive: true   # runs a team of AIs that takes every model slot: alone, after the pool (e2e/run.py)
