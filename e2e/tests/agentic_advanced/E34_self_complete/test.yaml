# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: self_complete
group: agentic_advanced
title: it finishes a small task and STOPS by itself — no nudge exists
runner: probe.py
# No-call-is-done is the contract in every runtime now (the nudge is deleted
# everywhere), so the claim is cross-runtime.
runtimes: [python, rust, swift]
costs: turns
limits:
  max_tokens: 8192
  idle_seconds: 60
  max_turns: 12
  no_progress_turns: 6
  turn_chars: 60000
  turn_seconds: 300
env: {}
