# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted Responses endpoint that
# records each request, and the kernel's own AI agent + a file view on a file_bridge, driven over
# web_rest on every host runtime.
id: system_prompt_file
group: backends
title: "the system block from a FILE (file_bridge_id: a file view + system_prompt_file: its path, read with the view's read/watch): placeholders filled, an editor's save / atomic save live next pass, precedence record > file > default; not set → default; set and unusable (missing, no line on the view, no view) → the pass fails loud; the line written → the file reads"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  pass_seconds: 300
