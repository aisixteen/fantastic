# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted OpenAI-compatible server
# answers HTTP 503, then the kernel's own vllm_backend agent retries it, over web_rest.
id: transport_retries
group: backends
title: "transport_retries: a 503 pass is retried visibly (a notice row the model reads, a retrying status) and then succeeds; a 503 on every try fails loud after the budget and nothing re-runs the failed pass (#795); a 400 and retries off are not link-retried"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  pass_seconds: 300
