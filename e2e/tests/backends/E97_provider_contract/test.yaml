# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/. Runs on ANY backend plug.
id: provider_contract
group: backends
title: "what ai_core needs from a provider, through a live AI agent: stream, stripped thinking, a <call> that runs, a visible cut, a real cancel"
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 90
  max_passes: 12
  no_progress_passes: 8
  pass_chars: 60000
  pass_seconds: 300
