# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/. Runs on ANY backend plug.
id: stream_stop
group: backends
title: "a RECEIVER stops a live stream: parts abort, nothing is sent, the pass keeps a [stopped by …] marker"
runner: probe.py
runtimes: [python]
costs: passes
muted: "#170: the Python product keeps the old grant model; this probe drives it"
limits:
  idle_seconds: 90
  max_passes: 4
  no_progress_passes: 4
  pass_chars: 60000
  pass_seconds: 300
env: {}
