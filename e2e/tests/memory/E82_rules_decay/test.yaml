# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: rules_decay
group: memory
title: "three rules at pass 1, twenty filler passes with folds, the rules held in the final artefact (fold arm; truncate arm printed beside it)"
runner: probe.py
runtimes: [python]
costs: passes
muted: "#170: the Python product keeps the old grant model; this probe drives it"
limits:
  idle_seconds: 90
  max_passes: 60
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {E2E_WINDOW: "16000"}
