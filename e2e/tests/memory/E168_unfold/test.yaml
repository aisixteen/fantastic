# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: unfold
group: memory
title: "map-once: a large read reply folds to the type's marker after its answer; asked for a line only its body holds, the model unfolds it with `recall` and its id, reads no file again, answers with the line, and no answer of its own opens with a time or a marker"
runner: probe.py
runtimes: [rust]
costs: turns
limits:
  idle_seconds: 90
  max_turns: 24
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
