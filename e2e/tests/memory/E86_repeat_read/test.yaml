# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: repeat_read
group: memory
title: "the same file read three times: the model's view carries ONE body, later reads are stubs citing the first"
runner: probe.py
runtimes: [python]
costs: passes
muted: "#170: the Python product keeps the old grant model; this probe drives it"
limits:
  idle_seconds: 90
  max_passes: 30
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
