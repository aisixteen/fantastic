# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: body_after_restart
group: memory
title: "a read, a restart, then a question about a line of it: the model re-reads (origin) or already said it — never a guessed body; no `pull` exists"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 90
  max_turns: 40
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "16000"}
