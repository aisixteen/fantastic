# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: budget_trigger
group: memory
title: "compaction fires at ~0.8 of the budget, calibrated by the endpoint's reported prompt size; no too_small"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 90
  max_turns: 40
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {E2E_WINDOW: "16000"}
