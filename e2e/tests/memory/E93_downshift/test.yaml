# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: downshift
group: memory
title: "a model switched to a smaller window (update_agent) folds on its very next turn; no too_small"
runner: probe.py
runtimes: [python]
costs: turns
limits:
  idle_seconds: 90
  max_turns: 40
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
