# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/.
id: downshift
group: memory
title: "a model switched to a smaller window (update_agent) folds on its very next pass; no too_small"
runner: probe.py
runtimes: [python]
costs: passes
muted: "#170: the Python product keeps the old grant model; this probe drives it"
limits:
  idle_seconds: 90
  max_passes: 40
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
