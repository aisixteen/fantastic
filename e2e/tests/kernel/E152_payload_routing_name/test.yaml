# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted OpenAI-compatible server plays the
# model for the kernel's own ai_chat.tools chat over a vllm_backend provider, driven over web_rest.
id: payload_routing_name
group: kernel
title: "a routing name in <payload> reaches its target (#528): a call in the routing form whose payload carries a `title` (a name the verb documents) delivers it to the target agent while the routing `title` only labels the call; the same call in the inline form is refused loud and the verb does not run"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
