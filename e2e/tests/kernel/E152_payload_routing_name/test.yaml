# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted OpenAI-compatible server plays the
# model for the kernel's own ai_chat.tools chat over a vllm_backend provider, driven over web_rest.
id: payload_routing_name
group: kernel
title: "a routing name in <payload> reaches its target (#528): a call in the routing form whose payload carries an `id` delivers it to the target (the kernel's create_agent makes the agent under that id) while the routing `id` only labels the call; the same call in the inline form is refused by the parser with the routing form and creates nothing"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
