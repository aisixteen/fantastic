# WHAT to measure and HOW LONG to allow. NO MODEL: the kernel's own file_bridge,
# driven over web_rest (events over the ws face) on every host runtime.
id: file_clamp
group: kernel
title: "file_bridge clamp + allow: `..`/absolute/symlink escapes refused, writes never follow a (swapped) link out, atomic write leaves no tmp, `allow` read live by every verb and by watch_path, raw-bytes stream round trip"
runner: probe.py
runtimes: [python, rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
