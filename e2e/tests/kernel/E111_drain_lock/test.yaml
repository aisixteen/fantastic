# WHAT to measure and HOW LONG to allow. NO MODEL: the packaged kernel of each
# host runtime, spawned on one directory several times, driven over web_rest.
id: drain_lock
group: kernel
title: "one kernel per dir (a second exits naming the owner; a stale lock — dead pid or a live pid holding no lock — does not block); shutdown_agents and kernel_stop over REST are operator only; the SIGTERM stop drains (new work refused, control surface up), settles the call in flight, exits 0, frees the port and the lock; a cancelled call is an ackable dead letter"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
duration: 21   # seconds in a green run (rig 2026-11-11): the pool starts the longest first (e2e/run.py)
