# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted OpenAI-compatible
# server plays the model for the kernel's own ai_chat.tools chat over a vllm_backend provider, driven over web_rest.
id: scripted_ai
group: kernel
title: "an AI agent's call loop against a scripted model: a call runs and its reply is the next prompt, a file write lands verbatim, calls written wrong get the compiler-style report, a call inside <think> is not dispatched, done ends the chain"
runner: probe.py
runtimes: [python, rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
