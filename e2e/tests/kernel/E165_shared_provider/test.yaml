# WHAT to measure and HOW LONG to allow. NO MODEL: scripted OpenAI-compatible servers play the
# model for two ai_chat.tools chats on ONE vllm_backend provider (#632), on the Rust host, driven
# over web_rest.
id: shared_provider
group: kernel
title: "two chats on one provider (#632): each chat's request carries its own knobs (temperature, max_tokens, top_k), each chat holds its own line on the provider (the provider's record unchanged, a writer cannot hand out a line it does not hold), the provider's KV table sees both conversations; the provider stays when its chats go, and a change to it reaches its chat's next request"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
