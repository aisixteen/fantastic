# WHAT to measure and HOW LONG to allow. NO MODEL: scripted OpenAI-compatible servers
# play the model of a lead and a worker (the kernel's own vllm_backend agents), driven
# over web_rest.
id: chain_restart
group: kernel
title: "work in flight survives a kernel KILL (#726, #795): the lead's call to an exec agent (a 30 s job) is out when the kernel process is killed, and the worker's message was acked and read at once (nothing is held); a new kernel on the same folder (its ledger on a sqlite_store) settles the cut call as a dead letter (cancelled, nothing in flight), the lead is told its call's reply will not come, the worker is told nothing, and the lead's work goes on: it resends the job and reads its reply"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  turn_seconds: 300
