# THE SET-UP PAGE, END TO END, LIVE — a scripted keyboard writes an AI agent
# through the terminal's set-up wizard for the CONFIGURED backend (the AI
# backend is configurable; vLLM here), stores its key there, and the agent answers. Every value the
# record gets is the operator's, from the environment: the endpoint and model
# (VLLM_ENDPOINT, FANTASTIC_AI_MODEL), the window and output (CTX, MAX_TOKENS —
# 262144), the KV table (VLLM_KV_SLOTS, VLLM_KV_OVERFLOW), the key
# (VLLM_API_KEY / VLLM_API_KEY_FILE — typed into the page, never printed).
# Reasoning: xhigh with a 64k thinking budget.

id: setup_ai
title: fantastic — the set-up page writes the configured AI agent, stores its key, it answers (live)
runtimes: [tui]
costs: live
live: vllm
features: [vllm]

screen: {rows: 80, cols: 400}

runs:
  - name: init
    script: |
      wait 1200
      key space
      wait 3500
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    after_exit:
      exit_code: 0
      lock_released: true

  # ── the wizard (the canvas's two pages, in the terminal):
  # page 1 → vllm (the 4th provider; nothing saved) → page 2, its lines: name
  # (`vllm-1`), URL, model, key (← → paste a new key: its value, then where keys
  # are kept — PLAIN in this throwaway home, never the real keychain), kv
  # overflow, advanced (enter opens: max_tokens, context_window, kv_slots,
  # metrics_url, temperature, top_p, top_k, reasoning_effort, thinking budget, …)
  # → advanced closed again, CREATE & OPEN CHAT ──
  - name: write
    timeout: 300
    script: |
      wait 2500
      type G
      wait 200
      key enter
      wait 800
      shot page
      key down
      key down
      key down
      key enter
      wait 400
      key down
      key enter
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      type {vllm_endpoint}
      key enter
      key down
      key enter
      type {vllm_model}
      key enter
      key down
      key right
      key down
      key enter
      type {vllm_key}
      key enter
      key down
      key right
      key down
      {vllm_kv_overflow_keys}
      key down
      key enter
      key down
      key enter
      type {max_tokens}
      key enter
      key down
      key enter
      type {ctx}
      key enter
      key down
      key enter
      type {vllm_kv_slots}
      key enter
      key down
      key down
      key down
      key down
      key down
      key right
      key down
      key enter
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      type 65536
      key enter
      wait 200
      shot filled
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key enter
      key down
      key enter
      wait 4000
      shot written
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    frames:
      page: {contains: ["NEW AI AGENT", "1 / 2"], lacks: ["vllm    not in this build"]}
      # the key masked, PLAIN in the run's throwaway home — never the real keychain
      filled: {contains: ["vllm-1", "262144", "xhigh", "65536", "‹ a 0600 text file (plain) ›", "‹ paste a new key ›"]}
      # made, its chat open: the agent is the selected one
      written: {contains: [" · vllm-1 · "], lacks: ["✕"]}
    after_exit:
      exit_code: 0
      lock_released: true
      files_exist:
        - .fantastic/agents/user/agents/vllm-1/agent.yaml
        - home/agents/ai_agent/saved/vllm-1.yaml
      # the key the page stored IS the configured one (compared, never printed)
      key_stored_is: VLLM_API_KEY

  # ── a later run: the agent rehydrates, the human writes to it, it answers ──
  - name: answer
    timeout: 600
    script: |
      wait 2500
      type /vllm-1
      key enter
      wait 300
      key enter
      wait 1200
      key tab
      type Reply with exactly one word: DELTA
      key enter
      wait 180000
      shot answer
      key ctrl-c
      wait 150
      key ctrl-c
      exit 15000
    frames:
      answer: {contains: ["DELTA", "vllm-1:"]}
    after_exit:
      exit_code: 0
      lock_released: true
      rows_grew: true

  # ── a restart: boot is lazy — the agent holds no history until its next turn,
  #    and the transcript is a view of what it holds (`rows`) ──
  - name: recall
    script: |
      wait 2500
      type /vllm-1
      key enter
      wait 300
      key enter
      wait 1500
      shot recalled
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    frames:
      recalled: {contains: ["has not loaded its history yet"]}
    after_exit:
      exit_code: 0
      lock_released: true
