# THE SET-UP PAGE, END TO END, LIVE — a scripted keyboard writes an AI agent
# through the terminal's set-up page for the CONFIGURED backend (owner,
# 2026-10-04: the AI backend is configurable; vLLM, globally, until he
# redecides), stores its key there, and the agent answers. Every value the
# record gets is the operator's, from the environment: the endpoint and model
# (VLLM_ENDPOINT, FANTASTIC_AI_MODEL), the window and output (CTX, MAX_TOKENS —
# 262144), the KV table (VLLM_KV_SLOTS, VLLM_KV_OVERFLOW), the key
# (VLLM_API_KEY / VLLM_API_KEY_FILE — typed into the page, never printed).
# Reasoning: xhigh with a 64k thinking budget (owner, 2026-10-04).

id: setup_ai
title: fantastic — the set-up page writes the configured AI agent, stores its key, it answers (live)
runtimes: [tui]
costs: live
live: vllm
features: [vllm]

screen: {rows: 80, cols: 400}

runs:
  - name: init
    script: |
      wait 1200
      key space
      wait 3500
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    after_exit:
      exit_code: 0
      lock_released: true

  # ── the page: the record's required fields, xhigh + its budget, the key → WRITE ──
  - name: write
    timeout: 300
    script: |
      wait 2500
      type G
      wait 200
      key enter
      wait 800
      shot page
      key enter
      type docreader
      key enter
      key down
      key right
      key down
      key enter
      type {vllm_endpoint}
      key enter
      key down
      key enter
      type {vllm_model}
      key enter
      key down
      key enter
      type {max_tokens}
      key enter
      key down
      key enter
      type {vllm_kv_slots}
      key enter
      key down
      {vllm_kv_overflow_keys}
      key down
      key enter
      type {ctx}
      key enter
      key down
      key down
      key down
      key down
      key down
      key down
      key right
      key down
      key enter
      key backspace
      key backspace
      key backspace
      key backspace
      key backspace
      type 65536
      key enter
      wait 200
      shot filled
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key down
      key right
      key right
      wait 200
      key enter
      wait 800
      shot mode
      type k
      wait 500
      type {vllm_key}
      key enter
      wait 800
      shot keyed
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key up
      key enter
      wait 3000
      shot written
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    frames:
      page: {contains: ["SET UP AN AI AGENT"], lacks: ["no ai backend is linked"]}
      filled: {contains: ["docreader", "‹ vllm_backend.tools ›", "262144", "xhigh", "65536"]}
      # PLAIN, in the run's throwaway home — a run must never write the real keychain
      mode: {contains: ["keys kept ‹ plain ›"], lacks: ["‹ secure ›"]}
      keyed: {contains: ["key stored as `vllm/"], lacks: ["the keychain ("]}
      written: {contains: ["✓ written to  .fantastic/agents/user/agents/docreader/agent.yaml"]}
    after_exit:
      exit_code: 0
      lock_released: true
      files_exist: [.fantastic/agents/user/agents/docreader/agent.yaml]
      # the key the page stored IS the configured one (compared, never printed)
      key_stored_is: VLLM_API_KEY

  # ── a later run: the agent rehydrates, the human writes to it, it answers ──
  - name: answer
    timeout: 600
    script: |
      wait 2500
      type /docreader
      key enter
      wait 300
      key enter
      wait 1200
      key tab
      type Reply with exactly one word: DELTA
      key enter
      wait 180000
      shot answer
      key ctrl-c
      wait 150
      key ctrl-c
      exit 15000
    frames:
      answer: {contains: ["DELTA", "docreader:"]}
    after_exit:
      exit_code: 0
      lock_released: true
      rows_grew: true

  # ── a restart: boot is lazy — the agent holds no history until its next turn,
  #    and the transcript is a view of what it holds (`rows`) ──
  - name: recall
    script: |
      wait 2500
      type /docreader
      key enter
      wait 300
      key enter
      wait 1500
      shot recalled
      key ctrl-c
      wait 150
      key ctrl-c
      exit 8000
    frames:
      recalled: {contains: ["has not loaded its history yet"]}
    after_exit:
      exit_code: 0
      lock_released: true
