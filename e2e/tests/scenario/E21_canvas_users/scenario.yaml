# THE CANVAS'S USERS, end to end. No model. One host (`fantastic --headless
# canvas`), several headless Chromes — one per identity, since a browser keeps
# ONE token for every tab of an origin (browser storage, never the URL). Every
# host call a tab makes goes through the users gateway (`users`), which acts as
# the user its token is.
#
# The owner's rules checked here: the DEFAULT is no token = full rights; the
# human can make a token mandatory on demand (a `token_sha256` on `user`), and
# then a tab with no token is refused and asked for one. A user's every right is
# its `can_call` — page agents as `<tree guid>|<id>`.

id: canvas_users
title: the canvas's users — tokens, page grants, the lock, live sync between tabs
runtimes: [canvas_users]
costs: free
window: {width: 1280, height: 800}

tokens: {ro: ro-token-1, ed: ed-token-2, admin: admin-token-3}

runs:
  - default-full-rights      # no token: a cell placed, on disk
  - two-tabs-live            # a second tab sees a cell placed / removed in the first, no reload
  - read-only-user           # `ro` (reflect on the root): sees the cells, the page is locked, a write is refused
  - partial-user             # `ed` (`*` on a child canvas): root locked, the child writable, its cell lands
  - partial-sees-only-its-canvas  # `ed` does not see the root's other cells — load_tree and `around` (the host's, from the records)
  - token-mandatory          # `user` carries a hash: no token → the token form; the token → the canvas
