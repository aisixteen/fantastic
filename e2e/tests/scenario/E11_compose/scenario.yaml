# THE SCENARIO — shared data, one copy, every runtime.
#
# Harder than `dialog` in one specific way: the answer CANNOT come from the
# model's weights. The task asks for the SHA-256 of a nonce minted at test time,
# so the only way to produce it is to actually run code — the model must find
# the compute agent, drive it, and route the result into the store. A model that
# says DONE without computing cannot pass: it does not know the number.
# Fabrication is not merely detected, it is impossible.

id: compose
title: composed + computed + stored — the answer cannot come from weights

# `$NONCE` is substituted by the runner with a value minted for THIS run.
task: >-
  Compute the SHA-256 hex digest of the exact string '$NONCE' and store its
  FIRST 12 CHARACTERS in a document named exactly 'digest' (no extension) in the `yaml_store` agent.
  You cannot know this value without computing it. Then say DONE.

# `compute` is `exec_bridge` on every runtime: start a background job, then poll
# `status` for its stdout — that takes more turns than a single call.
limits:
  max_turns: 24
  idle_seconds: 240

roster:
  - role: memory
    id: yaml_store
    sentence: A text-document memory — plain files, any format.
    verbs:
      read: "args: path — returns {path, lines: [{n, text}], version}"
      write: "args: path, bytes — stores the document"
  # Present, UNMENTIONED — the model has to find it. The runner supplies the
  # implementation its kernel has (an interpreter on the host runtimes, an
  # in-process evaluator in js).
  - role: compute
    id: compute
  - role: render_sink
    id: cli

grants:
  ai_can_call: [cli, yaml_store, compute, "$root:docs"]

# FALSIFIABLE against a value minted at test time. `$DIGEST` is the first 12
# chars of sha256($NONCE), computed by the runner — never by the model.
expect:
  - read: {agent: yaml_store, path: digest}
    contains: "$DIGEST"
