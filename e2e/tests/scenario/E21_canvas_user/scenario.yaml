# THE CANVAS'S ONE USER, end to end. No model. One host (`fantastic --headless
# canvas`), a headless Chrome. Every host call a tab makes goes through `user`
# (`user.forward`); who may call it is `user`'s grants, nothing else (owner,
# 2026-10-13: the web token is gone). Single user (owner, 2026-10-03): no other
# users, no per-user page grants, no tab sync.

id: canvas_user
title: the canvas's one user — a tab gets in through `user`, and `around` reads the page records
runtimes: [canvas_user]
costs: free
window: {width: 1280, height: 800}

runs:
  - tab-gets-in              # a tab gets in: a cell placed, on disk
  - around-from-records      # the host's `around` finds it
