# THE BROWSER VIEW, end to end — no model, no browser engine. The runner is the
# page: it fetches it, opens the socket as the host's own origin, watches `ui`,
# sends intents and rebuilds the screen from the frames the ONE ViewModel
# publishes. The last run adds the terminal View (the PTY rig) on the same
# directory at the same time: a key in either View must move both.

id: web
title: fantastic web — one ViewModel, drawn by the browser and the terminal
runtimes: [web]
costs: free

runs:
  # ── 1 · first `fantastic --headless web --port N`: inits, serves the page ──
  - name: first-web
    port: true
    first:
      contains: ["kernel_state", "✉ Activity", "exec", "files", "user", "web_ui", "+ add an ai agent"]
    # the screen opens ON the `web` recipe (focus in its pane): Esc to the tree, then v
    keys: ["Esc", "v"]
    after:
      contains: ["# exec", "# files", "v tree · < collapse"]

  # ── 2 · the same `--port` again changes nothing: accepted ──────────────────
  - name: same-port-again
    port: true
    first:
      contains: ["kernel_state", "web_ui"]

  # ── 2b · a DIFFERENT port: the flag is creation-only ─────────────────────────
  - name: port-is-creation-only
    port: other
    refused: "creation-only"

  # ── 3 · no flag: the port comes from the record; state rehydrates ─────────
  - name: rehydrate
    first:
      contains: ["kernel_state", "web_ui"]

  # ── 4 · `fantastic web`: the terminal (the default) and the browser, one ViewModel
  #       rig time ≈ browser time + ~1 s (the browser connects once the port is up)
  - name: tui-and-web
    tui: true
    script: |
      wait 4000
      shot before
      wait 3000
      shot after_browser_key
      key v
      wait 1500
      shot after_terminal_key
      wait 1500
      key ctrl-c
      wait 150
      key ctrl-c
      exit 10000
    browser:
      - {wait: 3300, key: Esc}                     # out of the `web` pane the recipe opened…
      - {wait: 200, key: v}                        # …the browser flips the sidebar…
      - {wait: 3500, expect: {label: after-terminal-key, contains: ["● fs_loader", "v flat · < collapse"]}}
    frames:
      before: {contains: ["● fs_loader", "v flat · < collapse"]}
      after_browser_key: {contains: ["# exec", "v tree · < collapse"]}   # …and the terminal shows it
      after_terminal_key: {contains: ["● fs_loader", "v flat · < collapse"]}

  # ── 5 · `fantastic web ai`: both recipes run, the LAST one shows. This build
  #       has no ai agent and `ai` adds none yet, so it opens the set-up page.
  - name: last-recipe-shows
    tui: true
    args: "web ai"
    script: |
      wait 4000
      shot shows
      wait 3000
      key ctrl-c
      wait 150
      key ctrl-c
      exit 10000
    browser:
      - {wait: 2500, expect: {label: shows, contains: ["SET UP AN AI AGENT"]}}
    frames:
      shows: {contains: ["SET UP AN AI AGENT", "web_ui"]}

  # ── 6 · `fantastic --headless`: no screen; the kernel's messages stream out ─
  - name: headless-stream
    stream:
      contains: ["kernel_state call reflect", "store call write_stream"]
      lacks: ["\x1b["]
