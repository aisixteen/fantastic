# WHAT to measure and HOW LONG to allow. NO MODEL: scripted OpenAI-compatible servers
# play the model of a lead and a worker (the kernel's own vllm_backend agents),
# driven over web_rest.
id: deadletter_deadline
group: scenario
title: "a call past its sender's deadline (root send_timeout) goes to the dead letter: the sender is told its id, resends and drops it, and the resend's reply reaches it once; a message to a busy AI is acked at once, never held, and read by one pass after the busy one (#795); on the Rust lane the ledger store is then a sqlite_store, a second dead letter is formed, the kernel is stopped and a new one booted on the same folder, and the lead finds it in its ledger (timed_out, same id) and resends it"
runner: probe.py
runtimes: [rust]
costs: free
limits:
  idle_seconds: 120
  pass_seconds: 300
