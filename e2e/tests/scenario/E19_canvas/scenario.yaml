# THE CANVAS, a thin web UI, end to end. No model. The runner builds the product
# (whose build packs the canvas and embeds `canvas.zip`), runs
# `fantastic canvas --port N` over a fresh dir, and drives a REAL
# headless Chrome over CDP against the page it announces: a double click opens the action popup, `terminal` there spawns one,
# keystrokes run in it, a drag moves it, a restart rehydrates it, the close
# button closes its view (the agent lives on). Every step is checked ON DISK too: the canvas's thin agents
# are folders under its root view in the page loader's store (`.fantastic/web`).
#
# The owner's design: the page holds no store and no AI; its thin agents are
# records the page loader (`web_loader`, under the host's `canvas_root`) pumps to
# folders under `agents/canvas/agents/view_root/agents/`, and rehydrates on boot;
# a cell's backend is a direct child of the host's `canvas_root`.

id: canvas
title: the canvas — thin agents saved through the ws loader, rehydrated on boot
runtimes: [canvas]
costs: free

port_base: 18830
window: {width: 1280, height: 800}

runs:
  - name: first-load
    # the page seeds its root and the loader writes it under its own anchor
    expect:
      # nothing floats: no top bar, no sidebar — the background alone
      files_exist: [.fantastic/web/agents/canvas/agent.yaml, .fantastic/web/agents/canvas/agents/view_root/agent.yaml,
                    # THE HOST TREE: canvas_root holds the files, the page loader and the cells' backends directly
                    .fantastic/agents/user/agents/web/agents/canvas_page/agents/canvas_root/agent.yaml,
                    .fantastic/agents/user/agents/web/agents/canvas_page/agents/canvas_root/agents/static_files/agent.yaml,
                    .fantastic/agents/user/agents/web/agents/canvas_page/agents/canvas_root/agents/web_loader/agent.yaml]
      # no backend folders any more; no sub-loader record at its root (the loader's
      # record lives in the host tree)
      files_absent: [.fantastic/web/agent.yaml,
                     .fantastic/agents/user/agents/web/agents/canvas_page/agents/canvas_root/agents/backend,
                     .fantastic/agents/user/agents/web/agents/canvas_page/agents/canvas_root/agents/web_loader/agents/static_files]
      canvas_members: 0
      group_size: 0

  # ── the pair: a double click spawns a backend (a child of `canvas_root`) + its cell
  - name: spawn-terminal
    dblclick: {x: 500, y: 350}
    # a line whose OUTPUT is the answer, not its echo — per shell (`oslayer.for_os`)
    type: {posix: "echo hi-$((6*7))", nt: "set /a x=6*7>nul & call echo hi-%x%"}
    expect:
      xterm_contains: ["hi-42"]
      canvas_members: 1
      # backend-owned views: the host agent is made FIRST, the cell only views it
      member: {handler_module: terminal_view.ts, owns_backend: false}
      # a thin agent lives ONLY under its view — never a top-level loader record
      not_top_level: true
      backend_in_group: true
      view_bound: true
      group_size: 1

  # ── the backend lives its own life: the page leaving and coming back never
  #    touches the backend behind it — the shell keeps its state
  - name: page-reload
    type: {posix: "export FC_MARK=7; echo set-$FC_MARK", nt: "set \"FC_MARK=7\" & call echo set-%FC_MARK%"}
    # leave only once the shell has taken the line (keys in flight at unload are the page's to lose)
    before_reload_xterm: "set-7"
    reload_page: true
    type_after: {posix: "echo mark-$FC_MARK$FC_MARK", nt: "echo mark-%FC_MARK%%FC_MARK%"}
    expect:
      canvas_members: 1
      backend_kept: true
      group_size: 1
      xterm_contains: ["mark-77"]

  - name: move
    drag: {dx: 120, dy: 80}
    expect:
      canvas_members: 1
      moved: true

  - name: restart
    # rehydrate WITHOUT --port (read from `web`'s record); while it still runs,
    # an argument (a different --port) is refused (exit 2, "already running")
    restart: {wrong_port: true}
    # nothing starts on its own (TOS): the shell comes back
    # STOPPED — the human's ▶ starts it
    click: ".term-stopped .start"
    type: {posix: "echo again-$((7*6))", nt: "set /a y=7*6>nul & call echo again-%y%"}
    expect:
      # the headless stdout is the kernel's message stream, no escapes
      stream: true
      lock_released_between: true
      load_tree: {canvas: null, member_parent: view_root}
      canvas_members: 1
      xterm_contains: ["again-42"]
      kept_position: true
      group_size: 1

  # ── BACKEND-OWNED VIEWS (tmp/backend_owned_views.md): the host is the truth —
  #    a cell whose agent is gone is CLEANED on load (never respawned)
  - name: lost-backend
    restart: {offline: remove_backend}
    expect:
      canvas_members: 0
      group_size: 0
      page_frames: 0

  - name: spawn-again
    dblclick: {x: 500, y: 350}
    expect:
      canvas_members: 1
      member: {handler_module: terminal_view.ts, owns_backend: false}
      group_size: 1
      view_bound: true

  # ── ✕ closes the VIEW: the host agent lives on (listed in the sidebar)
  - name: close
    close: true
    expect:
      canvas_members: 0
      backend_record: true
      group_size: 1
      files_exist: [.fantastic/web/agents/canvas/agent.yaml]

  # ── a view lost while the host was down: the agent stays, the page shows nothing
  - name: orphan
    dblclick: {x: 500, y: 350}
    then_restart: {offline: remove_member}
    expect:
      canvas_members: 0
      group_size: 2
      page_frames: 0

  # ── the shell ending closes its VIEW; its exec agent lives on
  - name: exit-closes
    dblclick: {x: 500, y: 350}
    type: "exit"
    expect:
      canvas_members: 0
      group_size: 3
      page_frames: 0

  - name: restart-empty
    restart: true
    expect:
      load_tree: {canvas: null}
      canvas_members: 0
      group_size: 3
      page_frames: 0
