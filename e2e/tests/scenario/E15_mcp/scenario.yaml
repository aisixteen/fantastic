# THE SCENARIO — data, one copy. Unlike E10–E14 there is NO MODEL here: the
# "actor" is a scripted MCP client (runners/mcp.py) and every call it makes is
# written below. What is measured is the PRODUCT BINARY's MCP face — `fantastic
# mcp` hosting the rust kernel in-process over stdio — not a model's judgement.
#
# Protocol: MCP 2025-11-25 over stdio, because that is what Claude Code 2.1.280's
# stdio client sends (measured 2026-09-22: its first frame is `initialize` at
# 2025-11-25). No Claude Code is run by this test, ever — owner rule, TOS.
#
# Runs are sequential processes over ONE temp directory, so the second run
# proves rehydration of what the first one left behind.
#
# Placeholders the runner fills: $NONCE (fresh per run), $ROOT (the kernel's
# own root id, discovered from the first reflect — never spelled here).

id: mcp
title: fantastic mcp — the stdio leg, scripted end to end
runtimes: [mcp]
costs: free

# Files the runner writes into the temp directory before the first run.
fixture:
  note.txt: "hello from E15 $NONCE\n"

runs:
  # ── 1 · a fresh directory: init from the blueprint, create the leg ─────────
  - name: create
    argv: [--can-call, "files,exec,user", --settle-bound-ms, "20000"]
    steps:
      - call: initialize
        params:
          protocolVersion: "2025-11-25"
          capabilities: {}
          clientInfo: {name: e15, version: "1"}
        expect:
          result.protocolVersion: "2025-11-25"
          result.serverInfo.name: fantastic
          result.capabilities.tools: present
      - notify: notifications/initialized
      - call: ping
        expect: {result: present}
      - call: tools/list
        expect:
          tool_names: [reflect, send]
      # the zero-arg reflect is the kernel's own primer
      - tool: reflect
        args: {}
        expect:
          is_error: false
          body_has_keys: [tree, bundles, readme]
          capture_root: true
      - tool: reflect
        args: {target: files}
        expect:
          is_error: false
          verbs_include: [read_stream, list]
      # a real read, through a real agent, as the leg
      - tool: send
        args: {items: [{target: files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          is_error: false
          item0.status: completed
          text_contains: "hello from E15 $NONCE"
      # the gate: the leg was never granted delete_agent on the root
      - tool: send
        args: {items: [{target: kernel, payload: {type: delete_agent, id: files}}]}
        expect:
          is_error: true
          text_contains: "may not call"
      # a shape error is the client's, and says how to fix it
      - tool: send
        args: {items: [{target: files, payload: {verb: read_stream}}]}
        expect:
          is_error: true
          text_contains: "payload.type"
      - call: no/such/method
        expect:
          error.code: -32601
    after_exit:
      exit_code: 0
      lock_released: true
      files_exist: [.fantastic/agents/mcp/agent.yaml, .fantastic/memory.db]
      # THE MEMORY STORE holds the execution rows: no tape, no ledger, no JSON/XML
      files_absent: [.fantastic/messages.yaml, .fantastic/ledger.json, .fantastic/messages.xml, .fantastic/agent.json]
      store_has:
        # the call row carries its payload verbatim, and who made the call …
        - {kind: call, verb: read_stream, caller: mcp, payload.type: read_stream, payload.path: note.txt}
        # … and its settle row the outcome (unnamed: a digest, never the body)
        - {kind: settle, settled: files, outcome.status: completed}
      record:
        .fantastic/agents/mcp/agent.yaml:
          handler_module: web_mcp.tools
          settle_bound_ms: 20000
          can_call_has: [files, exec, user]
        .fantastic/agents/set_of_agents/agents/files/agent.yaml:
          callable_by_has: [mcp, user, exec]
      rows_by: {agent: mcp, at_least: 3}
      blueprint_never_names: mcp

  # ── 2 · same directory, no flags: bind to the leg, rehydrate ───────────────
  - name: rehydrate
    argv: []
    steps:
      - call: initialize
        params: {protocolVersion: "2025-11-25", capabilities: {}, clientInfo: {name: e15, version: "1"}}
        expect: {result.protocolVersion: "2025-11-25"}
      - notify: notifications/initialized
      - tool: send
        args: {items: [{target: files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          item0.status: completed
          text_contains: "hello from E15 $NONCE"
    after_exit:
      exit_code: 0
      lock_released: true
      rows_grew: true
      mcp_records: 1

  # ── 3 · a flag on an existing leg is refused, not ignored ──────────────────
  - name: refuse-flags
    argv: [--can-call, files, --settle-bound-ms, "5"]
    steps: []
    after_exit:
      exit_code: 1
      stderr_contains: "change them with update_agent"
      lock_released: true
