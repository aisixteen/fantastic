# THE SCENARIO — data, one copy. Unlike E10–E14 there is NO MODEL here: the
# "actor" is a scripted MCP client (runners/mcp.py) and every call it makes is
# written below. What is measured is the PRODUCT BINARY's MCP face — `fantastic
# mcp` hosting the rust kernel in-process over stdio — not a model's judgement.
#
# Protocol: MCP 2025-11-25 over stdio, because that is what Claude Code 2.1.280's
# stdio client sends (its first frame is `initialize` at 2025-11-25). No Claude
# Code is run by this test, ever (TOS).
#
# Runs are sequential processes over ONE temp directory, so the second run
# proves rehydration of what the first one left behind.
#
# Placeholders the runner fills: $NONCE (fresh per run).
#
# THE LEG'S LINES (the blueprint's `mcp`): one `create` line on `canvas_root`, the
# user space, and `user: {call: [import_subtree]}`. That line shows the system
# agents `files` and `exec` at call level (identity and every record field, no
# verb of theirs), so a read, a run, a field write or a delete there is
# `not_allowed` naming what its line lacks: the leg sees them.
# Its work goes through a file bridge and a command runner it makes UNDER
# `canvas_root` itself (`e15_files`, `e15_exec`), which its line reaches.

id: mcp
title: fantastic mcp — the stdio leg, scripted end to end
runtimes: [mcp]
costs: free

# Files the runner writes into the temp directory before the first run.
fixture:
  note.txt: "hello from E15 $NONCE\n"
  work-e15/w.txt: "in the work folder $NONCE\n"

runs:
  # ── 1 · a fresh directory: init from the blueprint (the leg is seeded) ─────
  - name: create
    argv: []
    steps:
      - call: initialize
        params:
          protocolVersion: "2025-11-25"
          capabilities: {}
          clientInfo: {name: e15, version: "1"}
        expect:
          result.protocolVersion: "2025-11-25"
          result.serverInfo.name: fantastic
          result.capabilities.tools: present
      - notify: notifications/initialized
      - call: ping
        expect: {result: present}
      - call: tools/list
        expect:
          tool_names: [reflect, send]
      # the zero-arg reflect names the root; the leg holds no line on it, so it is
      # the unknown answer (kernel-spec answer 31: the root frame is operator only)
      - tool: reflect
        args: {}
        expect:
          is_error: true
          body_unknown: kernel
      # the leg's one line on `user` (`import_subtree`: the import goes through the
      # legs) covers user's tree at call level, `files` included: its identity,
      # its record fields and the tree, none of its verbs (the leg holds none
      # there), and never a root runtime extra (those are the operator's)
      - tool: reflect
        args: {target: files}
        expect:
          is_error: false
          body_has_keys: [id, handler_module, tree, root, allow_count]
          body_lacks_keys: [guid, peers, env, version, runtime, persistence]
          body_verbs: []
      # a field it sees is never one it sets: no `update` line, `not_allowed`
      - tool: send
        args: {items: [{target: kernel, payload: {type: update_agent, id: files, readonly: false}}]}
        expect:
          is_error: true
          item0_not_allowed: readonly
      # its own bridge over the work folder, and its own runner, UNDER canvas_root
      - tool: send
        args: {items: [{target: kernel, payload: {type: create_agent, parent_id: canvas_root, id: e15_files, handler_module: file_bridge.tools, root: ".", allow: [note.txt]}}]}
        expect:
          is_error: false
          item0.status: completed
      - tool: send
        args: {items: [{target: kernel, payload: {type: create_agent, parent_id: canvas_root, id: e15_exec, handler_module: exec_bridge.tools, allowed: [".*"], cwd: ".", inherit_env: ["*"]}}]}
        expect:
          is_error: false
          item0.status: completed
      - tool: reflect
        args: {target: e15_files}
        expect:
          is_error: false
          body_has_keys: [sentence]
      # HOW TO CALL it is a reflect with `part` (a plain reflect carries one line per verb)
      - tool: send
        args: {items: [{target: e15_files, payload: {type: reflect, part: docs}}]}
        expect:
          is_error: false
          item0.status: completed
          item0_verbs_include: [read_stream, list]
      # a read through the system `files`: the leg sees it, its line holds no read
      - tool: send
        args: {items: [{target: files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          is_error: true
          item0_not_allowed: read_stream
      # a real read, through the leg's own bridge
      - tool: send
        args: {items: [{target: e15_files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          is_error: false
          item0.status: completed
          text_contains: "hello from E15 $NONCE"
      # `ps` needs no line: the leg's own tree
      - tool: send
        args: {items: [{target: kernel, payload: {type: ps}}]}
        expect:
          is_error: false
          item0.status: completed
      # the leg may not delete a system agent it sees: `not_allowed` naming `delete`
      - tool: send
        args: {items: [{target: kernel, payload: {type: delete_agent, id: files}}]}
        expect:
          is_error: true
          item0_not_allowed: delete
      # a shape error is the client's, and says how to fix it
      - tool: send
        args: {items: [{target: files, payload: {verb: read_stream}}]}
        expect:
          is_error: true
          text_contains: "payload.type"
      - call: no/such/method
        expect:
          error.code: -32601
    after_exit:
      exit_code: 0
      lock_released: true
      files_exist: [.fantastic/agents/user/agents/web/agents/mcp/agent.yaml, .fantastic/memory.db]
      # no tape, no ledger, no JSON/XML — and the kernel's execution rows stay
      # in RAM (`kernel_memory`): memory.db holds AI rows only
      files_absent: [.fantastic/messages.yaml, .fantastic/ledger.json, .fantastic/messages.xml, .fantastic/agent.json]
      no_kernel_rows: true
      record:
        .fantastic/agents/user/agents/web/agents/mcp/agent.yaml:
          handler_module: web_mcp.tools
          can_keys: [canvas_root, user]
        # the callee keeps no list of callers: nothing the run did names the leg there
        .fantastic/agents/user/agents/files/agent.yaml:
          can_lacks: [mcp]

  # ── 2 · same directory: bind to the leg, rehydrate ─────────────────────────
  - name: rehydrate
    argv: []
    steps:
      - call: initialize
        params: {protocolVersion: "2025-11-25", capabilities: {}, clientInfo: {name: e15, version: "1"}}
        expect: {result.protocolVersion: "2025-11-25"}
      - notify: notifications/initialized
      - tool: send
        args: {items: [{target: e15_files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          item0.status: completed
          text_contains: "hello from E15 $NONCE"
    after_exit:
      exit_code: 0
      lock_released: true
      no_kernel_rows: true
      mcp_records: 1

  # ── 3 · any argument is refused, not ignored ──────────────────────────────
  - name: refuse-args
    argv: [--can-call, files]
    steps: []
    after_exit:
      exit_code: 2
      stderr_contains: "takes only --statedir and --workdir"
      lock_released: true

  # ── 4 · a kernel already runs here: `fantastic mcp` ATTACHES to its channel ─
  - name: attach
    host_argv: [--headless]
    argv: []
    steps:
      - call: initialize
        params: {protocolVersion: "2025-11-25", capabilities: {}, clientInfo: {name: e15, version: "1"}}
        expect: {result.protocolVersion: "2025-11-25", result.serverInfo.name: fantastic}
      - notify: notifications/initialized
      - tool: send
        args: {items: [{target: e15_files, payload: {type: read_stream, path: note.txt}}]}
        expect:
          item0.status: completed
          text_contains: "hello from E15 $NONCE"
    after_exit:
      exit_code: 0
      lock_held_by_host: true
      stderr_contains: "Register it ONCE"
      lock_released: true
      no_kernel_rows: true
      mcp_records: 1

  # ── 5 · a state folder far from the work folder (a path too long for a unix
  #       socket address): the headless host takes both flags, `fantastic mcp`
  #       attaches with --statedir alone, and the leg's own bridge and runner work
  #       in the WORK folder (a new state folder: made again here) ─
  - name: far_state
    statedir: far/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/state
    host_argv: [--headless, --statedir, far/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/state, --workdir, work-e15]
    argv: [--statedir, far/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/state]
    vars:
      pwd_cmd: {posix: pwd, nt: cmd}
      pwd_args: {posix: [], nt: [/c, cd]}
    steps:
      - call: initialize
        params: {protocolVersion: "2025-11-25", capabilities: {}, clientInfo: {name: e15, version: "1"}}
        expect: {result.protocolVersion: "2025-11-25", result.serverInfo.name: fantastic}
      - notify: notifications/initialized
      - tool: send
        args: {items: [{target: kernel, payload: {type: create_agent, parent_id: canvas_root, id: e15_files, handler_module: file_bridge.tools, root: ".", allow: [w.txt]}}]}
        expect:
          is_error: false
          item0.status: completed
      - tool: send
        args: {items: [{target: kernel, payload: {type: create_agent, parent_id: canvas_root, id: e15_exec, handler_module: exec_bridge.tools, allowed: [".*"], cwd: ".", inherit_env: ["*"]}}]}
        expect:
          is_error: false
          item0.status: completed
      # the system `files` and `exec`: seen, and no verb of theirs held
      - tool: send
        args: {items: [{target: files, payload: {type: read_stream, path: w.txt}}]}
        expect:
          is_error: true
          item0_not_allowed: read_stream
      - tool: send
        args: {items: [{target: exec, payload: {type: run, command: "{pwd_cmd}", args: "{pwd_args}"}}]}
        expect:
          is_error: true
          item0_not_allowed: run
      - tool: send
        args: {items: [{target: e15_files, payload: {type: read_stream, path: w.txt}}]}
        expect:
          item0.status: completed
          text_contains: "in the work folder $NONCE"
      - tool: send
        args: {items: [{target: e15_exec, payload: {type: run, command: "{pwd_cmd}", args: "{pwd_args}"}}]}
        expect:
          item0.status: completed
          text_contains: "work-e15"
    after_exit:
      exit_code: 0
      lock_held_by_host: true
      lock_released: true
      files_exist: [far/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/state/agent.yaml, far/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/state/memory.db]
      files_absent: [work-e15/.fantastic]
