# WHAT to measure and HOW LONG to allow. NO MODEL: a scripted fake MCP server and
# the kernel's own mcp_client agent, driven over web_rest on every host runtime.
id: mcp_client
group: connectors
title: "a remote MCP server as an agent: discover + paged tools/list → per-agent verbs, every result mapping, the static key on every request; a legacy (2025-11-25) server through initialize, its session and version"
runner: probe.py
runtimes: [python, rust]
costs: free
