# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: docs_mechanics
group: agentic
title: it finds a deep agent and learns how to call it from a reflect's `tier`/`verb`/`part`, cutting the tree as it goes
runner: probe.py
runtimes: [rust]
costs: passes
limits:
  idle_seconds: 60
  max_passes: 24
  no_progress_passes: 32
  pass_chars: 60000
  pass_seconds: 300
env: {}
