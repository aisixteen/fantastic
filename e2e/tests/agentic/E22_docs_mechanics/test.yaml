# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: docs_mechanics
group: agentic
title: it finds a deep agent and learns how to call it from `docs`, cutting the tree as it goes
runner: probe.py
runtimes: [python, rust, swift]
costs: turns
limits:
  idle_seconds: 60
  max_turns: 24
  no_progress_turns: 32
  turn_chars: 60000
  turn_seconds: 300
env: {}
