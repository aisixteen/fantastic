# The agent tree this test builds.
#
# `<expr>` marks a value the probe computes at run time (a store id minted by
# the fixture); a bare string is literal. Grants are shown as written: this
# substrate is DENY-ALL, so the `can_call` / `callable_by` maps below are not
# decoration — they are the difference between a graph and a pile of agents.
# Read them in PAIRS: an egress grant with no matching ingress is a wire that
# carries nothing, which is exactly how one probe's push-back went missing.
#
# GENERATED from probe.py by helpers/roster.py, and re-checked against it by
# run.py before every run. Edit the probe, not this file.
roster:
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: yaml_store
  handler_module: yaml_state.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: shell
  handler_module: exec_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: web
  handler_module: web.tools
  parent_id: <root.id>
  can_call: '<{gid: [''read_stream''] for gid, *_ in GUARDS}>'
  callable_by:
    ai:
    - reflect
- id: <gid>
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: ai
  created_by: helpers.ai.connect
  can_call: '<{''$self'': ''*'', ''$parent'': ''*'', ''$children'': ''*'', ''kernel_state'': [''*'', ''create_agent'',
    ''update_agent'', ''delete_agent''], ''cli'': ''*'', mem[''id'']: ''*'', store[''id'']: ''*''}>'
