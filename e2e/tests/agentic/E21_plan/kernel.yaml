roster:
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: user
  handler_module: user_probe.tools
  parent_id: <root.id>
  can_call:
    ai: '*'
  callable_by:
    ai: '*'
    rest: '*'
    web: '*'
- id: yaml_store
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: shell
  handler_module: exec_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: probe_web
  handler_module: web.tools
  parent_id: <root.id>
  can_call: '<{gid: [''read_stream''] for gid, *_ in GUARDS}>'
  callable_by:
    ai:
    - reflect
- id: <gid>
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
- id: ai
  created_by: helpers.ai.connect
  can_call: '<{''$self'': ''*'', ''$parent'': ''*'', ''$children'': ''*'', root.id:
    [''*'', ''create_agent'', ''update_agent'', ''delete_agent''], ''cli'': ''*'',
    ''user'': ''*'', mem[''id'']: ''*'', store[''id'']: ''*''}>'
