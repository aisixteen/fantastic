roster:
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: user
  handler_module: user_probe.tools
  parent_id: <home(root)>
- id: yaml_store
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: shell
  handler_module: exec_bridge.tools
  parent_id: <home(root)>
- id: probe_web
  handler_module: web.tools
  parent_id: <home(root)>
- id: <gid>
  handler_module: file_bridge.tools
  parent_id: <parent>
- id: ai
  created_by: helpers.ai.connect
  can: '<{''user'': lines.ALL, mem[''id'']: lines.ALL, store[''id'']: lines.ALL, ''yaml_store'':
    lines.ALL, ''shell'': lines.ALL, ''probe_web'': lines.call(''reflect'')}>'
