roster:
- id: <agent_id>
  handler_module: exec_bridge.tools
  parent_id: <home(root)>
  can: '<{''totals'': lines.call(''write'', ''read'')}>'
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: readings
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: user
  handler_module: user_probe.tools
  parent_id: <home(root)>
- id: totals
  handler_module: file_bridge.tools
  parent_id: <home(root)>
- id: ai
  created_by: helpers.ai.connect
  can: '<{''readings'': lines.ALL, ''totals'': lines.ALL, ''user'': lines.call(''inquiry'',
    ''send''), EXECUTOR_LEG: lines.ALL, store[''id'']: lines.ALL, ''memory'': lines.ALL}>'
