roster:
- id: <agent_id>
  handler_module: exec_bridge.tools
  parent_id: <root.id>
  can_call:
    totals: '*'
  callable_by:
    ai: '*'
    rest: '*'
    web: '*'
- id: kernel_store
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
    rest: '*'
    web: '*'
- id: readings
  handler_module: file_bridge.tools
  parent_id: <root.id>
  callable_by:
    ai: '*'
    rest: '*'
    web: '*'
- id: totals
  handler_module: durable_memory.tools
  parent_id: <root.id>
  callable_by: '<{''ai'': ''*'', EXECUTOR_LEG: ''*'', ''rest'': ''*'', ''web'': ''*''}>'
- id: ai
  created_by: helpers.ai.connect
  can_call: '<{''$self'': ''*'', ''$parent'': ''*'', ''$children'': ''*'', root.id:
    [''*'', ''create_agent'', ''update_agent'', ''delete_agent''], ''cli'': ''*'',
    ''readings'': ''*'', ''totals'': ''*'', EXECUTOR_LEG: ''*'', store[''id'']: ''*''}>'
