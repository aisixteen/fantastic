# WHAT to measure and HOW LONG to allow. Never a model, an endpoint, a key
# or a backend name — those live in e2e/backends/, so this same file runs
# against any plug and the results stay comparable.
id: llamacpp
group: backend
title: llama-server round trip — streaming, thinking markers, tool envelope
runner: probe.py
costs: turns
limits:
  idle_seconds: 25
  max_turns: 10
  no_progress_turns: 8
  turn_chars: 120000
  turn_seconds: 600
env: {}
only_backend: llamacpp
