# The fantastic OS image, for mkosi v27.1 (pinned in CI: `systemd/mkosi@v27.1`).
# mkosi renames keys between majors (v25: `[Host]` -> `[Runtime]`, `Profile=` ->
# `Profiles=`): check these against the release's mkosi.1.md if the pin moves.
[Distribution]
Distribution=debian
# mkosi's Debian default is `testing` (distribution/debian.py): name the release
Release=trixie

[Output]
Format=disk
ImageId=fantastic-os

[Build]
# Every build tool (systemd-repart, ukify, apt…) from a tools tree mkosi makes
# (Debian when the host is Ubuntu), not from the runner's own packages.
ToolsTree=yes

[Content]
Bootable=yes
# the default; Debian needs the systemd-boot-efi package for it
Bootloader=systemd-boot
# systemd.firstboot=off: mkosi leaves /etc/machine-id unset, so the first boot
# is a "first boot", and systemd-firstboot could stop on the console and ask for
# a locale or a root password before the kiosk ever starts
KernelCommandLine=quiet consoleblank=0 systemd.firstboot=off
Hostname=fantastic
Locale=C.UTF-8
Timezone=UTC
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        dbus-user-session
        libpam-systemd
        polkitd
        upower
        wlr-randr
        kmod
        iproute2
        login
        tzdata
        apt
        ca-certificates
        network-manager
        pipewire
        pipewire-pulse
        wireplumber
        # the kiosk: pulls aisixteen-fantastic (from PackageDirectories), cage,
        # Mesa and the font through its Depends
        fantastic-session
