# CI only, never shipped: what boot_check.py and e2e_system.py need inside the guest.
# socat forwards the home kernel's and the system canvas's loopback ports; the guest
# agent runs commands. hostapd and iw are the Wi-Fi fixture: `mac80211_hwsim` makes two
# simulated radios and hostapd serves `fantastic-ci` on the second (below, in `extra/`).
[Content]
Packages=
        socat
        qemu-guest-agent
        hostapd
        iw
# relative to this profile's directory
ExtraTrees=extra
