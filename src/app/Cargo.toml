[package]
name = "fantastic-app"
version = "0.1.0"            # not bumped: the tag is the version (app.sh passes it to tauri)
edition = "2021"
rust-version = "1.90"        # tauri 2.12.1 and its plugins require 1.90
license = "AGPL-3.0-or-later"
publish = false
description = "Aisixteen Fantastic — the desktop app: the home kernel in-process, one window, a backdrop and native menus. Thin: no logic lives here."

[[bin]]
name = "fantastic-app"       # NOT `fantastic`: the canvas sidecar sits beside it as `fantastic`
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }   # defaults: wry, dynamic-acl, x11, dbus… — NOT linux-libxdo
tauri-plugin-dialog = "=2.8.1"                   # default feature gtk3: in-process GTK dialogs, no portal
window-vibrancy = "=0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde_json = "1"
fantastic-home = { path = "../tui/crates/fantastic-home" }               # the menu spec types (§8)
fantastic-home-kernel = { path = "../tui/crates/fantastic-home-kernel" } # the home kernel (Phase 2)

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication"] }  # NSAppKitVersionNumber

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"      # the build number; window-vibrancy already depends on it

[workspace]

[profile.release.build-override]
strip = "none"               # as src/Cargo.toml
