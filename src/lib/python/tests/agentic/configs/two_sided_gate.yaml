# Kernel config — the SYSTEM SHAPE only. Deployable as-is; carries no test
# metadata. What is asserted about it lives in `specs/two_sided_gate.yaml`.


loaders:
  - id: gate_loader
    file: gate.yaml
    manifest:
      agents:
        # The one sender. Its `can_call` is the egress half of the table; every
        # verb list here is half of an intersection, never a permission.
        - id: caller
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress
          can_call:
            both_grant: [list]
            only_caller_grants: [list]
            callee_narrows_verbs: [list, mkdir]

        # BOTH halves → the edge exists. The callee accepts one verb MORE than
        # the caller may send, so `mkdir` here dies on the CALLER's half.
        - id: both_grant
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress
          callable_by:
            caller: [list, mkdir]

        # Only the CALLER's half is declared → refused by the callee (ingress).
        # This is the shape a manifest author writes by accident: the field says
        # reachable, the send says otherwise.
        - id: only_caller_grants
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress

        # Only the CALLEE's half is declared → refused by the sender's own half
        # (egress). An open door is not a road.
        - id: only_callee_grants
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress
          callable_by:
            caller: [list]

        # Neither half → refused at egress, the FIRST half checked; the callee is
        # never consulted.
        - id: neither_grants
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress

        # The mirror of `both_grant`: the caller may send more verbs than the
        # callee accepts, so `mkdir` dies on the CALLEE's half.
        - id: callee_narrows_verbs
          handler_module: file_bridge.tools
          ingress_rule: allow_all_ingress
          callable_by:
            caller: [list]
