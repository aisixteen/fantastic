# Test spec for `configs/namespacing.yaml` — WHAT THIS SUITE ASSERTS.
# The kernel config it runs against is a separate, deployable file; nothing
# test-specific may leak into it.
config: namespacing.yaml

name: namespacing
description: >
  TWO wings, symmetric and unwired to each other. Each is a static_loader owning
  one memory (yaml_state) and one file space (file_bridge), and the two wings
  declare the SAME shapes under DIFFERENT parents — which is the point: a child's
  state has to be told apart by WHERE it sits, not by what it is called. The
  memories share a store (the one `.fantastic` provider, declared in wing_a's roster)
  and the file spaces are siblings one directory apart, so every isolation this
  scenario claims has to come from the tree position, not from separate media.

requirements: [C20]

expect:
  hydration: ok
  reboot: true
  closed_roster_sender: notes_a
  edges:
    - name: a wing reaches its own memory on the structural baseline
      from: wing_a
      to: notes_a
      send: {type: set, key: room, value: a}
      allow: true
    - name: a wing reaches its own file space on the structural baseline
      from: wing_b
      to: space_b
      send: {type: write, path: note.txt, content: from b}
      allow: true
    - name: a wing may not reach the other wing's memory
      from: wing_a
      to: notes_b
      send: {type: read, key: room}
      allow: false
      side: egress
    - name: a memory may not reach the neighbouring wing's file space
      from: notes_a
      to: space_b
      send: {type: list, path: ""}
      allow: false
      side: egress
    - name: a file space may not reach the memory beside it in its OWN wing
      from: space_a
      to: notes_a
      send: {type: read, key: room}
      allow: false
      side: egress
    # The granted egress is not enough: the loader's byte store refuses a
    # grandchild on INGRESS, whichever namespace the payload names.
    - name: a granted reach to the byte store still dies at the loader's ingress
      from: notes_a
      to: kernel_state
      send: {type: persist_blob, agent_id: notes_b, name: state.yaml, content: "room: forged\n"}
      allow: false
      side: ingress
