# Test spec for `configs/sealed_by_default.yaml` — WHAT THIS SUITE ASSERTS.
# The kernel config it runs against is a separate, deployable file; nothing
# test-specific may leak into it.
config: sealed_by_default.yaml

name: sealed_by_default
description: >
  A freshly declared io leg denies, and opening it is a conscious act. Five
  file_bridge legs and one exec_bridge leg differing ONLY in posture, plus a
  yaml_state whose persistence was never wired — so every refusal below is
  attributable to one declared fact and nothing else.

  The manifest declares NO grants at all. Every roster agent is a child of the
  loader, so the structural baseline ($parent/$children) already opens the CALL
  gate on each loader→leg edge; anything that still refuses is refusing at the
  IO gate, which is the whole subject of this scenario.

requirements: [C20, C23]

expect:
  hydration: ok
  reboot: true
  closed_roster_sender: rw
  edges:
    # Runs first on purpose: it is what creates `data/`, and it is the baseline
    # every seal below is measured against.
    - name: an open writable leg moves a byte
      from: static_loader
      to: rw
      send: {type: write, path: baseline.txt, content: "x"}
      allow: true
    - name: a sealed leg refuses the same caller the same directory
      from: static_loader
      to: sealed_fs
      send: {type: list, path: ""}
      allow: false
      # no `side:` — a `side` is the CALL gate's signature and this refusal is
      # the io gate's; the validator pins that difference.
    - name: an explicit deny_ingress refuses exactly like an absent rule
      from: static_loader
      to: denied_fs
      send: {type: list, path: ""}
      allow: false
    - name: the process edge of the io family seals by the same default
      from: static_loader
      to: sealed_proc
      send: {type: status}
      allow: false
    - name: discovery survives the seal — reflect is how you learn to open it
      from: static_loader
      to: sealed_fs
      send: {type: reflect}
      allow: true
    # For contrast, ONE call-gate denial: an undeclared lateral edge between two
    # roster peers never leaves the sender, and says so with a `side`.
    - name: an undeclared lateral edge is refused by the CALL gate, with a side
      from: rw
      to: vault
      send: {type: list, path: ""}
      allow: false
      side: egress
