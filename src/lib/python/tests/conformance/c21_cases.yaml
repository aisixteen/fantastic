# C21 — ONE SEMANTICS, MANY TRANSPORTS. The canonical assertion (a2a-tck
# ALL_TRANSPORTS, openai-agents runtime-symmetry) our substrate claims to beat:
# the SAME envelope, sent through ANY transport, yields the SAME reply.
#
# Cases are DATA (the sample-stores idea): the driver replays them through every
# transport and byte-diffs the normalized replies pairwise. Add a case here and
# every transport is on the hook for it — no per-transport test to forget.
#
# Fixture contract (built by the driver): `c21_probe` — an echo agent answering
# `poke`; every transport leg granted on it; `c21_nobody` never exists.
- name: reflect-agent
  target: c21_probe
  payload: {type: reflect}
  expect_keys: [id, sentence, verbs]
  expect: {id: c21_probe}
- name: custom-verb
  target: c21_probe
  payload: {type: poke, value: 41}
  expect: {poked: 41}
- name: unknown-agent
  target: c21_nobody
  payload: {type: reflect}
  expect: {reason: unknown_agent}
- name: unknown-verb
  target: c21_probe
  payload: {type: no_such_verb}
  expect: {reason: unhandled}
- name: kernel-verb-refusal
  target: kernel
  payload: {type: create_agent, handler_module: c21_echo.tools}
  expect: {reason: missing_arg, arg: parent_id}
- name: update-nothing
  target: kernel
  payload: {type: update_agent}
  expect: {reason: missing_arg}
- name: list-agents-limited
  target: kernel
  payload: {type: list_agents, limit: 2}
  expect_keys: [agents, next]
- name: reflect-kernel
  target: kernel
  payload: {type: reflect}
  expect: {id: kernel_state}
# `pairwise: false` — the reply is checked for SHAPE on every transport but not
# byte-diffed: `ledger` is origin-scoped by design (each leg sees the executions
# IT originated) and history accumulates between legs. The first ledger-all run
# proved it: the ws leg's view diverged from the operator's, correctly.
- name: ledger-answers-everywhere
  target: kernel
  payload: {type: ledger}
  expect_keys: [executions, next]
  pairwise: false
- name: no-verb-at-all
  target: c21_probe
  payload: {}
  expect: {reason: unhandled}
