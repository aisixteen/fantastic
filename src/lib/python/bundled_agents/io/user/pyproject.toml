[project]
name = "fantastic-user"
version = "0.1.0"
description = "User agent: the one human, as an agent; exports a subtree as a blueprint folder (outside references become ports)."
requires-python = ">=3.11"
dependencies = ["fantastic-kernel-state", "pyyaml"]

[project.entry-points."fantastic.bundles"]
user = "user.tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user"]
