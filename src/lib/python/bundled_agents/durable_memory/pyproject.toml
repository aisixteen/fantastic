[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantastic-durable-memory"
version = "0.1.0"
description = "Fantastic durable_memory agent — modeless durable key/value store; persists through a bound file_bridge over the stream channel."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
# No file_bridge IMPORT — every byte routes through the file_bridge AGENT named
# by `file_bridge_id` at runtime, over read_stream/write_stream.
dependencies = ["pyyaml>=6"]

[project.entry-points."fantastic.bundles"]
durable_memory = "durable_memory.tools"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_memory"]
