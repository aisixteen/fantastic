[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantastic-anthropic-backend"
version = "0.1.0"
description = "Fantastic anthropic backend — an LLM agent over Anthropic's Messages API, RAW tool-calling owned by ai_core."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["httpx", "fantastic-ai-core"]

[project.entry-points."fantastic.bundles"]
anthropic_backend = "anthropic_backend.tools"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_backend"]
