[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantastic-agentic-resources"
version = "0.1.0"
description = "Fantastic agentic_resources — a generic roles registry: role cards, spawn, fleet, per-role and total limits (off by default)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["fantastic-kernel-state", "pyyaml>=6"]

[project.entry-points."fantastic.bundles"]
agentic_resources = "agentic_resources.tools"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_resources"]
