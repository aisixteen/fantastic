[project]
name = "fantastic-credential-store"
version = "0.1.0"
description = "Credential store agent: secrets addressed by a ref, each bound to a host, read only with a secret mark, behind per-ref read/write grants; file (0600), OS keychain or env backend."
requires-python = ">=3.11"
# `keyring` is the OS keychain (macOS Keychain, Secret Service, Windows Credential
# Locker); only the `keychain` backend imports it.
dependencies = ["fantastic-kernel-state", "fantastic-file-bridge", "keyring"]

[project.entry-points."fantastic.bundles"]
credential_store = "credential_store.tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credential_store"]
