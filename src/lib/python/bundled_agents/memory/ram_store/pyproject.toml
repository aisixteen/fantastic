[project]
name = "fantastic-ram-store"
version = "0.1.0"
description = "In-RAM memory store agent: per-owner rows, fold refs, grants, search — the sqlite topology held in dicts, ephemeral by design."
requires-python = ">=3.11"
dependencies = []

# Owns no disk. Everything it holds dies with the process — that is what "ram" says.
# A durable store answers the SAME verbs over the SAME tables (`sqlite_store`, next to
# this bundle), so a caller never learns which one it is talking to.

[project.entry-points."fantastic.bundles"]
ram_store = "ram_store.tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ram_store"]
