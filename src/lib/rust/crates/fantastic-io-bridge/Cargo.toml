[package]
publish = false
name = "fantastic-io-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IO base — shared library (NOT a bundle): the wire legs' ingress/egress rule registries (a door for EXTERNAL clients) + the binary-safe frame codec + permessage-deflate for the WS legs. Mirrors python/bundled_agents/io/io_bridge."

[dependencies]
# python-format helpers (the frame codec).
fantastic-bundle = { path = "../fantastic-bundle" }
# The inbound verbs of a wire leg (`inbound`) send onward through the kernel.
fantastic-kernel = { path = "../fantastic-kernel" }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
# permessage-deflate on the WS legs (`ws_deflate`): the frame stream, zlib with
# a negotiated window, the client handshake head.
tokio = { workspace = true }
flate2 = { workspace = true }
httparse = { workspace = true }
