[package]
publish = false
name = "fantastic-mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mcp_client: one remote MCP server (Streamable HTTP, protocol 2026-07-28) as an agent — its tools are the agent's verbs."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
fantastic-credential-store = { path = "../fantastic-credential-store" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "0.6"
