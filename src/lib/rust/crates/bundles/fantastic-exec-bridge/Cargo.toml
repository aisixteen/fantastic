[package]
publish = false
name = "fantastic-exec-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Process edge of the io family — sealed by default, interpreter ALLOWLIST, optional per-language shim over a published control wire. Spawns authored programs in the background."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
fantastic-io-bridge = { path = "../../fantastic-io-bridge" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
nix = { version = "0.29", features = ["signal"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
# TEST-ONLY. The resolver does NOT probe PATH — that would invent an
# interpreter nobody named. The tests use `which` to find a real python to
# WIRE onto the agent record (or to skip), which is the operator's job.
which = "6"
tokio = { workspace = true, features = ["test-util", "macros"] }
