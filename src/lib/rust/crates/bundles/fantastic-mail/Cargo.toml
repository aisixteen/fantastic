[package]
publish = false
name = "fantastic-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mail agent: IMAP read (list, fetch, mark) and SMTP send behind a person's approval, over mailbox and recipient allowlists."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
# IMAP client (tokio runtime) and the TLS under it.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Message parsing (headers, text body, attachments).
mail-parser = "0.11"
# Attachment bytes, returned base64.
base64 = "0.22"
# SMTP client.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "ring", "hostname"] }

[dev-dependencies]
fantastic-credential-store = { path = "../fantastic-credential-store", features = ["test-support"] }
fantastic-kernel = { path = "../../fantastic-kernel", features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
