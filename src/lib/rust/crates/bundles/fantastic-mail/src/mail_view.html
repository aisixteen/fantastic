<style>
*{box-sizing:border-box}
html,body{margin:0}
body{padding:20px max(24px, calc((100% - 780px) / 2));background:transparent;color:var(--fc-color-text-primary);font:14px/1.5 var(--fc-font-family-sans)}
h1{font-size:18px;margin:0}
h2{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fc-color-text-subtle);margin:22px 0 8px}
.sub{color:var(--fc-color-text-muted)}
.card{background:var(--fc-color-surface-raised);border:1px solid var(--fc-color-line-faint);border-radius:var(--fc-radius-card);padding:10px 12px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.badge{font-size:12px;border-radius:var(--fc-radius-pill);padding:1px 9px;background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.badge.new{background:var(--fc-color-accent-base);color:var(--fc-color-accent-on)}
.warn{border-color:var(--fc-color-status-warn-line);background:var(--fc-color-status-warn-surface)}
.err{color:var(--fc-color-status-error)}
.mono{font-family:var(--fc-font-family-mono);font-size:12px;color:var(--fc-color-text-code)}
pre{white-space:pre-wrap;margin:6px 0 0;font:inherit}
</style>
<h1 id="name"></h1>
<div class="sub" id="login"></div>
<h2>Mailboxes</h2>
<div id="boxes"></div>
<h2>Waiting for approval</h2>
<div id="pending"></div>
<h2>Recent sends (since start)</h2>
<div id="sends"></div>
<script>
(function () {
  var AGENT = "{{agent}}";
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  var call = function (p) { return fantastic.send(AGENT, p); };
  var when = function (ts) { return typeof ts === "number" ? new Date(ts * 1000).toLocaleString() : ""; };
  var empty = function (box, t) { box.appendChild(el("div", "sub", t)); };
  var badges = {}; // mailbox -> its unseen badge
  function box(parent, name) {
    var card = el("div", "card"), row = el("div", "row");
    row.appendChild(el("span", "", name));
    var b = el("span", "badge", "…");
    badges[name] = b;
    row.appendChild(b); card.appendChild(row); parent.appendChild(card);
    count(name);
  }
  function count(name) {
    var b = badges[name];
    if (!b) return;
    call({ type: "list", mailbox: name, unseen: true, limit: 100 }).then(function (r) {
      b.className = "badge";
      var n = r && Array.isArray(r.messages) ? r.messages.length : null;
      if (n === null) { b.textContent = "unavailable"; b.className = "badge err"; return; }
      b.textContent = n === 100 ? "100+ unseen" : n + " unseen";
      if (n > 0) b.className = "badge new";
    }).catch(function () { b.textContent = "unavailable"; });
  }
  function render(r) {
    $("name").textContent = r.account || r.id || AGENT;
    $("login").textContent = "sign-in: " + (r.login || "none");
    var boxes = $("boxes"); boxes.textContent = ""; badges = {};
    var names = Array.isArray(r.mailboxes) ? r.mailboxes : [];
    if (!names.length) empty(boxes, "no mailbox is allowed");
    names.forEach(function (n) { box(boxes, n); });
    drawSends(r);
  }
  function drawSends(r) {
    var sends = $("sends"); sends.textContent = "";
    var list = Array.isArray(r.recent_sends) ? r.recent_sends.slice().reverse() : [];
    if (!list.length) empty(sends, "nothing sent since start");
    list.forEach(function (s) {
      var c = el("div", "card"), row = el("div", "row");
      row.appendChild(el("span", "", s.subject || "(no subject)"));
      row.appendChild(el("span", "sub", when(s.ts)));
      c.appendChild(row);
      c.appendChild(el("div", "sub", "to " + (s.to || []).join(", ") + " · approved by " + (s.approved_by || "?")));
      sends.appendChild(c);
    });
  }
  function pending() {
    call({ type: "inquiries" }).then(function (r) {
      var box = $("pending"); box.textContent = "";
      var q = r && Array.isArray(r.inquiries) ? r.inquiries : [];
      if (!q.length) empty(box, "nothing waiting");
      q.forEach(function (i) {
        var c = el("div", "card warn");
        c.appendChild(el("div", "mono", "re " + i.re));
        c.appendChild(el("pre", "", i.text || ""));
        box.appendChild(c);
      });
    }).catch(function () {});
  }
  function load() {
    call({ type: "reflect" }).then(function (r) { render(r || {}); pending(); }).catch(function () { $("name").textContent = AGENT; });
  }
  // what an event the agent published asks the view to read again — a closed list:
  // "sends" (a mail was sent), "box" (a message was marked: that box's count), "pending"
  // (a send's question to the person opened or closed), or "" — a COPY OF A CALL made to the
  // agent (this view's own reflect, list, inquiries; anyone's mark or send) is never one
  function rereadOf(ev) {
    if (!ev || typeof ev !== "object" || typeof ev.error === "string") return "";
    if (ev.type === "sent" && typeof ev.message_id === "string") return "sends";
    if (ev.type === "marked" && typeof ev.mailbox === "string") return "box";
    if ((ev.type === "inquiry_opened" || ev.type === "inquiry_closed") && ev.holder === AGENT) return "pending";
    return "";
  }
  load();
  fantastic.watch(AGENT, function (ev) {
    var what = rereadOf(ev);
    if (what === "sends") call({ type: "reflect" }).then(function (r) { drawSends(r || {}); }).catch(function () {});
    else if (what === "box") count(ev.mailbox);
    else if (what === "pending") pending();
  });
})();
</script>
