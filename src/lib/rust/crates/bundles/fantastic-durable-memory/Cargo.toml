[package]
publish = false
name = "fantastic-durable-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modeless durable key-value memory agent — set/read/append/keys/delete, persisted through a gated file_bridge over the raw stream channel."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
serde_json = { workspace = true }
async-trait = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# The persistence tests wire a REAL file_bridge as the store and exercise the raw
# read_stream/write_stream binary channel end to end (no fake blob store).
fantastic-file = { path = "../fantastic-file" }
