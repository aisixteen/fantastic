<style>
:root{
--fc-color-accent-base:rgb(17 17 17);
--fc-color-accent-deep:rgb(17 17 17);
--fc-color-accent-deep-hover:rgb(43 43 43);
--fc-color-accent-on:rgb(255 255 255);
--fc-color-line-button:rgb(0 0 0 / 0.1);
--fc-color-line-faint:rgb(0 0 0 / 0.06);
--fc-color-line-strong:rgb(0 0 0 / 0.18);
--fc-color-status-error:rgb(179 38 30);
--fc-color-status-error-line:rgb(179 38 30 / 0.45);
--fc-color-status-error-surface:rgb(179 38 30 / 0.12);
--fc-color-status-ok:rgb(27 116 70);
--fc-color-status-warn:rgb(143 82 0);
--fc-color-status-warn-field:rgb(255 255 255 / 0.6);
--fc-color-status-warn-line:rgb(143 82 0 / 0.45);
--fc-color-status-warn-muted:rgb(143 82 0);
--fc-color-status-warn-on:rgb(255 255 255);
--fc-color-status-warn-surface:rgb(143 82 0 / 0.12);
--fc-color-surface-bubble:rgb(255 255 255 / 0.6);
--fc-color-surface-bubble-user:rgb(0 0 0 / 0.1);
--fc-color-surface-button:rgb(0 0 0 / 0.05);
--fc-color-surface-code:rgb(0 0 0 / 0.045);
--fc-color-surface-field:rgb(0 0 0 / 0.06);
--fc-color-surface-raised:rgb(255 255 255 / 0.72);
--fc-color-surface-well:rgb(0 0 0 / 0.06);
--fc-color-text-code:rgb(69 69 69);
--fc-color-text-cool:rgb(69 69 69);
--fc-color-text-muted:rgb(69 69 69);
--fc-color-text-primary:rgb(11 11 11);
--fc-color-text-subtle:rgb(107 107 107);
--fc-duration-pulse:1400ms;
--fc-duration-think:1100ms;
--fc-easing-in-out:cubic-bezier(0.42, 0, 0.58, 1);
--fc-font-family-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
--fc-font-family-sans:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
--fc-radius-bubble:12px;
--fc-radius-card:8px;
--fc-radius-chip:4px;
--fc-radius-control:6px;
--fc-radius-key:5px;
--fc-radius-panel:10px;
--fc-radius-pill:999px;
--fc-shadow-bubble:inset 0px 0px 0px 1px rgb(0 0 0 / 0.07);
--fc-shadow-focus:inset 0px 0px 0px 1px rgb(17 17 17 / 0.45), 0px 0px 0px 3px rgb(17 17 17 / 0.1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{--pad:max(24px, calc((100% - 780px) / 2));display:flex;flex-direction:column;min-height:0;overflow:hidden;background:transparent;color:var(--fc-color-text-primary);font:14px/1.5 var(--fc-font-family-sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--fc-color-accent-base);outline-offset:2px}
.head{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px var(--pad);border-bottom:1px solid var(--fc-color-line-button)}
.avatar{position:relative;flex:none;width:44px;height:44px;border-radius:var(--fc-radius-panel);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted);display:flex;align-items:center;justify-content:center}
.avatar svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:var(--fc-radius-pill);box-shadow:0 0 0 2px var(--fc-color-surface-raised);background:var(--fc-color-text-subtle);color:var(--fc-color-accent-on);font:700 11px/18px var(--fc-font-family-sans);text-align:center}
.badge[hidden]{display:none}
.badge[data-state=asks]{background:var(--fc-color-status-warn)}
.badge[data-state=failed]{background:var(--fc-color-status-error)}
.badge[data-state=done]{background:var(--fc-color-status-ok)}
.badge[data-state=working]{background:transparent;border:2px solid var(--fc-color-line-strong);border-top-color:var(--fc-color-accent-base);animation:spin 900ms linear infinite}
.titles{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:3px}
.titles .line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.head .name{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.head .tag{font:11px/18px var(--fc-font-family-mono);padding:0 7px;border-radius:var(--fc-radius-control);color:var(--fc-color-text-muted);background:var(--fc-color-surface-well)}
.state{font-size:11px;font-weight:600;line-height:18px;padding:0 8px;border-radius:var(--fc-radius-pill);color:var(--fc-color-text-muted);background:var(--fc-color-surface-well);box-shadow:inset 0 0 0 1px var(--fc-color-line-button)}
.state[hidden]{display:none}
.state[data-state=asks]{color:var(--fc-color-status-warn);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.state[data-state=failed]{color:var(--fc-color-status-error);background:var(--fc-color-status-error-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-error-line)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--fc-color-line-button);border-radius:var(--fc-radius-card);min-width:0}
.chip[hidden]{display:none}
.chip .m{font:13px/1 var(--fc-font-family-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .p{font-size:12px;color:var(--fc-color-text-subtle);white-space:nowrap}
.head .stop{height:36px;padding:0 14px;border:1px solid var(--fc-color-status-error-line);border-radius:var(--fc-radius-card);background:var(--fc-color-status-error-surface);color:var(--fc-color-status-error);font-weight:600}
.head .stop[hidden]{display:none}
.dialog{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding:16px var(--pad) 18px;line-height:1.55}
.earlier{align-self:center;height:28px;padding:0 12px;border:0;border-radius:var(--fc-radius-pill);background:var(--fc-color-surface-button);color:var(--fc-color-text-subtle);font-size:12px}
.earlier[hidden]{display:none}
.earlier:disabled{opacity:.5;cursor:default}
.who{display:flex;flex-direction:column;gap:3px;max-width:85%}
.who.user{align-self:flex-end;align-items:flex-end}
.who.assistant{align-self:flex-start;align-items:flex-start}
.meta{font:11px/1.4 var(--fc-font-family-mono);color:var(--fc-color-text-subtle)}
.msg{padding:8px 12px;border-radius:var(--fc-radius-bubble);white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--fc-shadow-bubble);background:var(--fc-color-surface-bubble)}
.msg code{font:12px var(--fc-font-family-mono);padding:1px 5px;border-radius:var(--fc-radius-chip);background:var(--fc-color-surface-well)}
.who.user .msg{background:var(--fc-color-surface-bubble-user)}
.msg.not-sent{opacity:.5;text-decoration:line-through}
.who.queued{max-width:100%;opacity:.6;font-style:italic}
.queue{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 var(--pad)}
.queue:empty{display:none}
.notice{align-self:center;max-width:92%;padding:3px 10px;border-radius:var(--fc-radius-pill);font-size:12px;color:var(--fc-color-text-muted);background:var(--fc-color-surface-well);text-align:center;white-space:pre-wrap}
.notice.warn{color:var(--fc-color-status-warn);background:var(--fc-color-status-warn-surface)}
.notice.error{color:var(--fc-color-status-error);box-shadow:inset 0 0 0 1px var(--fc-color-status-error)}
.notice.report{align-self:stretch;text-align:left;border-radius:var(--fc-radius-card);font:11.5px/1.45 var(--fc-font-family-mono)}
details.tools,details.think{align-self:flex-start;width:85%;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-code);box-shadow:inset 0 0 0 1px var(--fc-color-line-button);font-size:12px}
details.tools>summary,details.think>summary{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 12px;cursor:pointer;list-style:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
details.tools>summary::-webkit-details-marker,details.think>summary::-webkit-details-marker{display:none}
details.tools>summary::before,details.think>summary::before{content:"";flex:none;width:6px;height:6px;margin:0 3px 0 1px;border-right:1.5px solid var(--fc-color-text-subtle);border-bottom:1.5px solid var(--fc-color-text-subtle);transform:rotate(45deg);transition:transform 120ms var(--fc-easing-in-out)}
details.tools:not([open])>summary::before,details.think:not([open])>summary::before{transform:rotate(-45deg)}
details.tools .n{font-weight:500;flex:none}
details.tools .verbs{flex:1;min-width:0;font-family:var(--fc-font-family-mono);color:var(--fc-color-text-subtle);overflow:hidden;text-overflow:ellipsis}
details.think>summary{font-style:italic;color:var(--fc-color-text-muted)}
details.think.live>summary{animation:pulse var(--fc-duration-think) var(--fc-easing-in-out) infinite}
.think .body{padding:0 12px 10px;white-space:pre-wrap;color:var(--fc-color-text-muted);max-height:320px;overflow:auto}
.call{padding:6px 12px;border-top:1px solid var(--fc-color-line-faint)}
.call .ct{font:12px var(--fc-font-family-mono);color:var(--fc-color-text-cool)}
.call .ct.run::after{content:" …";animation:pulse var(--fc-duration-pulse) var(--fc-easing-in-out) infinite}
.call pre{margin:4px 0 0;padding:6px 8px;border-radius:var(--fc-radius-chip);background:var(--fc-color-surface-well);font:11.5px/1.45 var(--fc-font-family-mono);color:var(--fc-color-text-code);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
.card{align-self:stretch;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-raised);box-shadow:inset 0 0 0 1px var(--fc-color-line-faint)}
.card .k{font:600 10.5px var(--fc-font-family-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fc-color-text-subtle)}
.card .id{font:12px var(--fc-font-family-mono)}
.inq{align-self:stretch;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--fc-radius-bubble);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.inq .k{font:600 11px var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-status-warn)}
.inq .q{font-size:15px;line-height:1.4;font-weight:600;white-space:pre-wrap}
.inq .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inq button{min-height:40px;padding:0 14px;border:1px solid var(--fc-color-line-strong);border-radius:var(--fc-radius-card);background:var(--fc-color-surface-raised);font-size:13px;font-weight:500}
.inq button.primary{background:var(--fc-color-status-warn);border-color:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on);font-weight:600}
.inq .free{flex:1 1 100%;display:flex;align-items:center;gap:6px;min-width:0;padding:4px 4px 4px 12px;border:1px solid var(--fc-color-line-strong);border-radius:var(--fc-radius-card);background:var(--fc-color-surface-raised)}
.inq .free:focus-within{box-shadow:var(--fc-shadow-focus)}
.inq .free input[type=text]{flex:1;min-width:0;height:32px;padding:0;border:0;outline:none;background:transparent;font:inherit;color:inherit}
.inq .free button{min-height:32px;padding:0 12px;border:0;border-radius:var(--fc-radius-control);background:var(--fc-color-accent-deep);color:var(--fc-color-accent-on);font-weight:600}
.inq .st{font-size:12px;color:var(--fc-color-status-warn-muted)}
.inq.answered{opacity:.75}
.foot{flex:none;display:flex;align-items:center;gap:10px;min-height:28px;padding:4px var(--pad);font:11px var(--fc-font-family-mono);color:var(--fc-color-text-subtle)}
.pill{padding:1px 9px;border-radius:var(--fc-radius-pill);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.pill[data-phase=queued]{color:var(--fc-color-status-warn);background:var(--fc-color-status-warn-surface)}
.pill[data-phase=thinking],.pill[data-phase=tool_calling],.pill[data-phase=streaming]{color:var(--fc-color-status-ok);animation:pulse var(--fc-duration-pulse) var(--fc-easing-in-out) infinite}
.foot .usage{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .clear{border:0;background:transparent;color:var(--fc-color-text-subtle);padding:2px 8px;border-radius:var(--fc-radius-control)}
.foot .clear:hover{background:var(--fc-color-surface-button)}
.input{flex:none;padding:0 var(--pad) 16px}
.field{display:flex;align-items:flex-end;gap:8px;padding:4px;border-radius:var(--fc-radius-panel);background:var(--fc-color-surface-field);box-shadow:inset 0 0 0 1px var(--fc-color-line-button)}
.field:focus-within{box-shadow:var(--fc-shadow-focus)}
.field textarea{flex:1;min-width:0;min-height:36px;max-height:140px;resize:none;padding:8px 8px;border:0;outline:none;background:transparent;font:inherit;color:inherit}
.field .send{flex:none;height:36px;padding:0 16px;border:0;border-radius:var(--fc-radius-card);background:var(--fc-color-accent-deep);color:var(--fc-color-accent-on);font-weight:600}
.field .send:hover{background:var(--fc-color-accent-deep-hover)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:520px){
body{--pad:16px;font-size:15px}
.head .name{font-size:16px}
.chip{height:44px}
.head .stop,.field .send{height:44px}
.field textarea{min-height:44px;font-size:16px}
details.tools>summary,details.think>summary{min-height:40px}
.inq .q{font-size:16px}
.inq .row{flex-direction:column;align-items:stretch}
.inq button{min-height:44px;text-align:left}
.inq .free{padding:4px 4px 4px 12px}
.inq .free input[type=text]{height:44px;font-size:16px}
.inq .free button{min-height:44px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
// pure
var FROM = /^\[from ([^\]\s·]+)[^\]]*\]\s*/;
var SPOT = /\n?\[at (-?\d+),(-?\d+)\]$/;
var SETUP_BLOCK = /\n\[canvas setup\][\s\S]*$/;
var CALLS = /<call\b[^>]*>[\s\S]*?<\/call>/g;
var OPEN_CALL = /<call\b[\s\S]*$/;
var THINK = /<think>[\s\S]*?(?:<\/think>|$)/g;
var CALL_HEAD = /<call name="([^"]+)">(?:[\s\S]*?<target_id>([^<]*)<\/target_id>)?(?:[\s\S]*?<type>([^<]*)<\/type>)?/;
var REPLY_HEAD = /^\[reply to \d+ · ([^\]·]+?)(?: · [^\]]*)?\]/;
var MONITOR_HEAD = /^\[monitor (\d+) · job (\d+) · from (.+?) call (\S+?)(?: · "([^"]*)")?( · job ended)?\]\s*/;
var MALFORMED = "[malformed call — nothing ran]";

function words(t) { return t.replace(THINK, "").replace(CALLS, "").replace(OPEN_CALL, "").trim(); }
// "[from planner · msg 4] hello" -> the sender is the meta line, the rest the text
function parseFrom(text) {
  var m = FROM.exec(text);
  return m ? { sender: m[1], text: text.slice(m[0].length) } : { sender: "", text: text };
}
// a stored person turn, as shown: setup block, spot and sender header taken off
function personText(text) {
  var spot = SPOT.exec(text);
  var t = (spot ? text.slice(0, spot.index) : text).replace(SETUP_BLOCK, "");
  return parseFrom(t);
}
function monitorOf(text) {
  var f = parseFrom(text);
  if (f.sender === "") return null;
  var m = MONITOR_HEAD.exec(f.text);
  if (!m) return null;
  return { tag: "monitor " + m[1] + " · job " + m[2] + (m[5] ? ' "' + m[5] + '"' : "") + (m[6] ? " · ended" : ""), lines: f.text.slice(m[0].length).replace(/\s+$/, "") };
}
// the calls a text makes: one entry each (a cut-off call head still counts one)
function callsOf(text) {
  var calls = [];
  (text.match(CALLS) || []).forEach(function (blk) {
    var b = CALL_HEAD.exec(blk);
    if (b) calls.push({ target: b[2] || b[1], verb: b[3] || "", args: blk });
  });
  var c = calls.length === 0 ? CALL_HEAD.exec(text) : null;
  if (c) calls.push({ target: c[2] || c[1], verb: c[3] || "", args: text });
  return calls;
}
// a row that is a tool call (assistant, calls only) or its replies (the next user turn: one or several `[reply to …]`)
function toolOf(role, text) {
  if (role === "assistant" && words(text) === "") {
    var calls = callsOf(text);
    if (calls.length > 0) return { calls: calls };
  }
  if (role === "user" && REPLY_HEAD.test(text)) {
    var replies = [];
    text.split(/(?=\[reply to \d+ · )/).forEach(function (part) {
      var r = REPLY_HEAD.exec(part);
      if (r) replies.push({ label: r[1], text: part.replace(/\s+$/, "") });
    });
    return { replies: replies };
  }
  return null;
}
function newGroup() { return { kind: "tools", calls: [] }; }
function addTool(g, t) {
  if (t.calls) { t.calls.forEach(function (c) { g.calls.push({ id: "", target: c.target, verb: c.verb, args: c.args, reply: null }); }); return; }
  t.replies.forEach(function (rp) {
    var open = null;
    for (var i = 0; i < g.calls.length; i++) if (g.calls[i].reply === null) { open = g.calls[i]; break; }
    if (open) open.reply = rp.text;
    else g.calls.push({ id: "", target: "", verb: rp.label, args: "", reply: rp.text });
  });
}
function groupTitle(g) {
  var verbs = [];
  g.calls.forEach(function (c) { var v = c.verb || c.target; if (v && verbs.indexOf(v) < 0) verbs.push(v); });
  var n = g.calls.length;
  return { n: n + " tool call" + (n === 1 ? "" : "s"), verbs: verbs.join(", ") };
}
// the agents on show: an embed row puts a name card in its place, a later unembed takes it out
function cardRows(rows) {
  var out = {};
  rows.forEach(function (m) {
    if ((m.kind !== "embed" && m.kind !== "unembed") || typeof m.head !== "string") return;
    if (m.kind === "embed" && typeof m.id === "number") out[m.head] = m.id; else delete out[m.head];
  });
  return out;
}
// a run of consecutive reports with one head is the first with repeat: n
function collapseReports(rows) {
  var out = [];
  rows.forEach(function (m) {
    var last = out[out.length - 1];
    var rep = typeof m.head === "string" && m.head.indexOf(MALFORMED) >= 0;
    if (rep && last && typeof last.head === "string" && last.head === m.head) { last.repeat = (last.repeat || 1) + 1; return; }
    out.push(Object.assign({}, m));
  });
  return out;
}
// a turn that ended with one of these reasons is not a failure
var CALM = { "": 1, ok: 1, awaiting: 1, nothing_to_await: 1 };
// the agent's state, as the header shows it: working while a turn runs, asks you while an
// inquiry is open, failed when the last turn ended with a failure reason, done after a good one
function stateOf(phase, reason, asks) {
  if (asks > 0) return "asks";
  if (phase === "thinking" || phase === "streaming" || phase === "tool_calling" || phase === "queued") return "working";
  if (!CALM[reason || ""]) return "failed";
  return reason === "ok" ? "done" : "idle";
}
// "asks you · 12 min": the age of the oldest open inquiry (`ts` is seconds since the epoch)
function inquiryAge(ts, nowMs) {
  if (typeof ts !== "number" || !(ts > 0)) return "";
  var min = Math.floor((nowMs / 1000 - ts) / 60);
  if (min < 1) return "just now";
  return min < 60 ? min + " min" : Math.floor(min / 60) + " h";
}
// the meta line over a message from another agent
function metaOf(sender, name) { return sender ? sender + " to " + name : ""; }
// `code` spans of a text, in order: [{text, code}]
function codeSpans(text) {
  var out = [], re = /`([^`\n]+)`/g, at = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > at) out.push({ text: text.slice(at, m.index), code: false });
    out.push({ text: m[1], code: true });
    at = m.index + m[0].length;
  }
  if (at < text.length) out.push({ text: text.slice(at), code: false });
  return out;
}
// tokens a row's provider call used, from the usage the row keeps in its attributes
function tokensOf(rows) {
  var n = 0;
  rows.forEach(function (m) {
    var a = m && m.attributes, u = a && a.usage;
    if (u && typeof u === "object") ["input", "output", "cache_read", "cache_write"].forEach(function (k) { if (typeof u[k] === "number") n += u[k]; });
  });
  return n;
}

    drawHistory(keepRows + 300).then(function () { inquiries(); drawUsage(); }).catch(function (e) { notice("✕ " + (e && e.message ? e.message : e), "error"); });
  };

  // BOOT: head, history, live snapshot, then the watch
  async function boot() {
    fantastic.watch(AGENT, onEvent);
    var rf = await call({ type: "reflect" });
    title = s(rf, "display_name") || s(rf, "id") || AGENT;
    $("name").textContent = title;
    text.placeholder = "Message " + title;
    $("tag").textContent = s(rf, "handler_module") || "ai_chat";
    var prov = s(rf, "provider_id"), model = s(rf, "model");
    modelName = model;
    $("modelname").textContent = model;
    $("prov").textContent = prov;
    $("model").hidden = !prov;
    if (!prov) notice("No model set", "warn");
    await drawHistory(300);
    drawUsage();
    var snap = await call({ type: "status", client_id: me });
    if (snap && typeof snap === "object") {
      $("others").textContent = typeof snap.others_pending === "number" && snap.others_pending > 0 ? "+" + snap.others_pending + " from other clients" : "";
      var cur = o(snap, "current");
      if (cur.is_mine === true) {
        push(bubble("user", s(cur, "text"), ""));
        if (s(cur, "text_so_far")) push(bubble("assistant", s(cur, "text_so_far"), ""));
        inflight = { sendId: s(cur, "send_id") };
        var lt = o(cur, "last_tool");
        if (Object.keys(lt).length > 0) tool(lt);
        phase(s(cur, "phase") || "thinking", "Esc to stop");
      }
      (Array.isArray(snap.mine_pending) ? snap.mine_pending : []).forEach(function (e) {
        var b = bubble("user", s(e, "text"), ""); b.classList.add("queued"); queue.appendChild(b);
        pending.push({ el: b, sendId: s(e, "send_id") });
      });
      refresh();
    }
    inquiries();
  }
  boot().catch(function (e) { notice("✕ " + (e && e.message ? e.message : e), "error"); });
})();
</script>
