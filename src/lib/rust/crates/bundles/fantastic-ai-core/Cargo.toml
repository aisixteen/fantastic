[package]
publish = false
name = "fantastic-ai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared reflect-driven LLM-agent machinery (state, verbs, agentic loop, prompt assembly, events, history) behind a Provider seam. Backends supply only their Provider + a thin Bundle."

[dependencies]
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
fantastic-file = { path = "../fantastic-file" }
fantastic-exec-bridge = { path = "../fantastic-exec-bridge" }
# Chat history lives in a `<self>_chat` durable_memory child, so the harness has
# to register the REAL bundle — a stub store would test the stub, not the wiring.
fantastic-durable-memory = { path = "../fantastic-durable-memory" }
# The author tests allowlist a REAL interpreter — the test acting as operator.
which = "6"
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
