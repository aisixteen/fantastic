[package]
publish = false
name = "fantastic-task-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A generic task registry: which agent or subtree holds which task, and where each task comes from (off by default)."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
fantastic-core = { path = "../fantastic-core" }
fantastic-ram-store = { path = "../fantastic-ram-store" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
