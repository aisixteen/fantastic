[package]
publish = false
name = "fantastic-web-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST verb channel — POST /<self_id>/<target_id> body=payload → kernel.send → JSON."

[dependencies]
# python-format helpers: `{x!r}` in the unhandled refusal.
fantastic-bundle = { path = "../../fantastic-bundle" }
