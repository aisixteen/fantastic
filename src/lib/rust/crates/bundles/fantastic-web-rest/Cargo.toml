[package]
publish = false
name = "fantastic-web-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST verb channel — POST /<self_id>/<target_id> body=payload → kernel.send → JSON."

[dependencies]
fantastic-kernel = { path = "../../fantastic-kernel" }
# the shared leg posture (`describe`) this surface reflects.
fantastic-io-bridge = { path = "../../fantastic-io-bridge" }
# `inbound_call` is declared and answered once, in web_ws.
fantastic-web-ws = { path = "../fantastic-web-ws" }
async-trait = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
