# the shared leg posture (`describe`) this surface reflects.
fantastic-io-bridge = { path = "../../fantastic-io-bridge" }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
