# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/exec_shell.yaml`. A POSIX system: the runner skips it on Windows.

loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        - id: shell_term
          handler_module: exec_bridge.tools
          cwd: "."
          env: {SHELL: /bin/sh}
          shell: true
        - id: login_term
          handler_module: exec_bridge.tools
          cwd: "."
          env: {SHELL: /bin/sh}
          shell: login
        - id: bare_env_term
          handler_module: exec_bridge.tools
          cwd: "."
          shell: true
        - id: allow_term
          handler_module: exec_bridge.tools
          cwd: "."
          env: {SHELL: /bin/sh}
          allowed: ['/bin/echo .*']
