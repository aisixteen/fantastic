# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/engine_smoke_bad_entry.yaml`.

loaders:
  - id: half_loader
    file: fantastic_half.yaml
    manifest:
      agents:
        - id: good
          handler_module: file_bridge.tools
          allow: ['.']
        # A field value the bundle does not declare: the child bundle refuses it at
        # its own write, and the loader's boot returns on the first failed create.
        - id: bogus
          handler_module: file_bridge.tools
          allow: ['.']
          readonly: maybe
        - id: never
          handler_module: file_bridge.tools
          allow: ['.']
