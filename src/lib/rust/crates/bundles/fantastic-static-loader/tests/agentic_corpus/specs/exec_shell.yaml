# Test spec for `configs/exec_shell.yaml` — WHAT THIS SUITE ASSERTS.
config: exec_shell.yaml

name: exec_shell
description: >
  A PTY `start` with no `command` runs the CHILD's own `$SHELL` — read from the
  environment the record passes down, never guessed, never from a fallback
  chain. The allowlist still decides: the record's `shell` field permits that
  exact line (`true` → `$SHELL`, `"login"` → `$SHELL -l`) and nothing wider.
  A client with no environment of its own (a browser page) can therefore start
  a terminal without knowing which shell the host runs.

requirements: [EXS-1, EXS-2, EXS-3, EXS-4, EXS-5]

expect:
  hydration: ok
  reboot: true
  steps:
    # ── EXS-1 · no command on a PTY → the child's $SHELL, reported resolved ──
    # Sent AS the loader, which reaches its own child by position: the caller
    # names no shell and needs to know none.
    # A `start` settles when its job EXITS (#795): it is fired, its job is seen
    # running, stopped, and the start's settle (the job's end) is collected.
    - name: a PTY start without a command runs the shell the record passes down
      start: {name: shell, from: static_loader, to: shell_term, reach: true, send: {type: start, pty: {cols: 80, rows: 24}}}
      because: EXS-1
    - name: the shell's job runs
      await_task: {name: shell_job, agent: shell_term, spawned: true, verb: start}
    - name: the job runs on a terminal and reports the RESOLVED command, so a client can show and re-issue it
      operator: {to: shell_term, send: {type: status}}
      expect: {contains: {jobs.*.command: /bin/sh, jobs.*.status: running, jobs.*.pty: true}}
      because: EXS-1
    - name: (cleanup) the shell stops
      operator: {to: shell_term, send: {type: stop}}
    - name: the loader's start went through, and settles with the job's end
      collect: {name: shell}
      expect: {allow: true, contains: {job_id: $shell_job.id}}
      because: EXS-1

    # ── EXS-2 · no SHELL in the child's env → refused, naming it ──────────
    - name: a child environment without SHELL is refused — no fallback shell
      operator: {to: bare_env_term, send: {type: start, pty: {cols: 80, rows: 24}}}
      expect: {reason: missing_arg, contains: {arg: SHELL}}
      because: EXS-2

    # ── EXS-3 · autodiscovery is PTY-only ────────────────────────────────
    - name: a pipe job still names its command
      operator: {to: shell_term, send: {type: start}}
      expect: {reason: missing_arg, contains: {arg: "command | pty"}}
      because: EXS-3

    # ── EXS-4 · `shell` permits ONE exact line ───────────────────────────
    - name: "`shell: true` does not cover the shell with extra args"
      operator: {to: shell_term, send: {type: start, args: ['-c', 'id'], pty: {cols: 80, rows: 24}}}
      expect: {reason: unauthorized}
      because: EXS-4
    - name: "`shell: login` does not cover the bare shell, named"
      operator: {to: login_term, send: {type: start, command: /bin/sh, pty: {cols: 80, rows: 24}}}
      expect: {reason: unauthorized}
      because: EXS-4
    - name: "no `command` and no `args` under `shell: login` is its whole line, `$SHELL -l`"
      start: {name: login, from: static_loader, to: login_term, send: {type: start, pty: {cols: 80, rows: 24}}}
      because: EXS-1
    - name: the login shell's job runs
      await_task: {name: login_job, agent: login_term, spawned: true, verb: start}
    - name: the login shell runs
      operator: {to: login_term, send: {type: status}}
      expect: {contains: {jobs.*.status: running}}
      because: EXS-1
    - name: (cleanup) that login shell stops
      operator: {to: login_term, send: {type: stop}}
    - name: its start settles with the job's end
      collect: {name: login}
      expect: {contains: {job_id: $login_job.id}}
      because: EXS-1
    - name: "`shell: login` covers exactly `$SHELL -l`"
      start: {name: login_l, from: static_loader, to: login_term, send: {type: start, args: ['-l'], pty: {cols: 80, rows: 24}}}
      because: EXS-4
    - name: the `-l` shell's job runs
      await_task: {name: login_l_job, agent: login_term, spawned: true, verb: start}
    - name: the `-l` shell runs
      operator: {to: login_term, send: {type: status, job_id: $login_l_job.id}}
      expect: {contains: {jobs.*.status: running}}
      because: EXS-4
    - name: (cleanup) the login shell stops
      operator: {to: login_term, send: {type: stop}}
    - name: the `-l` start settles with the job's end
      collect: {name: login_l}
      expect: {contains: {job_id: $login_l_job.id}}
      because: EXS-4
    - name: with no `shell` on the record, the resolved line must match `allowed`
      operator: {to: allow_term, send: {type: start, pty: {cols: 80, rows: 24}}}
      expect: {reason: unauthorized}
      because: EXS-4

    # ── EXS-5 · `shell` is refused at write time unless true/false/"login" ──
    - name: a shell NAME is not a shell permission
      operator: {to: kernel, send: {type: update_agent, id: shell_term, shell: bash}}
      expect: {reason: bad_arg, contains: {arg: shell}}
      because: EXS-5
