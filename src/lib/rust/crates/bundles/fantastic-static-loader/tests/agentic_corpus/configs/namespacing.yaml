# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/namespacing.yaml`. Each wing reaches its own roster by position; no
# line names anything across the wings.

loaders:
  - id: wing_a
    file: wing_a.yaml
    manifest:
      agents:
        - id: store
          handler_module: file_bridge.tools
          allow: ['.']
          root: .fantastic
        - id: notes_a
          handler_module: file_bridge.tools
          allow: ['.']
          root: notes/a
        - id: space_a
          handler_module: file_bridge.tools
          allow: ['.']
          root: rooms/a

  - id: wing_b
    file: wing_b.yaml
    manifest:
      agents:
        - id: notes_b
          handler_module: file_bridge.tools
          allow: ['.']
          root: notes/b
        - id: space_b
          handler_module: file_bridge.tools
          allow: ['.']
          root: rooms/b
