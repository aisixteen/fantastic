# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/credential_store.yaml`. `file` is `$workdir/…`: a credential_store
# refuses a relative path, and the test never touches the user's home.

loaders:
  - id: static_loader
    file: fantastic.yaml
    manifest:
      agents:
        - id: creds
          handler_module: credential_store.tools
          file: $workdir/creds.yaml
          refs:
            openai:
              host: api.openai.com

        - id: reader
          handler_module: file_bridge.tools
          can:
            creds: {call: [get, list]}
        # no line on the store at all
        - id: stranger
          handler_module: file_bridge.tools
