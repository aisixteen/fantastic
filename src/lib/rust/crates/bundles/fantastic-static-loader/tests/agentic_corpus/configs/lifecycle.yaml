# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/lifecycle.yaml`.

loaders:
  - id: static_loader
    file: fantastic.yaml
    meta:
      # THE CAP: the root is outside the loader's tree, so warden's line on it
      # holds only as far as the loader's own line does.
      can:
        $root: {call: [ps, cancel]}
    manifest:
      agents:
        - id: slowbot
          handler_module: lifecycle_probe.tools

        - id: open_fs
          handler_module: file_bridge.tools
          allow: ['.']

        - id: doomed
          handler_module: file_bridge.tools
          allow: ['.']

        - id: warden
          handler_module: file_bridge.tools
          allow: ['.']
          can:
            $root: {call: [ps, cancel]}
            slowbot: {call: [slow]}
            open_fs: {call: ["*"]}
            doomed: {call: [list]}

        - id: stranger
          handler_module: file_bridge.tools
          allow: ['.']
