# Kernel config — the SYSTEM SHAPE only. What is asserted about it lives in
# `specs/owned_subtree_delete.yaml`.

loaders:
  - id: l_a
    file: fantastic_a.yaml
    manifest:
      agents:
        - id: a_notes
          handler_module: file_bridge.tools
          allow: ['.']
          root: a_notes
          ingress_rule: allow_all_ingress
        - id: a_leaf
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
        - id: a_head
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          can:
            a_notes: {call: [write, read]}
            a_leaf: {call: [list]}

  - id: l_b
    file: fantastic_b.yaml
    manifest:
      agents:
        - id: store
          handler_module: file_bridge.tools
          allow: ['.']
          root: .fantastic
          ingress_rule: allow_all_ingress
        - id: b_leaf
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
        - id: b_head
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          can:
            b_leaf: {call: [list]}
        - id: b_vault
          handler_module: file_bridge.tools
          allow: ['.']
          ingress_rule: allow_all_ingress
          delete_lock: true
