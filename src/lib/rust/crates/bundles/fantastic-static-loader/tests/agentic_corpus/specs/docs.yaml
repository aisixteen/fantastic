# Test spec for `configs/docs.yaml` — WHAT THIS SUITE ASSERTS.
config: docs.yaml

name: docs
description: >
  A reflect says what an agent IS, and with `tier`, `verb` or `part` how to CALL
  it: oneliners carry each verb's signature, `detailed` the whole text. What a
  caller sees is what it holds: a caller with a `call` line sees the verbs that
  line names. A reflect's tree can be cut to the branches a caller works on
  (`show_subtrees`) or around the ones it knows (`ignore_subtrees`, each pruned
  branch left as `{id, pruned: n}`).

requirements: [DOC-1, DOC-2, DOC-3, DOC-5, FLT-1, FLT-2, FLT-3]

expect:
  hydration: ok
  steps:
    - name: the root's reflect advertises no kernel verbs
      operator: {to: kernel, send: {type: reflect}}
      expect: {absent: kernel_verbs}
      because: DOC-1
    - name: an agent's reflect lists its verbs, one signature line each
      operator: {to: shelf, send: {type: reflect}}
      expect: {mentions: "args:"}
      because: DOC-1

    - name: an agent with no line on the root is refused the kernel's docs
      reach: {from: asker, to: $root, send: {type: reflect, tier: oneliners}}
      expect: {allow: false}
      because: DOC-2
    - name: the operator writes reader a line on the root
      grant: {agent: reader, to: $root, line: {call: [reflect]}}
      because: DOC-2
    - name: a caller holding reflect reads the docs of what it holds
      reach: {from: reader, to: $root, send: {type: reflect, verb: reflect, tier: oneliners}}
      expect: {allow: true, contains: {tier: oneliners, id: kernel_state}}
      because: DOC-2
    - name: and only that — a kernel verb its line does not name is not shown
      reach: {from: reader, to: $root, send: {type: reflect, verb: cancel}}
      expect: {reason: bad_arg, contains: {arg: verb}}
      because: DOC-2

    - name: oneliners name the agent's bundle and one signature per verb
      operator: {to: shelf, send: {type: reflect, tier: oneliners}}
      expect: {contains: {id: shelf, handler_module: file_bridge.tools, tier: oneliners}}
      because: DOC-3
    - name: detailed for one verb is that verb's whole text
      operator: {to: kernel, send: {type: reflect, verb: cancel, tier: detailed}}
      expect: {contains: {tier: detailed}, mentions: "Kills that task AND ITS SUBTREE"}
      because: DOC-3

    - name: a verb the agent lacks is refused
      operator: {to: kernel, send: {type: reflect, verb: no_such_verb}}
      expect: {reason: bad_arg}
      because: DOC-5
    - name: an unknown tier is refused
      operator: {to: kernel, send: {type: reflect, tier: everything}}
      expect: {reason: bad_arg}
      because: DOC-5
    - name: an unknown verb on an agent is a coded refusal naming the verb
      operator: {to: shelf, send: {type: frobnicate}}
      expect: {reason: unhandled, contains: {verb: frobnicate}}
      because: DOC-5

    - name: an ignored branch is a stub counting what it holds
      operator: {to: kernel, send: {type: reflect, tree: ids, ignore_subtrees: [docs_loader]}}
      expect: {contains: {tree.*.id: docs_loader, tree.*.pruned: 4}, absent: shelf}
      because: FLT-1
    - name: a shown branch is all the tree holds
      operator: {to: kernel, send: {type: reflect, show_subtrees: [shelf]}}
      expect: {contains: {tree.*.id: shelf}, absent: asker}
      because: FLT-2
    - name: show first, then ignore inside what is shown
      operator: {to: kernel, send: {type: reflect, tree: ids, show_subtrees: [docs_loader], ignore_subtrees: [shelf]}}
      expect: {contains: {tree.*.pruned: 1}, mentions: asker}
      because: FLT-2
    - name: an id naming no agent is refused
      operator: {to: kernel, send: {type: reflect, ignore_subtrees: [no_such_agent]}}
      expect: {reason: bad_arg}
      because: FLT-3
