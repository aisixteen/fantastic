[package]
publish = false
name = "fantastic-cli-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cli singleton — terminal render sink. Prints token/done/say/error/status/context to stdout."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
