[package]
publish = false
name = "fantastic-sqlite-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The DURABLE memory store agent (`sqlite_store.tools`): ram_store's tables, keys, cascades and verbs over one SQLite file per store — a 1:1 mirror a caller cannot tell apart, except that it survives the process."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
fantastic-ram-store = { path = "../fantastic-ram-store" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
# `bundled`: SQLite compiled in (FTS5 included) — no system library to guess at.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
fantastic-kernel = { path = "../../fantastic-kernel", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
fantastic-ai-core = { path = "../fantastic-ai-core" }
futures-util = "0.3"
tempfile = "3"
