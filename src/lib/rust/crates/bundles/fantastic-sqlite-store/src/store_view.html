<style>
*{box-sizing:border-box}
html,body{margin:0}
body{padding:16px 24px;background:transparent;color:var(--fc-color-text-primary);font:14px/1.5 var(--fc-font-family-sans)}
h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 14px;color:var(--fc-color-text-subtle);font:12px var(--fc-font-family-mono)}
table{width:100%;border-collapse:collapse;background:var(--fc-color-surface-raised);border-radius:var(--fc-radius-card);box-shadow:var(--fc-shadow-bubble)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--fc-color-line-faint)}
th{font-size:11px;font-weight:600;color:var(--fc-color-text-muted)}
td.file{font:12px var(--fc-font-family-mono);word-break:break-all}
td.size{text-align:right;color:var(--fc-color-text-subtle);white-space:nowrap}
.empty,.err{color:var(--fc-color-text-subtle)}
.err{color:var(--fc-color-status-error)}
</style>
<h1>SQLite files this store may query</h1>
<p class="sub" id="sub"></p>
<div id="out"></div>
<script>
(function () {
  var AGENT = "{{agent}}";
  var out = document.getElementById("out"), sub = document.getElementById("sub");
  var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  var size = function (n) { return typeof n !== "number" ? "missing" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; };
  function draw(r) {
    var rows = r && Array.isArray(r.query_allow) ? r.query_allow : [];
    sub.textContent = AGENT + " · " + rows.length + " file" + (rows.length === 1 ? "" : "s");
    out.textContent = "";
    if (!rows.length) { out.appendChild(el("p", "empty", "No file is allowed: query_allow is empty.")); return; }
    var t = el("table"), h = el("tr");
    h.appendChild(el("th", "", "File")); h.appendChild(el("th", "", "Size"));
    t.appendChild(h);
    rows.forEach(function (x) {
      var tr = el("tr");
      tr.appendChild(el("td", "file", String(x.file)));
      tr.appendChild(el("td", "size", size(x.size)));
      t.appendChild(tr);
    });
    out.appendChild(t);
  }
  // one read at a time: events heard while one runs ask for one more read after it
  var reading = false, again = false;
  function load() {
    if (reading) { again = true; return; }
    reading = true;
    fantastic.send(AGENT, { type: "reflect" }).then(draw).catch(function () {
      out.textContent = "";
      out.appendChild(el("p", "err", "Could not read the store."));
    }).then(function () { reading = false; if (again) { again = false; load(); } });
  }
  // THE STORE'S PUBLISHED WRITES — a closed list: the file grew, shrank or was replaced.
  // A COPY OF A CALL made to the store (this view's own reflect, anyone's append or read)
  // is never one: those carry the verb's name, not these
  var WRITES = { appended: 1, pruned: 1, injected: 1, bytes_put: 1 };
  fantastic.watch(AGENT, function (ev) {
    if (ev && typeof ev === "object" && typeof ev.error !== "string" && WRITES[ev.type] === 1) load();
  });
  load();
})();
</script>
