<style>
:root{
--fc-color-accent-base:rgb(17 17 17);
--fc-color-accent-deep:rgb(17 17 17);
--fc-color-accent-deep-hover:rgb(43 43 43);
--fc-color-accent-on:rgb(255 255 255);
--fc-color-line-button:rgb(0 0 0 / 0.1);
--fc-color-line-faint:rgb(0 0 0 / 0.06);
--fc-color-line-strong:rgb(0 0 0 / 0.18);
--fc-color-status-error:rgb(179 38 30);
--fc-color-status-error-line:rgb(179 38 30 / 0.45);
--fc-color-status-error-surface:rgb(179 38 30 / 0.12);
--fc-color-status-ok:rgb(27 116 70);
--fc-color-status-warn:rgb(143 82 0);
--fc-color-status-warn-field:rgb(255 255 255 / 0.6);
--fc-color-status-warn-line:rgb(143 82 0 / 0.45);
--fc-color-status-warn-muted:rgb(143 82 0);
--fc-color-status-warn-on:rgb(255 255 255);
--fc-color-status-warn-surface:rgb(143 82 0 / 0.12);
--fc-color-surface-bubble:rgb(255 255 255 / 0.6);
--fc-color-surface-bubble-user:rgb(0 0 0 / 0.1);
--fc-color-surface-button:rgb(0 0 0 / 0.05);
--fc-color-surface-code:rgb(0 0 0 / 0.045);
--fc-color-surface-field:rgb(0 0 0 / 0.06);
--fc-color-surface-raised:rgb(255 255 255 / 0.72);
--fc-color-surface-well:rgb(0 0 0 / 0.06);
--fc-color-text-code:rgb(69 69 69);
--fc-color-text-cool:rgb(69 69 69);
--fc-color-text-muted:rgb(69 69 69);
--fc-color-text-primary:rgb(11 11 11);
--fc-color-text-subtle:rgb(107 107 107);
--fc-duration-pulse:1400ms;
--fc-duration-think:1100ms;
--fc-easing-in-out:cubic-bezier(0.42, 0, 0.58, 1);
--fc-font-family-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
--fc-font-family-sans:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
--fc-radius-bubble:12px;
--fc-radius-card:8px;
--fc-radius-chip:4px;
--fc-radius-control:6px;
--fc-radius-key:5px;
--fc-radius-panel:10px;
--fc-radius-pill:999px;
--fc-shadow-bubble:inset 0px 0px 0px 1px rgb(0 0 0 / 0.07);
--fc-shadow-focus:inset 0px 0px 0px 1px rgb(17 17 17 / 0.45), 0px 0px 0px 3px rgb(17 17 17 / 0.1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{padding:16px 24px;background:transparent;color:var(--fc-color-text-primary);font:14px/1.5 var(--fc-font-family-sans)}
h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 14px;color:var(--fc-color-text-subtle);font:12px var(--fc-font-family-mono)}
table{width:100%;border-collapse:collapse;background:var(--fc-color-surface-raised);border-radius:var(--fc-radius-card);box-shadow:var(--fc-shadow-bubble)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--fc-color-line-faint)}
th{font-size:11px;font-weight:600;color:var(--fc-color-text-muted)}
td.file{font:12px var(--fc-font-family-mono);word-break:break-all}
td.size{text-align:right;color:var(--fc-color-text-subtle);white-space:nowrap}
.empty,.err{color:var(--fc-color-text-subtle)}
.err{color:var(--fc-color-status-error)}
</style>
<h1>SQLite files this store may query</h1>
<p class="sub" id="sub"></p>
<div id="out"></div>
<script>
(function () {
  var AGENT = "{{agent}}";
  var out = document.getElementById("out"), sub = document.getElementById("sub");
  var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  var size = function (n) { return typeof n !== "number" ? "missing" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; };
  function draw(r) {
    var rows = r && Array.isArray(r.query_allow) ? r.query_allow : [];
    sub.textContent = AGENT + " · " + rows.length + " file" + (rows.length === 1 ? "" : "s");
    out.textContent = "";
    if (!rows.length) { out.appendChild(el("p", "empty", "No file is allowed: query_allow is empty.")); return; }
    var t = el("table"), h = el("tr");
    h.appendChild(el("th", "", "File")); h.appendChild(el("th", "", "Size"));
    t.appendChild(h);
    rows.forEach(function (x) {
      var tr = el("tr");
      tr.appendChild(el("td", "file", String(x.file)));
      tr.appendChild(el("td", "size", size(x.size)));
      t.appendChild(tr);
    });
    out.appendChild(t);
  }
  fantastic.send(AGENT, { type: "reflect" }).then(draw).catch(function () {
    out.textContent = "";
    out.appendChild(el("p", "err", "Could not read the store."));
  });
})();
</script>
