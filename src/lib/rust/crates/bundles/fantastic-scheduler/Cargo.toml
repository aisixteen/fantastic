[package]
publish = false
name = "fantastic-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Recurring-task scheduler — tokio interval tick fires kernel.send on schedule."

[dependencies]
# python-format helpers (`py_repr`, `py_str`, `py_truthy`, `py_json_dumps`) — the
# sidecar bytes and every refusal text are CPython's, so there is one spelling.
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `getentropy` — the OS CSPRNG behind python's `secrets` module.
libc = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
# The ROOT LOADER bundle — tests need it registered so the root answers the
# verbs it serves (`persist_blob`/`load_blob`, `boot`), as it does in production.
fantastic-core = { path = "../fantastic-core" }
fantastic-file = { path = "../fantastic-file" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
