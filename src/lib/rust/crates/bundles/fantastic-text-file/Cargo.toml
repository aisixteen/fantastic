[package]
publish = false
name = "fantastic-text-file"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stateless text-document agent — read/write/patch/append + on-demand version/if_match and checkpoints, every byte a gated send to a file_bridge over the raw stream channel."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
serde_json = { workspace = true }
async-trait = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# The tests wire a REAL file_bridge as the surface and exercise the raw
# read_stream/write_stream binary channel end to end (no fake blob store).
fantastic-file = { path = "../fantastic-file" }
