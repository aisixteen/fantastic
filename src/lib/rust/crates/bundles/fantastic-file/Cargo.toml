[package]
publish = false
name = "fantastic-file"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Filesystem-as-agent — text verbs, streams, list/delete/rename/mkdir and the allow list, rooted at the `root` field."

[dependencies]
# python-format helpers: repr/str/truthiness/OSError text, python-canonical.
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
fantastic-io-bridge = { path = "../../fantastic-io-bridge" }
serde_json = { workspace = true }
async-trait = { workspace = true }
# the on-demand document `version` (sha256[:16]).
sha2 = "0.10"
# the per-document edit locks.
tokio = { workspace = true }
# `watch_path`'s disk watcher — native events (FSEvents / inotify / kqueue), the
# library python's `watchfiles` is built on.
notify = "6"

# `sys::unix` — `read_private`'s one open: O_NOFOLLOW | O_NONBLOCK, ELOOP, getuid.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `sys::windows` — the private-file contract on the handle: the token's SIDs, the
# owner and DACL (`GetSecurityInfo` / `SetSecurityInfo`), the no-follow open.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
