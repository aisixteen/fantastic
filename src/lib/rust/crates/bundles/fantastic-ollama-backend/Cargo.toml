[package]
publish = false
name = "fantastic-ollama-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local LLM (ollama) bundle — streaming tokens + tool-calls, LLM contract reference impl."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { workspace = true }

[dev-dependencies]
fantastic-file = { path = "../fantastic-file" }
# Chat history lives in a `<self>_chat` durable_memory child — register the REAL
# store bundle so the round-trip test exercises the wiring, not a stub.
fantastic-durable-memory = { path = "../fantastic-durable-memory" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "0.6"
