[package]
publish = false
name = "fantastic-agentic-resources"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A generic roles registry: role cards, spawn, fleet, per-role and total limits (off by default)."

[dependencies]
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
fantastic-core = { path = "../fantastic-core" }
fantastic-file = { path = "../fantastic-file" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
