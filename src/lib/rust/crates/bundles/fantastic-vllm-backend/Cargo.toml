[package]
publish = false
name = "fantastic-vllm-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vLLM LLM bundle — talks to a vLLM server directly (OpenAI chat wire), with a KV-cache session table per endpoint."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }

[dev-dependencies]
# Every AI agent keeps its conversation in a memory store; the tests wire one.
fantastic-ram-store = { path = "../fantastic-ram-store" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "0.6"
