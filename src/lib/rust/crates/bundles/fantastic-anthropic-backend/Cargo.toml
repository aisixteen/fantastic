[package]
publish = false
name = "fantastic-anthropic-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anthropic (Claude Messages API) LLM bundle — same ai-core surface as ollama/nvidia, Anthropic transport + tool shape."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { workspace = true }

[dev-dependencies]
# The SCENARIO runner reads the shared yaml and needs the roles a scenario
# names — `cli` is the render sink an AI streams its turn to.
serde_yaml = "0.9"
fantastic-cli-bundle = { path = "../fantastic-cli-bundle" }
fantastic-exec-bridge = { path = "../fantastic-exec-bridge" }
fantastic-file = { path = "../fantastic-file" }
# Chat history lives in a `<self>_chat` durable_memory child — register the REAL
# store bundle so the tests exercise the wiring, not a stub.
fantastic-durable-memory = { path = "../fantastic-durable-memory" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "0.6"
