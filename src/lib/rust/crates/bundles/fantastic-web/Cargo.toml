[package]
publish = false
name = "fantastic-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP host — serves python's four rendering routes and mounts child call surfaces."

[dependencies]
# python-format helpers: `{x!r}`, `int()`, truthiness, `json.dumps`.
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
fantastic-io-bridge = { path = "../../fantastic-io-bridge" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tower = "0.5"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-tungstenite = { workspace = true }
fantastic-web-ws = { path = "../fantastic-web-ws" }
fantastic-web-rest = { path = "../fantastic-web-rest" }
fantastic-file = { path = "../fantastic-file" }
fantastic-text-file = { path = "../fantastic-text-file" }
