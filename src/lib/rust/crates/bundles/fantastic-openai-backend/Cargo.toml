[package]
publish = false
name = "fantastic-openai-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible /chat/completions provider (llama.cpp, any OpenAI-wire server) — RAW text, no native tools."

[dependencies]
fantastic-ai-core = { path = "../fantastic-ai-core" }
fantastic-bundle = { path = "../../fantastic-bundle" }
fantastic-kernel = { path = "../../fantastic-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { workspace = true }

[dev-dependencies]
fantastic-ram-store = { path = "../fantastic-ram-store", features = ["test-support"] }
fantastic-kernel = { path = "../../fantastic-kernel", features = ["test-support"] }
# Every AI agent keeps its conversation in a memory store; the tests wire one.
fantastic-file = { path = "../fantastic-file" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "0.6"
