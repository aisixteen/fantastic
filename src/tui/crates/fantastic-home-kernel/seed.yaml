# The home kernel's base records, written once, when W has no .fantastic/agent.yaml.
agents:
  - id: home_memory            # the kernel's own store, named by the root's memory_store_id
    handler_module: sqlite_store.tools
    path: .fantastic/home.db
    admins: [kernel]
  - id: store                  # the root loader's provider: every host record persists through it
    handler_module: file_bridge.tools
    root: .fantastic
    allow: ["."]
    ingress_rule: allow_all_ingress
