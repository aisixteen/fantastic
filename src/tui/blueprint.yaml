# THE BASE TREE a fresh store gets: the v9 initial tree (grant model v9,
# `initial-tree.md`). Applied ONCE, at init, and only when the human presses a key
# on the intro screen or runs `fantastic mcp`. Every later run rehydrates what is
# on disk and never reads this file again; editing it does not touch a store that
# already exists.
#
# DISK POSITION IS THE PARENT: nesting under `agents:` is what makes an agent a
# child. No entry carries `parent_id` — the writer refuses one.
#
# The root is not here: the kernel creates its own root, with its own id and
# guid. A line that names the root writes `@root`, and the writer substitutes the
# kernel's own root id (`bootstrap::DEFAULT_ROOT_ID`).
#
# EVERY LINE IS HERE. No code writes a `can` line: the tree and its lines are
# these records. Every agent reaches its own tree by position, which is never
# written into a record; each line below is ONE line in the holder's own `can`.
#
#   <root>                       (the kernel's own)
#   ├── kernel_memory              ram_store — the KERNEL'S store, RAM only
#   └── user                       the person's agent
#       ├── store                  file_bridge over @state — the kernel's provider
#       │   └── prompt_file        file view: prompt.md (every AI's system block)
#       ├── memory                 sqlite_store — THE AI store
#       ├── credentials            credential_store — keys, outside the user space
#       ├── files                  file_bridge over the work folder
#       │   └── static_files       folder view, read-only
#       ├── exec                   exec_bridge — operator power
#       ├── home                   the user's home store (~/.fantastic)
#       ├── term                   exec_bridge — the in-app PTY
#       ├── web                    web host; holds every line its legs hold (the cap)
#       │   ├── canvas_ws          the page's leg: the person through the page
#       │   ├── canvas_page        the canvas page
#       │   └── mcp                the coding CLI's leg
#       │       └── mcp_config     file_bridge for .mcp.json
#       └── canvas_root            ===== THE USER SPACE =====
#           ├── web_loader         the main canvas's page records
#           └── canvas_garage      an open sub-canvas: the garage
#               └── canvas_garage_loader
#
# A `create` line's `what` names bundles as `handler_module` shows them.

# THE ROOT'S OWN FIELDS. The root record is the kernel's (it mints the id and
# the guid), so these are not written at init: the shell sets each one on the
# kernel's root at boot, only while the root does not carry it yet.
#
# `memory_store_id`: the kernel will not start without a memory store — its
# ledger, dead letters and named-call dedup live there. It is `kernel_memory`, a
# ram_store (owner 2026-10-09): every call / settle / task / ack / flush row stays
# in RAM, so no keystroke, output replay or read touches disk. A restart loses
# named-call dedup, dead letters from a stop and the ledger history (this run
# only); ids stay unique (the counter is in the root record). The ledger is capped
# at 100 000 calls (the shell sets it, `kern/host::LEDGER_CAP`).
root:
  memory_store_id: kernel_memory

agents:
  # THE KERNEL'S STORE — RAM only. The kernel writes as the operator; the shell
  # reads any owner's rows as its admin (`kernel`).
  - id: kernel_memory
    handler_module: ram_store.tools
    admins: [kernel]

  - id: user
    handler_module: user.tools
    # the main canvas's page records
    page_loader: web_loader
    # the cap chain for `get`: `credentials` is in its own tree as well
    can:
      credentials: {call: [get]}
    agents:
      # THE STORE. The kernel persists its records (YAML) only through a
      # file_bridge whose root is the store dir itself; without one it says "no
      # store wired — messages stay in RAM" and nothing survives a restart. It is
      # found by position and must exist before the root boots.
      - id: store
        handler_module: file_bridge.tools
        root: "@state"
        # the whole store dir: without it record persistence stops at the first write
        allow: ["."]
        ingress_rule: allow_all_ingress
        agents:
          # THE PROJECT'S SYSTEM BLOCK: `<state>/prompt.md`, read by every AI
          # through this view (`kern/prompt`). A view reaches its bridge by its
          # one line on it.
          - id: prompt_file
            handler_module: file_bridge.tools
            view: file
            bridge: store
            path: prompt.md
            display_name: prompt.md
            can:
              $parent: {call: [read, watch_path, unwatch_path]}

      # THE AI STORE — ONE shared SQLite file for EVERY AI agent (owner
      # 2026-10-09). Rows are keyed `<guid>|<agent>`, so agents never mix. The
      # shell reads any owner's rows as its admin (`kernel`).
      - id: memory
        handler_module: sqlite_store.tools
        path: "@state/memory.db"
        admins: [kernel]

      # THE CREDENTIAL STORE. Its backend is the user's key mode, set at boot
      # from the user's home (`kern/keys`); it holds no lines, its readers hold
      # theirs.
      - id: credentials
        handler_module: credential_store.tools

      # THE WORK FOLDER. Its `allow` is inclusion-only and never exposes
      # `.fantastic/`: no `.` entry and no path under the state folder, so no
      # leg writes records, bundles or a loader manifest through it.
      - id: files
        handler_module: file_bridge.tools
        root: "."
        allow: []
        ingress_rule: allow_all_ingress
        agents:
          # THE STATIC FILES every view's cells load: a read-only folder view.
          - id: static_files
            handler_module: file_bridge.tools
            view: folder
            bridge: files
            path: "."
            display_name: static_files
            can:
              $parent: {call: [list, watch_path, unwatch_path]}

      - id: exec
        handler_module: exec_bridge.tools
        allowed: [".*"]
        # where a command runs is the record's: the directory the user ran us in
        cwd: "."
        # a bare command is found on the CHILD's PATH only, never the kernel's
        inherit_env: ["*"]
        ingress_rule: allow_all_ingress

      # THE USER'S HOME: saved set-ups, keys and stored fantastic locations
      # (`user_store.tools`, its folder fixed by the binary).
      - id: home
        handler_module: user_store.tools
        display_name: home

      # THE IN-APP TERMINAL: one PTY job; its `allowed` line is set when it
      # opens (`kern/terminal`).
      - id: term
        handler_module: exec_bridge.tools
        cwd: "."
        inherit_env: ["*"]
        ingress_rule: allow_all_ingress

      # THE WEB HOST: the one HTTP/WS listener. No port here: the first boot
      # picks a free one and records it (`kern/host`). It holds every line its
      # legs hold: it is their cap.
      - id: web
        handler_module: web.tools
        can:
          canvas_root: {create: {who: ["*"], what: "*"}}
          files: {call: [read, list, write]}
          static_files: {call: [read, list]}
        agents:
          # THE PAGE'S LEG: the person through the page.
          - id: canvas_ws
            handler_module: web_ws.tools
            ingress_rule: allow_all_ingress
            can:
              canvas_root: {create: {who: ["*"], what: "*"}}
              files: {call: [read, list, write]}

          # THE CANVAS PAGE, embedded in the binary.
          - id: canvas_page
            handler_module: canvas_page.tools
            verbs: {read_stream: {}}
            can:
              static_files: {call: [read, list]}

          # THE CODING CLI'S LEG (`fantastic mcp`).
          - id: mcp
            handler_module: web_mcp.tools
            file_bridge_id: mcp_config
            mcp_config_file: .mcp.json
            can:
              canvas_root: {create: {who: ["*"], what: "*"}}
            agents:
              # THE PROJECT'S `.mcp.json`, in this bridge's own folder; the leg
              # reaches it by position.
              - id: mcp_config
                handler_module: file_bridge.tools
                root: "@self"
                readonly: false
                allow: [.mcp.json]
                ingress_rule: allow_all_ingress

      # ===== THE USER SPACE: canvas_root's subtree =====
      - id: canvas_root
        handler_module: canvas.tools
        main: true
        can:
          # the main canvas: chats and sub-canvases
          canvas_root: {create: {who: ["*"], what: {ai_chat.tools: {model: "*"}, canvas.tools: {}}}}
          memory: {call: [append, read]}
          prompt_file: {call: [read]}
          # cap chain for the garage's key users
          credentials: {call: [get]}
        agents:
          - id: web_loader
            handler_module: kernel_state.tools
            root: "@state/web"
            watch: false

          # THE GARAGE: a sub-canvas made open, as `new_canvas` makes one.
          - id: canvas_garage
            handler_module: canvas.tools
            main: false
            can:
              credentials: {call: [get]}
              memory: {call: [append, read]}
              canvas_garage:
                create:
                  who: ["*"]
                  what:
                    ai_chat.tools: {model: "*"}
                    exec_bridge.tools: {allowed: "*"}
                    file_bridge.tools: {root: "*"}
                    anthropic_backend.tools: {can: {credentials: {call: [get]}}, endpoint: "*", model: "*"}
            agents:
              - id: canvas_garage_loader
                handler_module: kernel_state.tools
                root: "@state/web/canvas_garage"
                watch: false
