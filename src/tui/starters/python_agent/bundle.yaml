base: py_agent
sentence: A starter python agent — edit agent.py (its verbs) and panel.html (its view); a change takes effect at once.
command: [python3, agent.py]
verbs:
  hello: {doc: "Greet by name. Returns {greeting}.", schema: {type: object, properties: {name: {type: string}}, additionalProperties: false}}
  count: {doc: "Adds one to this agent's counter and returns {count}; emits {type: count, count}.", schema: {type: object, properties: {}, additionalProperties: false}}
record:
  inherit_env: [PATH]
  view: {kind: html, bytes_file: panel.html, calls: [hello, count, watch]}
