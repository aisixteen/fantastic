<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:transparent;color:var(--fc-color-text-primary);font:13px/1.45 var(--fc-font-family-sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--fc-color-accent-base);outline-offset:1px}
.hov:hover{background:var(--fc-color-surface-hover)}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 10px 0 12px}
.head h1{margin:0;font:600 11px/1 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.split{flex:1 1 0;min-height:0;display:flex;border-top:1px solid var(--fc-color-line-button)}
.rail{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-right:1px solid var(--fc-color-line-button);overflow-y:auto;scrollbar-width:none}
.k{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px;padding:6px 0 5px;border-radius:var(--fc-radius-card)}
.k .mark{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:var(--fc-radius-card);font:600 11px/1 var(--fc-font-family-mono);text-transform:uppercase;background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.k .kb{position:absolute;top:-5px;right:-5px;display:grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:var(--fc-radius-pill);font:700 10px/1 var(--fc-font-family-sans);background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on);box-shadow:0 0 0 2px var(--fc-color-surface-raised)}
.k.here .mark{background:var(--fc-color-accent-base);color:var(--fc-color-accent-on)}
.k .nm{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--fc-color-text-muted)}
.k.here .nm{color:var(--fc-color-text-primary);font-weight:600}
.agents{flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:12px 8px 8px;gap:14px}
.wait{flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 4px 4px;border-radius:var(--fc-radius-panel);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.wait[hidden]{display:none}
.wait{margin:0 4px}
.wait h2{display:flex;align-items:center;gap:8px;margin:0;padding:0 8px 4px;font:600 11px/1.4 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-status-warn)}
.pill{display:grid;place-items:center;font:700 11px/1 var(--fc-font-family-sans);min-width:18px;height:18px;padding:0 5px;border-radius:var(--fc-radius-pill);text-align:center;background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on)}
.w{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:5px 8px;border-radius:var(--fc-radius-card)}
.w .gl{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--fc-radius-control);background:var(--fc-color-surface-raised);color:var(--fc-color-text-muted)}
.w .gl .face{width:16px}
.w .who{display:flex;flex-direction:column;flex:1;min-width:0}
.w .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .who span{font-size:12px;color:var(--fc-color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .age{flex:none;font:500 11px/1 var(--fc-font-family-mono);color:var(--fc-color-status-warn)}
.tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 4px}
.sws{flex:none;margin-left:auto;display:flex;align-items:center;gap:10px}
.fl{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-raised);box-shadow:inset 0 0 0 1px var(--fc-color-line-button);color:var(--fc-color-text-subtle)}
.fl:focus-within{box-shadow:inset 0 0 0 1px var(--fc-color-line-selected)}
.tools input{flex:1;min-width:0;height:28px;padding:0;border:0;outline:0;background:transparent;font:inherit;font-size:12px;color:var(--fc-color-text-primary)}
.tools input:focus-visible{outline:0}
.sw{flex:none;display:flex;flex-direction:row-reverse;align-items:center;gap:7px;font-size:12px;color:var(--fc-color-text-muted)}

.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fc-color-text-subtle)}
.sw[aria-checked="true"] i{background:var(--fc-color-accent-base)}
.sw[aria-checked="true"] i::after{left:14px;background:var(--fc-color-accent-on)}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tree{display:flex;flex-direction:column;gap:1px}
.r{position:relative;display:flex;align-items:center;border-radius:var(--fc-radius-card)}
.tw svg{display:block;transition:transform .12s}
.tw.open svg{transform:rotate(90deg)}
.r .tw{flex:none;display:grid;place-items:center;width:18px;height:28px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle)}

.r .gl{position:relative;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.r .gl svg{display:block}
.r .gl.ai{background:var(--fc-color-surface-selected)}
.face{display:block;width:18px;height:auto}
.r .two{display:flex;flex-direction:column;min-width:0;flex:1}
.r .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .name.top{font-weight:600}
.r .name.tool{flex:0 1 auto}
.r .line{display:flex;align-items:center;gap:6px;min-width:0}
.r .tag{flex:none;font:10px/15px var(--fc-font-family-mono);padding:0 5px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-muted);background:var(--fc-color-surface-well)}
.r .age{flex:none;font:500 11px/1 var(--fc-font-family-mono);color:var(--fc-color-status-warn)}
.r.f .name{color:var(--fc-color-text-muted)}
.r.f.d .name{font-weight:500;color:var(--fc-color-text-primary)}
.r .sub{font-size:12px;line-height:1.3;color:var(--fc-color-text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .asks{flex:none;font:500 11px/1 var(--fc-font-family-mono);color:var(--fc-color-status-warn)}
.sub.ask{color:var(--fc-color-status-warn)}
.sub.stalled{color:color-mix(in srgb,var(--fc-color-status-warn) 40%,var(--fc-color-status-error))}
.sub.failed{color:var(--fc-color-status-error)}
.sub.done{color:var(--fc-color-status-ok)}
.pins{flex:none;display:flex;flex-direction:column;gap:1px;padding-top:6px;border-top:1px solid var(--fc-color-line-button);max-height:45%;overflow-y:auto}
.pins[hidden]{display:none}
.tg{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 8px 4px 0;border-radius:var(--fc-radius-card)}
.tg .tw{flex:none;display:grid;place-items:center;width:18px;height:28px;color:var(--fc-color-text-subtle)}
.tg .ic{flex:none;display:flex}
.tg .ic span{display:grid;place-items:center;width:24px;height:24px;margin-left:-6px;border-radius:var(--fc-radius-control);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted);box-shadow:0 0 0 2px var(--fc-color-surface-raised)}
.tg .ic span:first-child{margin-left:0}
.tg .lb{flex:1;min-width:0;font-weight:500;color:var(--fc-color-text-muted)}
.badge{position:absolute;right:-4px;bottom:-4px;display:none;place-items:center;box-sizing:border-box;width:13px;height:13px;border-radius:50%;font:700 9px/1 var(--fc-font-family-sans);box-shadow:0 0 0 2px var(--fc-color-surface-raised)}
.badge.ask{display:grid;background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on)}
.badge.stalled{display:grid;background:color-mix(in srgb,var(--fc-color-status-warn) 40%,var(--fc-color-status-error));color:var(--fc-color-accent-on)}
.badge.failed{display:grid;background:var(--fc-color-status-error);color:var(--fc-color-accent-on)}
.badge.done{display:grid;background:var(--fc-color-status-ok);color:var(--fc-color-status-ok-on)}

   tile; Working's is a ray running round it, Stalled's is dashed */
.r .gl.ol::before{content:"";position:absolute;inset:-3px;border-radius:calc(var(--fc-radius-card) + 3px);padding:1.5px;background:var(--olc);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

.r .gl.active{--olc:var(--fc-color-accent-base)}
.r .gl.ask{--olc:var(--fc-color-status-warn)}
.r .gl.stalled{--olc:color-mix(in srgb,var(--fc-color-status-warn) 40%,var(--fc-color-status-error))}
.r .gl.failed{--olc:var(--fc-color-status-error)}
.r .gl.paused{--olc:var(--fc-color-text-subtle)}
.r .gl.done{--olc:var(--fc-color-status-ok)}
.r.t .main{min-height:34px;padding:2px 8px 2px 4px}
.r.t .gl{width:24px;height:24px;border-radius:var(--fc-radius-control)}
.r.sel,.r.sel .main{background:var(--fc-color-surface-selected);box-shadow:inset 0 0 0 1px var(--fc-color-line-selected)}
.r.f .main{min-height:26px;gap:7px;padding:1px 8px 1px 2px}
.r.f .gl{width:14px;height:14px;background:transparent;border-radius:0}
.r.f .name{font:12px/1.3 var(--fc-font-family-mono)}
.r.f .tw{height:26px}
.gd{position:absolute;top:0;bottom:0;width:1px;background:var(--fc-color-line-button);pointer-events:none}
.go{flex:none;display:none;place-items:center;width:22px;height:22px;margin-right:4px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle);font-size:12px}
.r:hover .go,.r:focus-within .go,.r.sel .go{display:grid}
.note{padding:4px 8px;font-size:12px;color:var(--fc-color-text-subtle)}
.note.err{color:var(--fc-color-status-error)}
@keyframes spin{to{transform:rotate(360deg)}}
@property --ray{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ray{to{--ray:360deg}}
@media (max-width:520px) and (pointer:coarse){
body{position:relative}
:root[data-host-head] .head{display:flex}
.head{height:56px;padding:0 128px 0 16px}
.head h1{font:600 18px/1.3 var(--fc-font-family-sans);letter-spacing:-.01em;text-transform:none}
.split{flex-direction:column}
.rail{position:absolute;top:6px;right:12px;max-width:110px;flex-direction:row;justify-content:flex-end;gap:6px;padding:0;border-right:0;overflow-x:auto;overflow-y:hidden}
.k{flex:none;width:auto;min-height:44px;padding:4px;border-radius:var(--fc-radius-panel);box-shadow:inset 0 0 0 1px var(--fc-color-line-button)}
.k .nm{display:none}
.k .mark{width:30px;height:30px}
.agents{padding:12px 12px 0;gap:12px}
.wait{border-radius:12px}
.w{min-height:46px;gap:10px}
.w .who span{font-size:13px}
.fl{height:44px}
.tools input{height:40px;font-size:16px}
.sw{min-height:44px}
.r .tw{width:22px;height:44px}
.r .main{min-height:44px;gap:11px}
.r .gl{width:30px;height:30px}
.r .sub{font-size:13px}
.r.f .main{min-height:34px}
.r.f .tw{height:34px}
.r.f .name{font-size:13px}
.go{display:grid;width:34px;height:34px}
.tg{min-height:44px;margin-left:14px}
.pins{margin:0 -12px;padding:6px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*,.r .gl.ol.ray::before{animation:none!important}}

<header class="head"><h1 id="ttl">Agents</h1></header>
<div class="split">
<nav class="rail" id="strip" aria-label="Kernels"></nav>
<nav class="agents" aria-label="Agents">
<section class="wait" id="wait" aria-label="Waiting for you" hidden></section>
<div class="tools">
<label class="fl"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="filter" type="search" placeholder="Filter agents and files" aria-label="Filter agents and files" autocomplete="off"></label>
<span class="sws"><button class="sw" id="sw" type="button" role="switch" aria-checked="false" aria-label="Show files in the tree"><i></i>Files</button>
<button class="sw" id="full" type="button" role="switch" aria-checked="false" aria-label="Show the whole kernel tree" title="Compact: the AI agents under the root, the rest in the tools group. Full: the whole kernel tree."><i></i>Full</button></span>
</div>
<div class="scroll"><div class="tree" id="tree" role="tree"></div><div class="note err" id="err" hidden></div></div>
<div class="pins" id="pins" hidden></div>
</nav>
</div>
<script>
// pure
var CHAT_REPLY_KEYS = ["tree"];
var FILES_ID = "files";
var ROOT = ".";
var IGNORED = [".git", "node_modules", "target", "dist", "__pycache__"];
function oneLine(t) { return String(t == null ? "" : t).replace(/\s+/g, " ").trim(); }
function shortGuid(g) { return String(g == null ? "" : g).slice(0, 6); }
function markOf(name) {
  var words = String(name == null ? "" : name).split(/[^A-Za-z0-9]+/).filter(function (w) { return w !== ""; });
  if (words.length > 1) return words[0].charAt(0) + words[1].charAt(0);
  return (words[0] || "").slice(0, 2) || "?";
}
function parentOf(p) { var i = String(p).lastIndexOf("/"); return i < 0 ? ROOT : String(p).slice(0, i); }
// the kernel strip: this kernel first (highlighted), then each connected peer row {guid, via}
function kernelStrip(root, peers, waiting) {
  var here = { key: "here", guid: String(root && root.guid || ""), name: String(root && (root.display_name || root.id) || "this kernel"), here: true, waiting: waiting > 0 ? waiting : 0 };
  here.mark = markOf(here.name);
  var rows = [here];
  (Array.isArray(peers) ? peers : []).forEach(function (p) {
    if (!p || typeof p.guid !== "string" || p.guid === "") return;
    var n = shortGuid(p.guid);
    rows.push({ key: p.guid, guid: p.guid, name: n, mark: markOf(n), here: false });

}
// the ids a handler_modules reply lists (tree: "ids" is a flat list of ids)
function chatSet(reply) {

  t.forEach(function (x) { if (typeof x === "string") out[x] = true; });

}
// the state of a chat, the design's six: what it asks > its last phase as its sidebar agent
// published it (none: at rest). A running call, and a chain that waits on its own work, is
// Working (the spinner) with its word; a call's end keeps its badge until the next call.
var WORKING = { queued: "queued", thinking: "thinking", streaming: "writing", retrying: "retrying", awaiting: "waiting" };
var ENDED = {
  stalled: { kind: "stalled", label: "stalled", glyph: "!" },
  failed: { kind: "failed", label: "failed", glyph: "\u00d7" },
  done: { kind: "done", label: "done", glyph: "\u2713" },
  paused: { kind: "paused", label: "paused", glyph: "II" }

// the outline round the tile of a chat in state `kind`: Working's runs round it (ray),
// Stalled's is dashed, each other state's is a plain ring, none at rest
function outlineOf(kind) {

  if (Object.prototype.hasOwnProperty.call(ENDED, kind) || kind === "ask") return "ol";

function stateOf(phase, asks) {
  if (asks) return { kind: "ask", label: "asks you", glyph: "?" };
  phase = typeof phase === "string" ? phase : "";
  if (Object.prototype.hasOwnProperty.call(WORKING, phase)) return { kind: "active", label: WORKING[phase], glyph: "" };

function countKids(n) { return n && Array.isArray(n.children) ? n.children.length : 0; }
function totalBelow(n) {
  var c = 0;
  (n && n.children || []).forEach(function (k) { c += 1 + totalBelow(k); });
  return c;

// a folder listing, directories first, then by name; the folders a tree hides (.git ...) are left out
function sortedListing(files) {
  return (Array.isArray(files) ? files : []).filter(function (f) { return f && typeof f.name === "string"; })
    .slice().sort(function (a, b) {

function fileRows(lists, open, path, depth) {

// `folded` = {id: true}; a folded branch shows its child count and hides what is below it.
// `files` = {on, lists, open}: with `on`, the project's files are rows INSIDE the tree, under the `files` agent.
// `opts` = {ages: {id: "12m"}, tools: true}: the age of an asking agent's oldest question; with `tools`,

    var isChat = !!chats[n.id];
    var isFolded = foldable && !!folded[n.id];

      kind: "agent", id: n.id, depth: depth,
      name: String(n.display_name || n.id),
      tag: n.handler_module ? String(n.handler_module).replace(/\.tools$/, "") : "",
      chat: isChat, kids: kids, foldable: foldable, folded: isFolded,

      asksBelow: isFolded ? asksUnder(n, asks) : 0,

    });

// the AI agents of `n`'s branch as a tree: `n` with, as its children, its nearest AI descendants, each
// with its own (an agent between two of them, not an AI agent, is left out)
function chatsOnly(n, chats) {

function filesNode(root) {

  var kids = root.children || [];
  for (var i = 0; i < kids.length; i++) { var f = filesNode(kids[i]); if (f) return f; }
  return null;

// sidebar agent publishes (`files_changed`)
function syncFiles() {
  var want = wantedWatches(st.filesOn, st.open), have = Object.keys(watching);
  want.forEach(function (p) {
    if (watching[p]) return;
    watching[p] = true;
    call("files", { type: "watch_path", path: p });
    readDir(p);
  });
  have.forEach(function (p) {
    if (want.indexOf(p) >= 0) return;
    delete watching[p];
    call("files", { type: "unwatch_path", path: p });
  });
}
// the chats' call phases now, as the sidebar agent holds them
function readPhases() {
  return call(ME, { type: "reflect" }).then(function (r) {
    if (failed(r)) return;
    if (r.phases && typeof r.phases === "object") st.status = r.phases;
    if (typeof r.files_root === "string") st.filesRoot = r.files_root;
  });
}
function readInquiries() {
  return call("user", { type: "inquiries" }).then(function (r) { st.inq = failed(r) ? [] : (r.inquiries || []); });
}
function refreshTree() {
  return Promise.all([
    call("kernel", { type: "reflect", detail: "full" }),
    call("kernel", { type: "reflect", handler_modules: ["ai_chat.tools"], tree: "ids" })
  ]).then(function (rs) {
    if (failed(rs[0])) { say("kernel reflect: " + (rs[0] && rs[0].error || "no answer")); return []; }
    say("");
    st.root = rs[0]; st.tree = rs[0].tree && !Array.isArray(rs[0].tree) ? rs[0].tree : null;
    st.chats = failed(rs[1]) ? {} : chatSet(rs[1]);
  });
}
// ONE MODEL, MANY VIEW-MODELS: the view watches ONLY its own agent, which publishes every
// change the tree shows (`heardOf`); it reads again only what an event names — never on a timer
var due = { tree: false, inquiries: false, dirs: {} }, reading = false;
function heard(ev) {
  var what = heardOf(ev);
  if (what === "status") { st.status = withPhase(st.status, ev.agent, ev.phase); paintTree(); paintPins(); return; }
  if (what === "files") changedDirs(ev, st.lists).forEach(function (p) { due.dirs[p] = true; });
  else if (what !== "") due[what] = true;
  else return;
  if (!reading) readDue();
}
// what the events asked for, read once; events heard meanwhile are read right after
function readDue() {
  reading = true;
  var d = due; due = { tree: false, inquiries: false, dirs: {} };
  Promise.all([d.tree ? refreshTree() : null, d.inquiries ? readInquiries() : null].concat(Object.keys(d.dirs).map(readDir))).then(paintAll, paintAll).then(function () {
    reading = false;
    if (due.tree || due.inquiries || Object.keys(due.dirs).length) readDue();
  });
}
function paintAll() { paintStrip(); paint(); }
// THE CLOCK: the ages ("12m") drawn again from what the view holds; it reads nothing
function clock() { paintWait(); paintTree(); paintPins(); }
// the host sends what it kept of the last visit (`restore`), after this view says `ready`
fantastic.onMessage(function (m) {
  if (!m || m.type !== "restore") return;
  var r = restoredState(m.state);
  st.folded = r.folded; st.open = r.open; st.filesOn = r.filesOn; st.toolsOpen = r.toolsOpen; st.full = r.full;
  paint(); syncFiles();
});
$("sw").addEventListener("click", function () { setFiles(!st.filesOn); });
$("full").addEventListener("click", function () { st.full = !st.full; keep(); paint(); });
$("filter").addEventListener("input", function () { st.filter = $("filter").value; paintTree(); paintPins(); });
post({ type: "ready" });
paint();
fantastic.watch(ME, heard);
Promise.all([refreshTree(), readPhases(), readInquiries()]).then(paintAll, paintAll);
setInterval(clock, 60000);
</script>
