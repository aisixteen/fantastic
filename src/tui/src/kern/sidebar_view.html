<style>
:root{
--fc-color-accent-base:rgb(17 17 17);
--fc-color-accent-deep:rgb(17 17 17);
--fc-color-accent-deep-hover:rgb(43 43 43);
--fc-color-accent-on:rgb(255 255 255);
--fc-color-line-button:rgb(0 0 0 / 0.1);
--fc-color-line-faint:rgb(0 0 0 / 0.06);
--fc-color-line-selected:rgb(0 0 0 / 0.3);
--fc-color-line-strong:rgb(0 0 0 / 0.18);
--fc-color-status-error:rgb(179 38 30);
--fc-color-status-ok:rgb(27 116 70);
--fc-color-status-warn:rgb(143 82 0);
--fc-color-status-warn-field:rgb(255 255 255 / 0.6);
--fc-color-status-warn-line:rgb(143 82 0 / 0.45);
--fc-color-status-warn-muted:rgb(143 82 0);
--fc-color-status-warn-on:rgb(255 255 255);
--fc-color-status-warn-surface:rgb(143 82 0 / 0.12);
--fc-color-surface-bubble:rgb(255 255 255 / 0.6);
--fc-color-surface-button:rgb(0 0 0 / 0.05);
--fc-color-surface-code:rgb(0 0 0 / 0.045);
--fc-color-surface-field:rgb(0 0 0 / 0.06);
--fc-color-surface-hover:rgb(0 0 0 / 0.09);
--fc-color-surface-raised:rgb(255 255 255 / 0.72);
--fc-color-surface-selected:rgb(0 0 0 / 0.08);
--fc-color-surface-well:rgb(0 0 0 / 0.06);
--fc-color-text-code:rgb(69 69 69);
--fc-color-text-cool:rgb(69 69 69);
--fc-color-text-muted:rgb(69 69 69);
--fc-color-text-primary:rgb(11 11 11);
--fc-color-text-subtle:rgb(107 107 107);
--fc-duration-pulse:1400ms;
--fc-duration-think:1100ms;
--fc-easing-in-out:cubic-bezier(0.42, 0, 0.58, 1);
--fc-font-family-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
--fc-font-family-sans:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
--fc-radius-bubble:12px;
--fc-radius-card:8px;
--fc-radius-chip:4px;
--fc-radius-control:6px;
--fc-radius-key:5px;
--fc-radius-panel:10px;
--fc-radius-pill:999px;
--fc-shadow-bubble:inset 0px 0px 0px 1px rgb(0 0 0 / 0.07);
--fc-shadow-focus:inset 0px 0px 0px 1px rgb(17 17 17 / 0.45), 0px 0px 0px 3px rgb(17 17 17 / 0.1);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:transparent;color:var(--fc-color-text-primary);font:13px/1.45 var(--fc-font-family-sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--fc-color-accent-base);outline-offset:1px}
.hov:hover{background:var(--fc-color-surface-hover)}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 10px 0 12px}
.head h1{margin:0;font:600 11px/1 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;height:20px;padding:0 8px;border-radius:var(--fc-radius-chip);background:var(--fc-color-surface-button);box-shadow:inset 0 0 0 1px var(--fc-color-line-faint);font-size:11px;line-height:20px;color:var(--fc-color-text-muted)}
.split{flex:1 1 0;min-height:0;display:flex;border-top:1px solid var(--fc-color-line-button)}
.rail{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-right:1px solid var(--fc-color-line-button);overflow-y:auto;scrollbar-width:none}
.k{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;padding:3px 0;border-radius:var(--fc-radius-control)}
.k .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--fc-radius-card);font:600 11px/1 var(--fc-font-family-mono);text-transform:uppercase;background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.k.here .mark{background:var(--fc-color-accent-base);color:var(--fc-color-accent-on)}
.k .nm{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--fc-color-text-muted)}
.k.here .nm{color:var(--fc-color-text-primary);font-weight:600}
.agents{flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:12px 8px 8px;gap:12px}
.title{flex:none;display:flex;align-items:center;gap:10px;padding:0 4px}
.title .logo{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-selected);color:var(--fc-color-text-primary)}
.title .who{display:flex;flex-direction:column;min-width:0}
.title b{font:600 15px/1.3 var(--fc-font-family-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title span{font-size:11px;color:var(--fc-color-text-subtle)}
.wait{flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 4px 4px;border-radius:var(--fc-radius-panel);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.wait[hidden]{display:none}
.wait h2{display:flex;align-items:center;gap:8px;margin:0;padding:0 8px 4px;font:600 11px/1.4 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-status-warn)}
.pill{font:600 10px/16px var(--fc-font-family-mono);min-width:18px;padding:0 5px;border-radius:var(--fc-radius-pill);text-align:center;background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on)}
.w{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:5px 8px;border-radius:var(--fc-radius-card)}
.w .gl{background:var(--fc-color-surface-raised)}
.w .who{display:flex;flex-direction:column;flex:1;min-width:0}
.w .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .who span{font-size:12px;color:var(--fc-color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .age{flex:none;font:500 11px/1 var(--fc-font-family-mono);color:var(--fc-color-status-warn)}
.tools{flex:none;display:flex;align-items:center;gap:8px}
.tools input{flex:1;min-width:0;height:32px;padding:0 10px;border-radius:var(--fc-radius-card);border:0;background:var(--fc-color-surface-raised);box-shadow:inset 0 0 0 1px var(--fc-color-line-button);font:inherit;color:inherit}
.tools input:focus{outline:0;box-shadow:inset 0 0 0 1px var(--fc-color-line-selected)}
.sw{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fc-color-text-muted)}
.sw i{position:relative;display:block;width:30px;height:18px;border-radius:var(--fc-radius-pill);background:var(--fc-color-surface-well);box-shadow:inset 0 0 0 1px var(--fc-color-line-button)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fc-color-text-subtle)}
.sw[aria-checked="true"] i{background:var(--fc-color-accent-base)}
.sw[aria-checked="true"] i::after{left:14px;background:var(--fc-color-accent-on)}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tree{display:flex;flex-direction:column;gap:1px}
.r{position:relative;display:flex;align-items:center;border-radius:var(--fc-radius-card)}
.r .tw{flex:none;display:grid;place-items:center;width:18px;height:28px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle);font-size:10px}
.r .tw.none{visibility:hidden}
.r .main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:40px;padding:3px 8px 3px 4px;border-radius:var(--fc-radius-card)}
.r .gl{position:relative;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.r .gl svg{display:block}
.r .two{display:flex;flex-direction:column;min-width:0;flex:1}
.r .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .name.chat{font-weight:600}
.r .sub{font-size:12px;line-height:1.3;color:var(--fc-color-text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .count{flex:none;font:11px/1 var(--fc-font-family-mono);color:var(--fc-color-text-subtle)}
.sub.ask,.sub.queued{color:var(--fc-color-status-warn)}
.sub.active{color:var(--fc-color-status-ok)}
.badge{position:absolute;right:-4px;bottom:-4px;display:none;place-items:center;width:13px;height:13px;border-radius:50%;font:700 9px/1 var(--fc-font-family-sans);border:2px solid transparent;box-sizing:content-box;margin:-2px}
.badge.ask{display:grid;background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on)}
.badge.queued{display:grid;background:var(--fc-color-status-warn-surface);color:var(--fc-color-status-warn);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.badge.active{display:grid;width:11px;height:11px;margin:-1px;border:2px solid var(--fc-color-accent-base);border-top-color:transparent;background:transparent;animation:spin 1100ms linear infinite}
.r.sel,.r.sel .main{background:var(--fc-color-surface-selected);box-shadow:inset 0 0 0 1px var(--fc-color-line-selected)}
.r.f .main{min-height:26px;gap:7px;padding:1px 8px 1px 2px}
.r.f .gl{width:14px;height:14px;background:transparent;border-radius:0}
.r.f .name{font:12px/1.3 var(--fc-font-family-mono)}
.r.f .tw{height:26px}
.gd{position:absolute;top:0;bottom:0;width:1px;background:var(--fc-color-line-button);pointer-events:none}
.go{flex:none;display:none;place-items:center;width:22px;height:22px;margin-right:4px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle);font-size:12px}
.r:hover .go,.r:focus-within .go,.r.sel .go{display:grid}
.note{padding:4px 8px;font-size:12px;color:var(--fc-color-text-subtle)}
.note.err{color:var(--fc-color-status-error)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<header class="head"><h1 id="ttl">Agents</h1><button class="chip hov" id="hide" type="button" aria-label="Hide the tree">Hide the tree</button></header>
<div class="split">

<div class="title"><span class="logo" id="logo"></span><span class="who"><b id="name"></b><span id="count"></span></span></div>

</div>
<div class="scroll"><div class="tree" id="tree" role="tree"></div><div class="note err" id="err" hidden></div></div>
</nav>

  $("name").textContent = n || "Agents";
  $("logo").innerHTML = ROBOT;
  $("count").textContent = st.tree ? (1 + totalBelow(st.tree)) + " agents" : "";
}
function paintWait() {
  var host = $("wait"); host.textContent = "";
  var rows = waitingRows(st.inq, nameMap(st.tree, {}), Date.now() / 1000);
  host.hidden = rows.length === 0;
  if (!rows.length) return;
  var h = el("h2", "", "Waiting for you"); h.appendChild(el("span", "pill", String(rows.length)));
  host.appendChild(h);
  rows.forEach(function (w) {
    var b = el("button", "w hov"); b.type = "button";
    b.appendChild(glyph(st.chats[w.asker] ? ROBOT : TOOL));
    var who = el("span", "who"); who.appendChild(el("b", "", w.who)); who.appendChild(el("span", "", w.text));
    b.appendChild(who); b.appendChild(el("span", "age", w.age));
    b.addEventListener("click", function () { select(w.asker); });
    host.appendChild(b);
  });
}
function foldButton(row, foldable, folded, onFold) {
  var tw = el("button", "tw" + (foldable ? " hov" : " none"), foldable ? (folded ? "▸" : "▾") : "");
  tw.type = "button";
  if (foldable) {
    tw.setAttribute("aria-label", (folded ? "Unfold " : "Fold ") + row.name);
    tw.setAttribute("aria-expanded", String(!folded));
    tw.addEventListener("click", function (e) { e.stopPropagation(); onFold(); });
  }
  return tw;
}
function agentRow(row) {
  var w = el("div", "r a" + (st.selected === row.id ? " sel" : ""));
  w.setAttribute("role", "treeitem"); w.dataset.id = row.id;
  w.style.paddingLeft = (row.depth * 14) + "px";
  w.appendChild(foldButton(row, row.foldable, row.folded, function () { st.folded[row.id] = !st.folded[row.id]; keep(); paint(); }));
  var b = el("button", "main hov"); b.type = "button"; b.title = row.id;
  var g = glyph(row.chat ? ROBOT : TOOL);
  if (row.state) g.appendChild(el("span", "badge " + row.state.kind, row.state.kind === "ask" ? "?" : ""));
  b.appendChild(g);
  var two = el("span", "two");
  two.appendChild(el("span", "name" + (row.chat ? " chat" : ""), row.name));
  var active = row.state && row.state.kind !== "idle";
  var sub = active ? row.state.label : row.tag;
  if (sub) two.appendChild(el("span", "sub" + (active ? " " + row.state.kind : ""), sub));
  b.appendChild(two);
  if (row.folded) b.appendChild(el("span", "count", String(row.below)));
  b.addEventListener("click", function () { select(row.id); });
  w.appendChild(b);
  return w;
}
function fileRow(row, base) {
  var w = el("div", "r f" + (st.selPath === row.path ? " sel" : ""));
  w.setAttribute("role", "treeitem"); w.dataset.path = row.path;
  w.style.paddingLeft = (row.depth * 14) + "px";
  for (var d = base + 1; d <= row.depth; d++) { var gd = el("span", "gd"); gd.style.left = (d * 14 - 1) + "px"; w.appendChild(gd); }
  w.appendChild(foldButton(row, row.dir, !row.open, function () { toggleDir(row.path); }));
  var b = el("button", "main hov"); b.type = "button"; b.title = row.path;
  b.appendChild(glyph(row.dir ? FOLDER : FILE));
  b.appendChild(el("span", "name", row.name));
  b.addEventListener("click", function () { if (row.dir) toggleDir(row.path); else selectPath(row.path); });
  w.appendChild(b);
  var go = el("button", "go hov", "↗"); go.type = "button"; go.title = "Open " + row.name + " on the canvas"; go.setAttribute("aria-label", "Open " + row.name + " on the canvas");
  go.addEventListener("click", function (e) { e.stopPropagation(); post({ type: row.dir ? "open_dir" : "open_file", path: row.path }); });
  w.appendChild(go);
  return w;
}
function paintTree() {
  var host = $("tree"); host.textContent = "";
  if (!st.tree) return;
  var rows = filterRows(treeRows(st.tree, st.chats, st.folded, st.status, askers(st.inq), { on: st.filesOn, lists: st.lists, open: st.open }), st.filter);
  var base = 0;
  rows.forEach(function (row) {
    if (row.kind === "file") host.appendChild(fileRow(row, base));
    else { if (row.id === FILES_ID) base = row.depth; host.appendChild(agentRow(row)); }
  });
  if (st.filesOn && st.lists[ROOT] === undefined) host.appendChild(el("div", "note", "reading the files…"));
}
function paintSwitch() { $("sw").setAttribute("aria-checked", String(st.filesOn)); }
function paint() { paintHead(); paintTree(); paintWait(); paintSwitch(); }

function toggleDir(path) {
  st.open[path] = !st.open[path];
  keep(); paint(); syncFiles();
}
function setFiles(on) {
  st.filesOn = on; keep(); paint(); syncFiles();
}
function readDir(path) {
  return call("files", { type: "list", path: path }).then(function (r) {
    if (failed(r)) { say("files: " + (r && r.error || "no answer")); return; }
    st.lists[path] = r.files || []; paintTree();
  });
}
// the files agent holds one watch per shown folder (its `watch_path`), and tells this view with `changed`
function syncFiles() {
  var want = wantedWatches(st.filesOn, st.open), have = Object.keys(watching);
  want.forEach(function (p) {
    if (watching[p]) return;
    watching[p] = true;
    call("files", { type: "watch_path", path: p });
    readDir(p);
  });
  have.forEach(function (p) {
    if (want.indexOf(p) >= 0) return;
    delete watching[p];
    call("files", { type: "unwatch_path", path: p });
  });
  if (st.filesOn && !filesWatch) {
    filesWatch = true;
    var timer = null, dirty = {};
    fantastic.watch("files", function (ev) {
      changedDirs(ev, st.lists).forEach(function (p) { dirty[p] = true; });
      if (timer !== null) return;
      timer = setTimeout(function () { timer = null; var ps = Object.keys(dirty); dirty = {}; ps.forEach(readDir); }, 150);
    });
  }
}
function refreshStatus() {
  var ids = Object.keys(st.chats);
  return Promise.all(ids.map(function (id) {
    return call(id, { type: "status" }).then(function (r) { if (!failed(r)) st.status[id] = r; else delete st.status[id]; });
  })).then(function () {
    return call("user", { type: "inquiries" });
  }).then(function (r) { st.inq = failed(r) ? [] : (r.inquiries || []); paintWait(); paintTree(); });
}
var watched = {};
function watchChats() {
  Object.keys(st.chats).forEach(function (id) {
    if (watched[id]) return; watched[id] = true;
    fantastic.watch(id, function (ev) { if (ev && !ev.error) refreshStatus(); });
  });
}
function refreshTree() {
  return Promise.all([
    call("kernel", { type: "reflect", detail: "full" }),
    call("kernel", { type: "reflect", handler_modules: ["ai_chat.tools"], tree: "ids" })
  ]).then(function (rs) {
    if (failed(rs[0])) { say("kernel reflect: " + (rs[0] && rs[0].error || "no answer")); return; }
    say("");
    st.root = rs[0]; st.tree = rs[0].tree && !Array.isArray(rs[0].tree) ? rs[0].tree : null;
    st.chats = failed(rs[1]) ? {} : chatSet(rs[1]);
    paintStrip(); paint(); watchChats();
  });
}
function tick() {
  if (st.busy) return; st.busy = true;
  var p = (st.tick++ % 2 === 0 ? refreshTree() : Promise.resolve()).then(refreshStatus);
  p.then(function () { st.busy = false; }, function () { st.busy = false; });
}
// the host sends what it kept of the last visit (`restore`), after this view says `ready`
fantastic.onMessage(function (m) {
  if (!m || m.type !== "restore") return;
  var r = restoredState(m.state);
  st.folded = r.folded; st.open = r.open; st.filesOn = r.filesOn;
  paint(); syncFiles();
});
$("hide").addEventListener("click", function () { post({ type: "hide_tree" }); });
$("sw").addEventListener("click", function () { setFiles(!st.filesOn); });
$("filter").addEventListener("input", function () { st.filter = $("filter").value; paintTree(); });
tick();
setInterval(tick, 5000);
post({ type: "ready" });
paint();
</script>
