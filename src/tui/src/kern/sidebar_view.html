<style>
:root{

--fc-color-line-strong:rgb(0 0 0 / 0.18);
--fc-color-status-error:rgb(179 38 30);
--fc-color-status-ok:rgb(27 116 70);
--fc-color-status-warn:rgb(143 82 0);
--fc-color-status-warn-field:rgb(255 255 255 / 0.6);
--fc-color-status-warn-line:rgb(143 82 0 / 0.45);

--fc-color-status-warn-on:rgb(255 255 255);
--fc-color-status-warn-surface:rgb(143 82 0 / 0.12);
--fc-color-surface-bubble:rgb(255 255 255 / 0.6);
--fc-color-surface-button:rgb(0 0 0 / 0.05);
--fc-color-surface-code:rgb(0 0 0 / 0.045);
--fc-color-surface-field:rgb(0 0 0 / 0.06);
--fc-color-surface-hover:rgb(0 0 0 / 0.09);
--fc-color-surface-raised:rgb(255 255 255 / 0.72);
--fc-color-surface-well:rgb(0 0 0 / 0.06);
--fc-color-text-code:rgb(69 69 69);
--fc-color-text-cool:rgb(69 69 69);
--fc-color-text-muted:rgb(69 69 69);
--fc-color-text-primary:rgb(11 11 11);
--fc-color-text-subtle:rgb(107 107 107);
--fc-duration-pulse:1400ms;
--fc-duration-think:1100ms;
--fc-easing-in-out:cubic-bezier(0.42, 0, 0.58, 1);
--fc-font-family-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
--fc-font-family-sans:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
--fc-radius-bubble:12px;
--fc-radius-card:8px;
--fc-radius-chip:4px;
--fc-radius-control:6px;
--fc-radius-key:5px;
--fc-radius-panel:10px;
--fc-radius-pill:999px;
--fc-shadow-bubble:inset 0px 0px 0px 1px rgb(0 0 0 / 0.07);

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:transparent;color:var(--fc-color-text-primary);font:13px/1.45 var(--fc-font-family-sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--fc-color-accent-base);outline-offset:1px}
.hov:hover{background:var(--fc-color-surface-hover)}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 8px 0 12px;border-bottom:1px solid var(--fc-color-line-button)}
.head h1{margin:0;font:600 11px/1 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;height:20px;padding:0 8px;border-radius:var(--fc-radius-key);background:var(--fc-color-surface-button);box-shadow:inset 0 0 0 1px var(--fc-color-line-button);font-size:11px;line-height:20px;color:var(--fc-color-text-muted)}
.cols{flex:1 1 0;min-height:0;display:flex}
.rail{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;padding:10px 0;border-right:1px solid var(--fc-color-line-button);scrollbar-width:none}
.k{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:3px 0;border-radius:var(--fc-radius-control)}
.k .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--fc-radius-card);font:600 11px/1 var(--fc-font-family-mono);text-transform:uppercase;background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.k.here .mark{background:var(--fc-color-accent-base);color:var(--fc-color-accent-on)}
.k .nm{max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--fc-color-text-muted)}
.k.here .nm{color:var(--fc-color-text-primary);font-weight:600}
.scroll{flex:1 1 0;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:12px 8px 8px;display:flex;flex-direction:column;gap:14px}
.title{display:flex;align-items:center;gap:10px;padding:0 4px}
.title .tile{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--fc-radius-card);background:var(--fc-color-accent-weak);color:var(--fc-color-text-primary);font:600 11px/1 var(--fc-font-family-mono);text-transform:uppercase}
.title .tx{display:flex;flex-direction:column;min-width:0}
.title b{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title span{font-size:11px;color:var(--fc-color-text-subtle)}
.wait{display:flex;flex-direction:column;gap:2px;padding:8px 4px 4px;border-radius:var(--fc-radius-panel);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.wait[hidden]{display:none}
.wait h2{display:flex;align-items:center;gap:8px;margin:0;padding:0 8px 4px;font:600 11px/1.4 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-status-warn)}
.wait h2 .n{padding:0 6px;border-radius:var(--fc-radius-pill);background:var(--fc-color-status-warn);color:var(--fc-color-status-warn-on);letter-spacing:0}
.w{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:5px 8px;border-radius:var(--fc-radius-card)}
.w .gl{background:var(--fc-color-surface-raised)}
.w .who{display:flex;flex-direction:column;flex:1;min-width:0}
.w .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .who span{font-size:12px;color:var(--fc-color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .age{flex:none;font:500 11px/1 var(--fc-font-family-mono);color:var(--fc-color-status-warn)}
.tools{display:flex;align-items:center;gap:8px}
.q{flex:1;min-width:0;height:32px;padding:0 10px;border:0;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-raised);box-shadow:inset 0 0 0 1px var(--fc-color-line-button);color:var(--fc-color-text-primary);font:inherit}
.q:focus-visible{outline:none;box-shadow:var(--fc-shadow-focus)}
.sw{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fc-color-text-muted)}
.sw .track{position:relative;width:30px;height:18px;border-radius:var(--fc-radius-pill);background:var(--fc-color-surface-well);box-shadow:inset 0 0 0 1px var(--fc-color-line-button)}
.sw .track i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fc-color-text-subtle)}
.sw[aria-checked="true"] .track{background:var(--fc-color-accent-base)}
.sw[aria-checked="true"] .track i{left:14px;background:var(--fc-color-accent-on)}
.tree{display:flex;flex-direction:column;gap:1px}
.r{display:flex;align-items:center;border-radius:var(--fc-radius-card)}
.r .tw{flex:none;display:grid;place-items:center;width:18px;height:28px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle);font-size:10px}
.r .tw.none{visibility:hidden}
.r .main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:40px;padding:3px 8px 3px 4px;border-radius:var(--fc-radius-card)}
.r .gl,.w .gl{position:relative;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--fc-radius-card);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.r .gl svg,.w .gl svg{display:block}
.r .name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .name.chat{font-weight:600}
.r .tag{flex:none;font:10px/15px var(--fc-font-family-mono);padding:0 5px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-muted);background:var(--fc-color-surface-well);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sp{flex:1}
.r .count{flex:none;font:11px/1 var(--fc-font-family-mono);color:var(--fc-color-text-subtle)}
.r .st{flex:none;font:11px/1 var(--fc-font-family-mono);color:var(--fc-color-text-subtle);white-space:nowrap}
.r .go{flex:none;display:none;place-items:center;width:22px;height:22px;margin-right:4px;border-radius:var(--fc-radius-chip);color:var(--fc-color-text-subtle);font-size:12px}
.r:hover .go,.r .go:focus-visible{display:grid}
.badge{position:absolute;right:-4px;bottom:-4px;display:none;place-items:center;width:13px;height:13px;border-radius:50%;font:700 9px/1 var(--fc-font-family-sans);border:2px solid var(--fc-color-accent-on);box-sizing:content-box;margin:-2px}

.badge.queued{display:grid;background:var(--fc-color-status-warn-surface);color:var(--fc-color-status-warn)}
.badge.active{display:grid;width:11px;height:11px;margin:-1px;border:2px solid var(--fc-color-accent-base);border-top-color:transparent;background:transparent;animation:spin 1100ms linear infinite}
.r.sel,.r.sel .main{background:var(--fc-color-accent-weak);box-shadow:inset 0 0 0 1px var(--fc-color-accent-line)}
.st.ask{color:var(--fc-color-status-warn)}
.st.active{color:var(--fc-color-accent-base)}
.st.queued{color:var(--fc-color-status-warn)}
.r.f .main{min-height:26px}
.r.f .name{font:12px/1.3 var(--fc-font-family-mono)}
.r.f .gl{width:22px;height:22px;border-radius:var(--fc-radius-control);background:transparent}
.r.f .name.dir{font-weight:600}
.r.drag .main{cursor:grab}
.note{padding:4px 8px;font-size:12px;color:var(--fc-color-text-subtle)}
.note.err{color:var(--fc-color-status-error)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

    if (!k.here) b.addEventListener("click", function () { tell({ type: "select_kernel", guid: k.guid }); });
    host.appendChild(b);
  });
}
function paintTitle() {
  $("ttl").textContent = "Agents";
  var host = $("title"); host.textContent = "";
  var name = titleOf(st.root);
  host.appendChild(el("span", "tile", markOf(name)));
  var tx = el("span", "tx"); tx.appendChild(el("b", "", name));
  var n = agentCount(st.tree); tx.appendChild(el("span", "", n + (n === 1 ? " agent" : " agents")));
  host.appendChild(tx);
}
function nameMap(n, out) { if (n && typeof n.id === "string") { out[n.id] = String(n.display_name || n.id); (n.children || []).forEach(function (k) { nameMap(k, out); }); } return out; }
function glyph(inner) { var g = el("span", "gl"); g.innerHTML = inner; return g; }
function paintWait() {
  var host = $("wait"); host.textContent = "";
  var rows = waitingRows(st.inq, nameMap(st.tree, {}), Date.now() / 1000);
  host.hidden = rows.length === 0;
  if (!rows.length) return;
  var h = el("h2", "", "Waiting for you"); h.appendChild(el("span", "n", String(rows.length)));
  host.appendChild(h);
  rows.forEach(function (w) {
    var b = el("button", "w hov"); b.type = "button";
    b.appendChild(glyph(ROBOT));
    var who = el("span", "who"); who.appendChild(el("b", "", w.who)); who.appendChild(el("span", "", w.text));
    b.appendChild(who); b.appendChild(el("span", "age", w.age));
    b.addEventListener("click", function () { select(w.asker); });
    host.appendChild(b);
  });
}
function foldBox(cls, fold, label, onFold) {
  var w = el("div", cls);
  var tw = el("button", "tw" + (fold === null ? " none" : " hov"), fold === null ? "" : fold ? "▸" : "▾");
  tw.type = "button";
  if (fold !== null) { tw.setAttribute("aria-label", label); tw.addEventListener("click", function (e) { e.stopPropagation(); onFold(); }); }
  else tw.tabIndex = -1;
  w.appendChild(tw);
  return w;
}
// a row can be dragged out onto the canvas: the drop is a message (no drop point), the canvas places it as its `open` does
function draggable(w, item, label) {
  w.draggable = true; w.className += " drag";
  w.addEventListener("dragstart", function (e) { try { e.dataTransfer.setData("text/plain", label); e.dataTransfer.effectAllowed = "copy"; } catch (x) { /* no data transfer */ } });
  w.addEventListener("dragend", function (e) { if (droppedOutside(e.clientX, e.clientY, innerWidth, innerHeight)) tell({ type: "open_on_canvas", items: [item] }); });
}
function agentRow(row) {
  var w = foldBox("r" + (st.selected === row.id ? " sel" : ""), row.kids > 0 ? row.folded : null, foldLabel(row.name, row.folded), function () { st.folded[row.id] = !st.folded[row.id]; keep(); paintTree(); });
  w.style.paddingLeft = (row.depth * 14) + "px";
  var b = el("button", "main hov"); b.type = "button"; b.title = row.id;
  var g = glyph(row.chat ? ROBOT : TOOL);
  if (row.state) g.appendChild(el("span", "badge " + row.state.kind, row.state.kind === "ask" ? "?" : ""));
  b.appendChild(g);
  b.appendChild(el("span", "name" + (row.chat ? " chat" : ""), row.name));
  if (row.tag) b.appendChild(el("span", "tag", row.tag));
  b.appendChild(el("span", "sp"));
  if (row.folded) b.appendChild(el("span", "count", String(row.below)));
  if (row.state && row.state.kind !== "idle") b.appendChild(el("span", "st " + row.state.kind, row.state.label));
  b.addEventListener("click", function () { select(row.id); });
  w.appendChild(b);
  draggable(w, { kind: "agent", id: row.id }, row.name);
  return w;
}
function fileRow(row) {
  var w = foldBox("r f" + (st.selected === row.path ? " sel" : ""), row.dir ? !row.open : null, foldLabel(row.name, !row.open), function () { toggleDir(row.path); });
  w.style.paddingLeft = (row.depth * 14) + "px";
  var b = el("button", "main hov"); b.type = "button"; b.title = row.path;
  b.appendChild(glyph(row.dir ? FOLDER : FILE));
  b.appendChild(el("span", "name" + (row.dir ? " dir" : ""), row.name));
  b.addEventListener("click", function () { row.dir ? toggleDir(row.path) : openFile(row.path); });
  w.appendChild(b);
  if (row.dir) {
    var go = el("button", "go hov", "↗"); go.type = "button"; go.title = "Open " + row.name + " on the canvas"; go.setAttribute("aria-label", "Open " + row.name + " on the canvas");
    go.addEventListener("click", function () { openDir(row.path); });
    w.appendChild(go);
  }
  draggable(w, { kind: row.dir ? "dir" : "file", path: row.path }, row.path);
  return w;
}
function paintTree() {
  var host = $("tree"); host.textContent = "";
  if (!st.tree) return;
  visibleRows(st.tree, st.chats, st.folded, st.status, askers(st.inq), { on: st.filesOpen, lists: st.lists, open: st.open }, st.q).forEach(function (row) {
    if (row.kind === "note") { var n = el("div", "note", row.name); n.style.paddingLeft = (row.depth * 14 + 22) + "px"; host.appendChild(n); }
    else host.appendChild(row.kind === "agent" ? agentRow(row) : fileRow(row));
  });
}
function paintSwitch() { $("sw").setAttribute("aria-checked", String(st.filesOpen)); }

// the files: a folder is listed when it opens, and read again when the files agent says it changed
function readDir(path) {
  return call("files", { type: "list", path: path }).then(function (r) {
    if (failed(r)) { say("files: " + (r && r.error || "no answer")); return; }
    st.lists[path] = r.files || []; paintTree();
  });
}
function syncWatches() {
  var want = {}; wantedDirs(st.filesOpen, st.open).forEach(function (p) { want[p] = true; });
  Object.keys(want).forEach(function (p) { if (!st.held[p]) { st.held[p] = true; call("files", { type: "watch_path", path: p }); readDir(p); } });
  Object.keys(st.held).forEach(function (p) { if (!want[p]) { delete st.held[p]; call("files", { type: "unwatch_path", path: p }); } });
}
function toggleDir(path) { st.open[path] = !st.open[path]; if (!st.open[path]) delete st.open[path]; keep(); paintTree(); syncWatches(); }
function openFile(path) {
  st.selected = path; paintTree();
  call("files", { type: "open_view", kind: "file", path: path }).then(function (r) {
    if (failed(r)) { say("open " + path + ": " + (r && r.error || "no answer")); return; }
    tell({ type: "open_file", path: path, id: typeof r.id === "string" ? r.id : "" });
  });
}
function openDir(path) {
  call("files", { type: "open_view", kind: "folder", path: path }).then(function (r) {
    if (failed(r)) { say("open " + path + ": " + (r && r.error || "no answer")); return; }
    tell({ type: "open_dir", path: path, id: typeof r.id === "string" ? r.id : "" });
  });
}
fantastic.watch("files", function (ev) {
  if (!ev || ev.error || ev.type !== "changed") return;
  affectedDirs(wantedDirs(st.filesOpen, st.open), ev.path).forEach(readDir);
});

function refreshStatus() {
  var ids = Object.keys(st.chats);
  return Promise.all(ids.map(function (id) {
    return call(id, { type: "status" }).then(function (r) { if (!failed(r)) st.status[id] = r; else delete st.status[id]; });
  })).then(function () {
    return call("user", { type: "inquiries" });
  }).then(function (r) { st.inq = failed(r) ? [] : (r.inquiries || []); paintWait(); paintTree(); });
}
var watched = {};
function watchChats() {
  Object.keys(st.chats).forEach(function (id) {
    if (watched[id]) return; watched[id] = true;
    fantastic.watch(id, function (ev) { if (ev && !ev.error) refreshStatus(); });
  });
}
function refreshTree() {
  return Promise.all([
    call("kernel", { type: "reflect", detail: "full" }),
    call("kernel", { type: "reflect", handler_modules: ["ai_chat.tools"], tree: "ids" })
  ]).then(function (rs) {
    if (failed(rs[0])) { say("kernel reflect: " + (rs[0] && rs[0].error || "no answer")); return; }
    say("");
    st.root = rs[0]; st.tree = rs[0].tree && !Array.isArray(rs[0].tree) ? rs[0].tree : null;
    st.chats = failed(rs[1]) ? {} : chatSet(rs[1]);
    paintStrip(); paintTitle(); paintTree(); watchChats();
  });
}
// the agents and the asks are polled (their events are the chats' own); the files are not: they are watched
function tick() {
  if (st.busy) return; st.busy = true;
  var p = (st.tick++ % 2 === 0 ? refreshTree() : Promise.resolve()).then(refreshStatus);
  p.then(function () { st.busy = false; }, function () { st.busy = false; });
}
// the host gives back what it kept of the last visit (the canvas does; a page without a keeper does not)
fantastic.onMessage(function (m) {
  if (!m || m.type !== "restore") return;
  var s = cleanState(m.state);
  st.folded = s.folded; st.open = s.open; st.filesOpen = s.filesOpen;
  paintSwitch(); paintTree(); syncWatches();
});
$("hide").addEventListener("click", function () { tell({ type: "hide" }); });
$("sw").addEventListener("click", function () { st.filesOpen = !st.filesOpen; paintSwitch(); keep(); paintTree(); syncWatches(); });
$("q").addEventListener("input", function (e) { st.q = e.target.value; paintTree(); });
paintSwitch();
tick();
setInterval(tick, 5000);
tell({ type: "ready" });
</script>
