# WHAT to measure and HOW LONG to allow — never a model or an endpoint. Scripted: no model.
id: reload_backlog
group: canvas
title: "page reloads leave no unacked output behind: a busy terminal reloaded many times keeps drawing, its PTY never pauses"
runner: probe.py
costs: free
limits:
  seconds: 120
env: {}
# the peaks are a measure of the machine (a whole suite at 200 lanes pushed the first reloads past the bound, alone it peaks near 12000)
solo: true
