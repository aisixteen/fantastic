# WHAT to measure and HOW LONG to allow — never a model or an endpoint (the
# plug names those). Scripted: no model.
id: hydrate_scale
group: canvas
title: "a 300-cell canvas loads within the bound"
runner: probe.py
costs: free
solo: true   # measures a time bound: runs alone (e2e/run.py)
limits:
  render_seconds: 40
env: {}
