[package]
name = "fantastic-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false
description = "Aisixteen Fantastic — the kernel as a terminal shell. Thin: no agentic logic lives here."

# THE LIBRARY (#248): the whole shell, so another binary (aisixteen/fantastic_shift)
# embeds it and adds its own bundles — `fantastic_tui::main_with(args, extras)`.
# `fantastic` (below) is that library with no extras.
[lib]
name = "fantastic_tui"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fantastic"
path = "src/main.rs"

# ── render ───────────────────────────────────────────────────────────────────
[dependencies]
ratatui = { version = "0.30", features = ["serde"] }
# DIRECT crossterm: the ratatui re-export carries no `event-stream` passthrough.
# 0.29 is what ratatui 0.30 resolves to, so feature unification yields ONE crossterm.
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
futures-util = "0.3"
unicode-width = "0.2"

# ── plumbing ─────────────────────────────────────────────────────────────────
tokio = { version = "1.40", features = [
  "rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
serde_yaml = "0.9"
tokio-util = "0.7"

# ── the kernel, IN-PROCESS ───────────────────────────────────────────────────
# This shell hosts the rust kernel directly: no child process, no port, no
# socket. Path deps into the kernel workspace, which stays a SEPARATE workspace
# (src/Cargo.toml excludes `lib`), so these resolve as plain non-member path
# dependencies and the kernel's own lockfile is untouched.
#
# None of the five declares a cargo feature, so there is nothing to enable here:
# the `full` / `scenario-probes` gates live in fantastic-cli's manifest, not in
# the bundle crates.
fantastic-kernel = { path = "../lib/rust/crates/fantastic-kernel" }
# The ROOT's own bundle (`kernel_state.tools`). Its boot is what rehydrates the
# ledger and installs the flusher, the message pump and the record writer —
# without it the tree lives in RAM and nothing a session creates survives.
fantastic-core = { path = "../lib/rust/crates/bundles/fantastic-core" }
fantastic-web-ws = { path = "../lib/rust/crates/bundles/fantastic-web-ws" }
fantastic-file = { path = "../lib/rust/crates/bundles/fantastic-file" }
fantastic-exec-bridge = { path = "../lib/rust/crates/bundles/fantastic-exec-bridge" }
# The MCP leg — a bundle built HERE, outside the kernel tree, against the
# kernel's public API only. Compile-time linked; `src/lib` is not edited.
fantastic-web-mcp = { path = "bundles/fantastic-web-mcp" }
fantastic-user = { path = "bundles/fantastic-user" }
# THE MACHINE'S AGENTS (`fantastic [canvas] system`, Linux): power so far.
fantastic-system-agents = { path = "bundles/fantastic-system-agents" }
fantastic-system = { path = "crates/fantastic-system" }
fantastic-sqlite-store = { path = "bundles/fantastic-sqlite-store" }
fantastic-ram-store = { path = "../lib/rust/crates/bundles/fantastic-ram-store" }
# THE AI AGENT'S SAVED SET-UPS: named agent blueprints in the home dir (FANTASTIC_HOME
# or ~/.fantastic), owned by this binary — see kern/saved.
fantastic-user-home-store = { path = "bundles/fantastic-user-home-store" }
getrandom = "0.2"
fantastic-canvas-page = { path = "bundles/fantastic-canvas-page" }
# THE BROWSER VIEW: the kernel's HTTP host, and the socket leg built HERE.
fantastic-web = { path = "../lib/rust/crates/bundles/fantastic-web" }
# THE MANAGER'S MODEL: its run file's path is defined there, once (`kern/web.rs`).
fantastic-home = { path = "crates/fantastic-home" }
# The terminal pane's screen: a real vt100 emulator, so a full-screen CLI
# (an AI coder, an editor) draws correctly instead of as a line log.
vt100 = "0.15"
# KEYS: every provider key lives in the kernel's credential store (a ref bound to
# one host, written and read with secret marks); the user's key mode picks its
# backend — a 0600 file or the keychain (`kern/creds`).
fantastic-credential-store = { path = "../lib/rust/crates/bundles/fantastic-credential-store" }
fantastic-responses-backend = { path = "../lib/rust/crates/bundles/fantastic-responses-backend", optional = true }
fantastic-py-agent = { path = "../lib/rust/crates/bundles/fantastic-py-agent" }
# A master AI opens cabinets: subcanvases, each with one worker AI (the canvas's panels).
fantastic-cabinet = { path = "../lib/rust/crates/bundles/fantastic-cabinet" }
# one remote MCP server as an agent: its tools are its verbs (the canvas's "MCP server")
fantastic-mcp-client = { path = "../lib/rust/crates/bundles/fantastic-mcp-client" }
fantastic-vllm-backend = { path = "../lib/rust/crates/bundles/fantastic-vllm-backend", optional = true }
fantastic-ollama-backend = { path = "../lib/rust/crates/bundles/fantastic-ollama-backend", optional = true }
fantastic-anthropic-backend = { path = "../lib/rust/crates/bundles/fantastic-anthropic-backend", optional = true }
# Apple's on-device model (macOS 26+ Apple Intelligence): built from the lib's
# Swift core by its build.rs — needs the Xcode toolchain and
# MACOSX_DEPLOYMENT_TARGET >= 14 (src/.cargo/config.toml).
fantastic-foundation-models-backend = { path = "../lib/rust/crates/bundles/fantastic-foundation-models-backend", optional = true }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# ── the OS surface (`src/sys`) ───────────────────────────────────────────────
# dup2, to get the kernel's own stdout prints off the screen the TUI draws on.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The std handles pointed at the kernel log, and the console's UTF-8 code page.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Console",
] }

[features]
# The base binary reaches any model: the four AI backends are linked by default.
# Each stays a feature, so an embedder can build lean with --no-default-features.
default = ["vllm", "anthropic", "ollama", "responses"]
# Links the OpenAI Responses backend (`responses_backend.tools`): `endpoint` (the
# full …/v1/responses URL) and `model` are written on the set-up page — no
# default; its key is a credential-store ref (required).
responses = ["dep:fantastic-responses-backend"]
# Links the vLLM backend (`vllm_backend.tools`): its record — endpoint, model,
# max_tokens, kv_slots, kv_overflow required — is written on the set-up page
# from its schema; a key is optional (a credential-store ref).
vllm = ["dep:fantastic-vllm-backend"]
# Links the Ollama backend (`ollama_backend.tools`): `fantastic ai ollama -p PORT`.
ollama = ["dep:fantastic-ollama-backend"]
# Links the Anthropic Messages backend (`anthropic_backend.tools`): `fantastic ai anthropic --model M`.
anthropic = ["dep:fantastic-anthropic-backend"]
# Links Apple's on-device model (`foundation_models_backend.tools`): no endpoint,
# model or key.
foundation-models = ["dep:fantastic-foundation-models-backend"]

# ── headful e2e: the PTY + vt100 screenshot rig (dev only; the shell itself
# never links a PTY — the terminal PANEL renders a remote stream in step 10).
[dev-dependencies]
portable-pty = "0.8"

[[example]]
name = "screenshot"
path = "e2e/screenshot.rs"
