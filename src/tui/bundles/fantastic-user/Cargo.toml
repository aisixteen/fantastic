[package]
name = "fantastic-user"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "`user` — the one human, as an agent (`user.tools`): every call the terminal and the canvas make goes out through it (`forward`), `around` from the page records, and the probe's own verbs."

# Outside `src/lib`, like the MCP leg: only the kernel's public surface.
[dependencies]
fantastic-kernel = { path = "../../../lib/rust/crates/fantastic-kernel" }
fantastic-core = { path = "../../../lib/rust/crates/bundles/fantastic-core" }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["sync", "time", "process", "rt"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
