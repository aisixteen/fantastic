[package]
name = "fantastic-user-home-store"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The user's SAVED SET-UP store (`user_home_store.tools`): named agent-record blueprints in the user's home dir (~/.fantastic), owned by the CLI — never pluggable into an agent, never located by a record."

# CLI-project scope, not the lib: an ordinary agent bundle built against the
# kernel's public API. `src/lib` is not edited.
[dependencies]
fantastic-kernel = { path = "../../../lib/rust/crates/fantastic-kernel" }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"

# `sys::windows` — the private-file contract as DACLs: the token's SIDs, a
# descriptor from SDDL for a private create, the owner and DACL of a handle.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
