[package]
name = "fantastic-sqlite-store"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The DURABLE memory store agent (`sqlite_store.tools`): ram_store's tables, keys, cascades and verbs over one SQLite file per store — a 1:1 mirror a caller cannot tell apart, except that it survives the process."

# CLI-project scope, not the lib: an ordinary agent bundle built against the
# kernel's public API. `src/lib` is not edited.
[dependencies]
fantastic-kernel = { path = "../../../lib/rust/crates/fantastic-kernel" }
fantastic-bundle = { path = "../../../lib/rust/crates/fantastic-bundle" }
async-trait = "0.1"
serde_json = "1"
# `bundled`: SQLite compiled in (FTS5 included) — no system library to guess at.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
fantastic-ram-store = { path = "../../../lib/rust/crates/bundles/fantastic-ram-store" }
fantastic-ai-core = { path = "../../../lib/rust/crates/bundles/fantastic-ai-core" }
futures-util = "0.3"
tempfile = "3"
