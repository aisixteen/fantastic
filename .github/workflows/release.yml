# RELEASE — run BY HAND on a pushed tag `vX.Y.Z`
# (`gh workflow run release.yml --ref vX.Y.Z`, src/lib/rust/RELEASING.md); the
# tag push itself starts nothing. It builds nothing: it publishes the archives a
# GREEN FULL `ci.yml` run built and tested for the tagged commit — every release
# target, the model-free e2e passed on the very binaries — as a GitHub Release
# with `SHA256SUMS`.
#
#   guard    the ref is a `vX.Y.Z` tag on `main`, CHANGELOG.md has its
#            `## [X.Y.Z]` section, and a FULL `ci.yml` run (`ci · full`) on that
#            commit succeeded — a units-only run built no archives
#            (none → start one: `gh workflow run ci.yml --ref vX.Y.Z -f e2e=true`)
#   publish  that run's archives + SHA256SUMS, the CHANGELOG section as the notes
#
# crates.io is NOT published here: that stays a local step with a local token
# (`scripts/build/crate.sh --publish`). No registry token is stored on GitHub.

name: release

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run the optional cleanup steps (rust-cache target clean and cache save, uv cache prune). Off: skipped, the runner is thrown away."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ci_run: ${{ steps.v.outputs.ci_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: the tag is a release, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [ "$GITHUB_REF_TYPE" = tag ] && [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::run it on a vX.Y.Z tag (--ref vX.Y.Z), not '$tag'"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId,displayTitle \
            --jq '[.[] | select(.displayTitle == "ci · full")][0].databaseId // empty')
          [ -n "$run" ] \
            || { echo "::error::no green full ci.yml run on $GITHUB_SHA — start one: gh workflow run ci.yml --ref $tag -f e2e=true"; exit 1; }
          echo "ci run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ci_run=$run" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ needs.guard.outputs.ci_run }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: every release target is there
        working-directory: dist
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl \
                   aarch64-unknown-linux-musl x86_64-pc-windows-msvc; do
            ls fantastic-$t.* > /dev/null \
              || { echo "::error::the CI run kept no archive for $t"; exit 1; }
          done
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum fantastic-* > SHA256SUMS
          cat SHA256SUMS
      - name: the notes — this version's CHANGELOG section
        run: |
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n\nCI run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ needs.guard.outputs.ci_run }}" >> notes.md
          cat notes.md
      - name: the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fantastic-* dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
