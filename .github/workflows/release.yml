# RELEASE — pushing a tag `vX.Y.Z` (src/lib/rust/RELEASING.md) builds the
# `fantastic` CLI for every release target, runs the model-free e2e on those
# binaries, and publishes a GitHub Release with the archives and `SHA256SUMS`.
#
#   guard    the tag is on `main`, and CHANGELOG.md has its `## [X.Y.Z]` section
#   build    the reusable BUILD (`build.yml`): {release, e2e, artifacts}
#   publish  the archives + SHA256SUMS, the CHANGELOG section as the notes
#
# crates.io is NOT published here: that stays a local step with a local token
# (`scripts/build/crate.sh --publish`). No registry token is stored on GitHub.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: the tag is a release
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    uses: ./.github/workflows/build.yml
    with:
      profile: release
      e2e: true
      artifacts: true

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum fantastic-* > SHA256SUMS
          cat SHA256SUMS
      - name: the notes — this version's CHANGELOG section
        run: |
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fantastic-* dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
