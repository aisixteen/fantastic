# fantastic OS, the kiosk (`kiosk/`): its own crate on the fantastic base, built and
# tested on its own. The base's workflows build without it and name nothing of it.
name: kiosk

on:
  pull_request:
    paths:
      - "kiosk/**"
      - ".github/workflows/kiosk.yml"
  push:
    branches: [main]
    paths:
      - "kiosk/**"
      - ".github/workflows/kiosk.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The base's canvas packer provisions its pinned esbuild with this toolchain.
  GO_VERSION: "1.23.4"
  NODE_VERSION: "24"

jobs:
  units:
    name: kiosk units
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiosk
      - name: build
        run: cargo build --workspace
      - name: unit tests
        run: cargo test --workspace --no-fail-fast
      - name: the lock screen and tile size (pure TypeScript)
        run: node --test "src/canvas/tests/*.test.ts" "src/lock/canvas/tests/*.test.ts"

  # the system agents on a fake bus: dbus-daemon is on the runner, dbusmock is not
  system-agents:
    name: system agents (fake bus)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiosk
          key: system-agents
      - name: system agents on a fake bus
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q python3-dbusmock
          cargo test -p fantastic-system-agents -- --ignored
