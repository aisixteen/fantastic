# CI — run BY HAND only (`gh workflow run ci.yml --ref <branch>`, or the Actions
# tab's "Run workflow"). Nothing starts it — no push, no PR, no tag (owner
# 2026-10-20: the runners are shared, so ready branches are BATCHED: merged into
# a temporary `ci/batch-<n>` branch and run once). A newer run of the same ref
# cancels the older one. Two sizes:
#
#   units only (default)   a bug fix: every runtime's unit tests, debug, on
#                          Linux, macOS and Windows (`-f units_os=linux`: on
#                          Linux only, for a quick check; a full run always
#                          covers all three)
#   full (`-f e2e=true`)   a completed phase or a release: the units, plus
#                          every release target's archive, the model-free
#                          e2e on those binaries, and the fantastic OS image
#                          booted in QEMU
#
# The reusable BUILD (`build.yml`) is called up to four times:
#
#   units     debug    every runtime's unit tests on Linux, macOS and Windows
#                      (`units_os`: Linux only when `units_os=linux`, unless
#                      the run is full)
#   binaries  release  every release target's archive (`release-<target>`),
#                      per OS the binaries the e2e runs, and the desktop app
#                      (`app-<triple>`) — side by side with units (full runs only)
#   e2e       release  the model-free e2e (`e2e/run.py --only-free`, no model
#                      turns), and the desktop app's e2e, on exactly those
#                      binaries — ONLY once every unit
#                      suite passed and every binary built: a red unit test stops
#                      the run before the e2e starts (full runs only)
#   os        release  fantastic OS (Phase 9): the app's .deb and
#                      `fantastic-session` from those binaries, the Debian
#                      kiosk image of them, and its boot in QEMU. Beside the
#                      e2e: it neither gates them nor waits for them (full
#                      runs only)
#   container release  the fantastic server's image (Phase 12, #158), amd64 and
#                      arm64 on native runners, smoke-tested under Docker and
#                      rootless Podman (`os/ci/container_check.py`). Beside the
#                      e2e, the same way: full runs only
#
# The run's title says which it was (`ci · units` / `ci · full`). A green FULL
# run is what `release.yml` publishes for its commit.
#
# Free: standard GitHub-hosted runners on a public repo (see `build.yml`).

name: ci
run-name: ${{ inputs.e2e && 'ci · full' || 'ci · units' }}

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Full run — also build every release binary and run the e2e (a completed phase, a release). Off: the unit suites only (a bug fix)."
        type: boolean
        default: false
      units_os:
        description: "The units' OS set. all (default): Linux, macOS and Windows. linux: Linux only, for a quick check. A full run (e2e) always runs the units on all three."
        type: choice
        options: [all, linux]
        default: all
      cleanup:
        description: "Run the optional cleanup steps (rust-cache target clean and cache save, uv cache prune, image removal). Off: skipped, the runner is thrown away."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  units:
    uses: ./.github/workflows/build.yml
    with:
      cleanup: ${{ inputs.cleanup }}
      profile: debug
      units: true
      # a full run keeps every OS, whatever units_os says
      units_os: ${{ inputs.e2e && 'all' || inputs.units_os }}

  binaries:
    if: inputs.e2e
    uses: ./.github/workflows/build.yml
    with:
      cleanup: ${{ inputs.cleanup }}
      profile: release
      binaries: true

  e2e:
    if: inputs.e2e
    needs: [units, binaries]
    uses: ./.github/workflows/build.yml
    with:
      cleanup: ${{ inputs.cleanup }}
      profile: release
      e2e: true

  os:
    if: inputs.e2e
    needs: [binaries]
    uses: ./.github/workflows/build.yml
    with:
      cleanup: ${{ inputs.cleanup }}
      profile: release
      os: true

  # The fantastic server's image (Phase 12, #158): the same Containerfile on both
  # architectures, built on the native free runners (no emulation), and the same
  # smoke test under Docker and under rootless Podman. Beside the e2e: it gates
  # nothing, and it needs only the release binaries of its own architecture.
  # The image is kept as an artifact (container-image-<arch>: the docker save and
  # its id). publish-container.yml pushes those tested bytes; nothing is published
  # from here.
  container:
    if: inputs.e2e
    needs: [binaries]
    name: container · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # container.sh reads the version from the last tag
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: ${{ inputs.cleanup }}
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the check's python (websockets)
        run: (cd src/lib/python && uv sync --locked)
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: rootless Podman
        # the runner's user is not root: rootless needs unprivileged user
        # namespaces, which Ubuntu 24.04 restricts by AppArmor (as the e2e's Chrome)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q podman
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          podman info --format '{{.Host.Arch}} rootless={{.Host.Security.Rootless}}'
      - name: the image, built with Docker
        # one build feeds both smoke tests: Docker's image is copied to Podman below
        run: ENGINE=docker sh scripts/build/container.sh --arch ${{ matrix.arch }} --tag fantastic-server:ci
      - name: the image's platform and labels
        run: |
          docker image inspect fantastic-server:ci --format 'platform={{.Os}}/{{.Architecture}} version={{index .Config.Labels "org.opencontainers.image.version"}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect fantastic-server:ci --format '{{.Architecture}}' | grep -qx '${{ matrix.arch }}'
      - name: keep the tested image (publish pushes these bytes, not a rebuild)
        # the image's id and its docker save: publish-container.yml loads this tar,
        # checks the id, and pushes it; the smoke tests below run on the same image
        run: |
          mkdir -p container-image
          docker image inspect fantastic-server:ci --format '{{.Id}}' > container-image/image-id.txt
          docker save -o container-image/image.tar fantastic-server:ci
          ls -l container-image
      - name: smoke test, Docker
        run: uv run --project src/lib/python python os/ci/container_check.py --engine docker --image fantastic-server:ci --arch ${{ matrix.arch }} --out container-check/docker
      - name: the image into Podman
        run: docker save fantastic-server:ci | podman load
      - name: smoke test, rootless Podman
        run: uv run --project src/lib/python python os/ci/container_check.py --engine podman --image fantastic-server:ci --arch ${{ matrix.arch }} --out container-check/podman
      - name: keep the checks (logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-check-${{ matrix.arch }}
          path: container-check/
          if-no-files-found: ignore
          retention-days: 14
      - name: keep the image for publish
        uses: actions/upload-artifact@v7
        with:
          name: container-image-${{ matrix.arch }}
          path: container-image/
          retention-days: 30
