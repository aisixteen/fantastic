# CI — every push to `main` or a `ci/…` branch, and every PR: the reusable
# BUILD (`build.yml`) twice, side by side —
#
#   units   debug    every runtime's unit tests on Linux, macOS and Windows
#   e2e     release  the shipping binaries built per OS, then the model-free e2e
#                    (`e2e/run.py --only-free`, no model turns) on exactly those
#
# Free: standard GitHub-hosted runners on a public repo (see `build.yml`).

name: ci

on:
  push:
    # `main`, and any `ci/…` branch: push one to run CI without opening a PR.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  units:
    uses: ./.github/workflows/build.yml
    with:
      profile: debug
      units: true

  e2e:
    uses: ./.github/workflows/build.yml
    with:
      profile: release
      e2e: true
