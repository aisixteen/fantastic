name: Swift Tests

# Build + run the Swift test suite (macOS: JavaScriptCore, FoundationModels).
# Covers the FantasticJSRuntime / kernel / reflect surface that the audit found
# was invisible to CI — e.g. the js_runtime detached-loop death and compile-error
# zombie both now have regression tests here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/swift/**'
      - '.github/workflows/swift-test.yml'

jobs:
  swift-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/lib/swift
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          swift --version

      - name: Build tests
        run: swift build --build-tests

      # `--no-parallel` is REQUIRED, not an optimization: swift-testing's default
      # parallel execution runs hundreds of tests concurrently, and the many tests
      # that boot a kernel + NIO event loops + HTTP/WS listeners thrash the machine
      # into a >10-minute hang. Serial runs the whole suite in ~1s.
      - name: Test
        run: swift test --no-parallel
