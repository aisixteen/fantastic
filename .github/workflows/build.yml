# THE BUILD — one reusable workflow, called with what to do:
#
#   profile    debug | release — what every job builds
#   units      the unit tests of every runtime, per OS
#   binaries   the shipping archive of every release target (`release-<target>`;
#              `release.yml` publishes the ones a green run of `ci.yml` kept for
#              the tagged commit), and per OS the kernels and rig the e2e runs
#              (`e2e-<os>`)
#              and the desktop app per OS (`app-<triple>`, built from those CLIs)
#   e2e        the model-free e2e (`e2e/run.py --only-free`) on EXACTLY the
#              binaries this run built (`E2E_ARTIFACTS`) — the e2e runs what
#              ships — each OS's suite as three parallel jobs (`--shard i/3`).
#              Its own call may come after the `binaries` call and the units
#              (`ci.yml`): it takes the `e2e-<os>` artifacts of the same run.
#              And the desktop app's e2e (`src/app/e2e/run.py`) on the `app-*`
#              and `release-*` artifacts of the same run.
#   os         fantastic OS (Phase 9, `os/`): the app's `.deb` and
#              `fantastic-session` from `scripts/build/deb.sh` on the Linux
#              `app-*` and `release-*` artifacts of the same run (`debs`,
#              installed on stock Debian 13 in a container), the mkosi image of
#              them, and its boot in QEMU (`os/ci/boot_check.py`). Its own call,
#              after the `binaries` call (`ci.yml`).
#
# Callers: `ci.yml` ({debug, units}, {release, binaries}, then {release, e2e}
# and {release, os}).
# FREE:
# standard GitHub-hosted runners only
# (ubuntu-latest, ubuntu-24.04-arm, xcode-27, windows-latest) — a `-large` /
# `-xlarge` label is billed even on a public repo; never name one here.
#
# macOS is `xcode-27` (macOS 27 + Xcode 27, a preview image): the Apple
# Foundation Models bridge the rust kernel links needs the macOS 27 SDK. Swift is
# the Apple app's kernel: it builds and tests on macOS only, and the e2e on Linux
# and Windows runs every runtime but swift.

name: build

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      units:
        type: boolean
        default: false
      binaries:
        type: boolean
        default: false
      e2e:
        type: boolean
        default: false
      os:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The canvas packer provisions its pinned esbuild with this toolchain
  # (src/lib/ts/scripts/pack.sh); naming it here means no second download.
  GO_VERSION: "1.23.4"
  NODE_VERSION: "24"
  # debian:trixie-slim, a multi-arch index (both runners pull their own
  # architecture), pinned by digest: debian:trixie-20260918-slim
  TRIXIE_SLIM: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
  # cargo's flag for the profile (`debug` is cargo's default `dev`).
  CARGO_PROFILE: ${{ inputs.profile == 'release' && '--release' || '' }}

defaults:
  run:
    shell: bash

jobs:
  # ── units ────────────────────────────────────────────────────────────────
  python:
    if: inputs.units
    name: python · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/lib/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/python/uv.lock
      - name: build
        run: uv sync --locked
      - name: unit tests
        run: uv run pytest -n auto -q --no-header

  rust:
    if: inputs.units
    name: rust kernel · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/lib/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/lib/rust
          key: ${{ inputs.profile }}
      - name: build
        run: cargo build --workspace --locked $CARGO_PROFILE
      - name: unit tests
        # every crate's tests, even after one fails: a Windows run otherwise
        # stopped at the first failing crate and hid the rest
        run: cargo test --workspace --locked --no-fail-fast $CARGO_PROFILE

  cli:
    if: inputs.units
    name: cli · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src
            src/app
          key: ${{ inputs.profile }}
      - name: build
        run: cargo build --locked $CARGO_PROFILE
      - name: unit tests
        run: cargo test --locked --no-fail-fast $CARGO_PROFILE
      - name: the desktop app's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - name: unit tests (desktop app)
        # its own workspace (src/app); tauri-build needs the canvas sidecar staged
        # under the host's triple, so the CLI just built stands in for it
        working-directory: src/app
        shell: bash # the job's defaults set no shell, so Windows would take pwsh
        run: |
          X=${{ runner.os == 'Windows' && '.exe' || '' }}
          t=$(rustc --print host-tuple)
          mkdir -p binaries
          cp ../target/${{ inputs.profile }}/fantastic$X binaries/fantastic-$t$X
          cargo test --locked --no-fail-fast

  swift:
    if: inputs.units
    name: swift · xcode-27
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/lib/swift
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: swift build -c ${{ inputs.profile }}
      - name: unit tests
        run: swift test -c ${{ inputs.profile }}

  ts:
    if: inputs.units
    name: ts · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/lib/ts/package-lock.json
      - name: build (library)
        working-directory: src/lib/ts
        run: |
          npm ci
          npm run build
      - name: unit tests (library)
        working-directory: src/lib/ts
        run: npm test
      - name: typecheck (canvas page)
        working-directory: src/tui/web/canvas
        run: npm run typecheck
      - name: unit tests (canvas page)
        working-directory: src/tui/web/canvas
        run: npm test

  # ── the shipping binaries (+ the e2e's) ──────────────────────────────────
  binaries:
    if: inputs.binaries
    name: build · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # `e2e`: the OS whose e2e runs this target's binaries (one native target
        # per OS). The targets no e2e runs on are `cross`, below.
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, e2e: ubuntu-latest }
          - { os: xcode-27, target: aarch64-apple-darwin, e2e: xcode-27 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, e2e: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: musl (the static Linux targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/lib/rust
            src
          key: ${{ matrix.target }}-${{ inputs.profile }}
      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.e2e != ''
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the CLI + the e2e's kernels and rig
        if: matrix.e2e != ''
        working-directory: src/lib/python
        run: |
          uv run python ../../../e2e/build.py --out ../../../dist/e2e \
            --profile ${{ inputs.profile }} --target ${{ matrix.target }} \
            ${{ runner.os != 'macOS' && '--exclude-runtime swift' || '' }}
          # one tar: upload-artifact drops the executable bit
          tar -cf ../../../dist/e2e.tar -C ../../../dist/e2e .
      - name: the CLI
        if: matrix.e2e == ''
        run: sh scripts/build/cli.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      - name: keep the shipping archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/fantastic-${{ matrix.target }}.*
          if-no-files-found: error
          # a release publishes these up to a month after the green run
          retention-days: 30
      - name: keep the e2e's binaries
        if: matrix.e2e != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.e2e }}
          path: dist/e2e.tar
          if-no-files-found: error
          retention-days: 3

  # ── the release targets no e2e runs on (shipped, not tested here) ───────
  cross:
    if: inputs.binaries
    name: build · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: musl (the static Linux targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/lib/rust
            src
          key: ${{ matrix.target }}-${{ inputs.profile }}
      - name: the CLI
        run: sh scripts/build/cli.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      - name: keep the shipping archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/fantastic-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  # ── the desktop app (src/app), on the CLI just built ─────────────────────
  # `scripts/build/app.sh` is the one build path: it stages the target's CLI as
  # the canvas sidecar and runs `tauri build --no-bundle`. The installers (Phase
  # 6b) take `app-<triple>`. Linux is `ubuntu-24.04`, NOT `ubuntu-latest`: the
  # app links glibc, and the kiosk (Debian trixie) has glibc 2.41. The Linux
  # arm64 app (`ubuntu-24.04-arm`, glibc 2.39) is for the kiosk's arm64 image
  # (Phase 9) only; its CLI comes from `cross`.
  app:
    if: inputs.binaries
    needs: [binaries, cross]
    name: app · ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, target: aarch64-apple-darwin, app: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, app: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, app: x86_64-unknown-linux-gnu }
          # for the kiosk image's arm64 build only: no installer, no e2e
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, app: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # app.sh reads the version from the last tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.app }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - name: the desktop app's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app
          key: ${{ matrix.app }}-${{ inputs.profile }}
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release
      - name: the CLI, where cli.sh leaves it
        if: runner.os != 'Windows'
        run: |
          mkdir -p src/target/${{ matrix.target }}/${{ inputs.profile }}
          tar -xzf dist/release/fantastic-${{ matrix.target }}.tar.gz -C src/target/${{ matrix.target }}/${{ inputs.profile }}
      - name: the CLI, where cli.sh leaves it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive dist/release/fantastic-${{ matrix.target }}.zip -DestinationPath src/target/${{ matrix.target }}/${{ inputs.profile }}
      - name: the app
        run: sh scripts/build/app.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      - name: the glibc floor (Debian trixie, 2.41)
        if: runner.os == 'Linux'
        run: |
          bin=src/app/target/${{ matrix.app }}/${{ inputs.profile }}/fantastic-app
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "the app needs $need"
          top=$(printf '%s\nGLIBC_2.41\n' "$need" | sort -V | tail -1)
          [ "$top" = GLIBC_2.41 ] || { echo "::error::the app needs $need, above the kiosk's GLIBC_2.41"; exit 1; }
      - name: keep the app
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist/fantastic-app-${{ matrix.app }}.tar
          if-no-files-found: error
          retention-days: 30

  # The app's e2e (`src/app/e2e/run.py`) on exactly the app and CLI just built.
  # Linux drives the window through tauri-driver (WebKitWebDriver). macOS and
  # Windows launch the app and ask it through the home's socket: macOS has no
  # WKWebView driver, and msedgedriver can't reach the app's WebView2.
  app-e2e:
    if: inputs.e2e && !cancelled() && !failure()
    needs: [binaries, app]
    name: app e2e · ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, target: aarch64-apple-darwin, app: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, app: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, app: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the e2e's python (websockets)
        run: (cd src/lib/python && uv sync --locked)
      - uses: actions/download-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist/app-artifact
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release
      - name: the app and the CLI, side by side
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/app
          tar -xf dist/app-artifact/fantastic-app-${{ matrix.app }}.tar -C dist/app
          tar -xzf dist/release/fantastic-${{ matrix.target }}.tar.gz -C dist/app
          ls -l dist/app
      - name: the app and the CLI, side by side (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/app | Out-Null
          tar -xf dist/app-artifact/fantastic-app-${{ matrix.app }}.tar -C dist/app
          Expand-Archive dist/release/fantastic-${{ matrix.target }}.zip -DestinationPath dist/app
          Get-ChildItem dist/app
      - name: no real-time scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: the desktop app's libraries, its WebDriver and a display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev webkit2gtk-driver xvfb
      # WebDriver on Linux only: macOS has no WKWebView driver, and msedgedriver
      # can't reach the app's WebView2 (src/app/e2e/run.py's module docs)
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: app e2e (Linux)
        if: runner.os == 'Linux'
        working-directory: src/lib/python
        run: xvfb-run -a -s "-screen 0 1280x800x24" uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app
      - name: app e2e (macOS)
        if: runner.os == 'macOS'
        working-directory: src/lib/python
        run: uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app
      - name: app e2e (Windows)
        if: runner.os == 'Windows'
        working-directory: src/lib/python
        run: uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app.exe
      - name: keep the run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-runs-${{ matrix.app }}
          path: src/app/e2e/runs/
          retention-days: 14

  # ── the model-free e2e, on the binaries just built ───────────────────────
  # Each OS's suite runs as three jobs side by side (`--shard i/3`): the wall
  # time is a third, and parallel jobs cost nothing on a public repo.
  # `needs: binaries` orders a call that builds AND tests; in a call that only
  # tests, `binaries` is skipped, and only a failed or cancelled run stops this.
  e2e:
    if: inputs.e2e && !cancelled() && !failure()
    needs: binaries
    name: e2e (free) · ${{ matrix.os }} · ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
        shard: [1, 2, 3]
        # LANES: tests at once. Windows runs one: two software-GL Chromes and
        # their hosts on its 4 vCPUs pushed the canvas waits past their bounds.
        include:
          - os: ubuntu-latest
            skip: "--exclude-runtime swift"
            lanes: 2
          - os: xcode-27
            skip: ""
            lanes: 2
          - os: windows-latest
            skip: "--exclude-runtime swift"
            lanes: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: no real-time scan (Windows)
        # Defender scans every file a kernel writes (each record is a file):
        # off on the throwaway runner VM
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/python/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Chrome — the runner's own Google Chrome
        id: chrome
        # (Chrome for Testing, as setup-chrome installs it, never answers CDP on
        # the macOS image.) Ubuntu 24.04 forbids the unprivileged user namespaces
        # Chrome's sandbox is built on: allowed here, so the sandbox stays ON.
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              echo "path=/usr/bin/google-chrome" >> "$GITHUB_OUTPUT" ;;
            macOS)
              echo "path=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_OUTPUT" ;;
            Windows)
              # the runner's Chrome comes up too slowly there for the CDP waits;
              # Chrome for Testing (the next step) does not
              ;;
          esac
      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Windows'
        id: cft
      - name: apt packages (ffmpeg; WebKitGTK for E88)
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg python3-gi gir1.2-webkit2-4.1 xvfb ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress -y ;;
          esac
      - uses: actions/download-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: dist
      - name: the binaries
        run: |
          mkdir -p dist/e2e && tar -xf dist/e2e.tar -C dist/e2e
          ls -l dist/e2e
          (cd src/lib/python && uv sync --locked)
      - name: e2e (model-free)
        working-directory: src/lib/python
        env:
          CHROME: ${{ steps.chrome.outputs.path || steps.cft.outputs.chrome-path }}
          # the shell's frames, kept with the run's logs
          E2E_TUI_FRAMES: ${{ github.workspace }}/e2e/runs/tui-frames
          E2E_ARTIFACTS: ${{ github.workspace }}/dist/e2e
          E2E_PROFILE: ${{ inputs.profile }}
        run: uv run python ../../../e2e/run.py --only-free --lanes ${{ matrix.lanes }} --shard ${{ matrix.shard }}/3 ${{ matrix.skip }}
      - name: the failures' logs, here
        if: failure()
        run: |
          for summary in e2e/runs/*/SUMMARY.txt; do
            dir="$(dirname "$summary")"
            grep -v "^pass" "$summary" | cut -f2 | while read -r name; do
              log="$dir/$(printf '%s' "$name" | tr ':' '@').log"
              echo "::group::$name"
              tail -n 60 "$log"
              echo "::endgroup::"
            done
          done
      - name: keep the run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runs-${{ matrix.os }}-${{ matrix.shard }}
          # the logs, not the runs' project dirs and browser profiles (~500 MB)
          path: |
            e2e/runs/
            src/tui/e2e/runs/**/*.log
            src/tui/e2e/runs/**/*.txt
            src/tui/e2e/runs/**/*.json
            src/tui/e2e/runs/**/*.html
          retention-days: 14

  # ── fantastic OS (Phase 9, os/): the Debian packages, the image, its boot ──
  # `scripts/build/deb.sh` writes the app's .deb and `fantastic-session` from the
  # `app-*` and `release-*` artifacts of the `binaries` call (ci.yml's `os` call
  # follows it). Unsigned: signing is by hand (src/lib/rust/RELEASING.md).
  debs:
    if: inputs.os
    name: debs · ${{ matrix.deb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, app: x86_64-unknown-linux-gnu, deb: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, app: aarch64-unknown-linux-gnu, deb: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # deb.sh reads the version from the last tag
      - uses: dtolnay/rust-toolchain@stable # `tauri bundle` runs `cargo metadata`
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist
      - name: the binaries, where app.sh leaves them
        run: |
          mkdir -p src/app/binaries "$RUNNER_TEMP/cli" src/app/target/${{ matrix.app }}/release
          tar -xzf dist/fantastic-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP/cli/fantastic" src/app/binaries/fantastic-${{ matrix.app }}
          tar -xf dist/fantastic-app-${{ matrix.app }}.tar -C src/app/target/${{ matrix.app }}/release
          ls -l src/app/binaries src/app/target/${{ matrix.app }}/release
          # one version for the packages and the checks below: deb.sh's rule
          echo "FANTASTIC_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_ENV"
      - name: the packages
        run: sh scripts/build/deb.sh --target ${{ matrix.target }}
      - name: the packages, checked
        run: |
          APP_DEB=dist/deb/fantastic-app-${{ matrix.app }}.deb
          SESSION_DEB=dist/deb/fantastic-session_${FANTASTIC_VERSION}_all.deb
          for d in "$APP_DEB" "$SESSION_DEB"; do
            dpkg-deb --info "$d"
            dpkg-deb --contents "$d"
          done
          field() { dpkg-deb --field "$1" "$2"; }
          bad=0
          want() {  # <what> <got> <want>
            [ "$2" = "$3" ] || { echo "::error::$1 is '$2', wanted '$3'"; bad=1; }
          }
          want "the app .deb's Package" "$(field "$APP_DEB" Package)" aisixteen-fantastic
          want "the app .deb's Architecture" "$(field "$APP_DEB" Architecture)" ${{ matrix.deb }}
          want "the app .deb's Version" "$(field "$APP_DEB" Version)" "$FANTASTIC_VERSION"
          for f in ./usr/bin/fantastic-app ./usr/bin/fantastic; do
            mode=$(dpkg-deb --contents "$APP_DEB" | awk -v f="$f" '$NF == f { print $1 }')
            want "the app .deb's mode of $f" "$mode" -rwxr-xr-x
          done
          # the sidecar is the tested bytes: the release archive's binary
          packed=$(dpkg-deb --fsys-tarfile "$APP_DEB" | tar -xO ./usr/bin/fantastic | sha256sum | cut -d' ' -f1)
          archive=$(tar -xzOf dist/fantastic-${{ matrix.target }}.tar.gz fantastic | sha256sum | cut -d' ' -f1)
          want "the sha256 of the .deb's /usr/bin/fantastic" "$packed" "$archive"
          want "fantastic-session's Architecture" "$(field "$SESSION_DEB" Architecture)" all
          depends=$(field "$SESSION_DEB" Depends)
          case "$depends" in
            "aisixteen-fantastic (= $FANTASTIC_VERSION), "*) ;;
            *) echo "::error::fantastic-session's Depends is '$depends', wanted it to start with 'aisixteen-fantastic (= $FANTASTIC_VERSION)'"; bad=1 ;;
          esac
          exit $bad
      - name: lint and unit tests
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -s sh os/session/DEBIAN/postinst os/session/DEBIAN/prerm os/session/DEBIAN/postrm
          python3 -m unittest discover -s os/ci -p 'test_*.py'
      # the host is not touched: a container. No systemd runs in it, so the
      # maintainer scripts take their no-systemd branch; the VM covers the live path.
      - name: install on stock Debian 13, no recommends
        run: |
          docker run --rm -v "$PWD/dist/deb:/deb:ro" "$TRIXIE_SLIM" sh -euxc '
            cat /etc/debian_version
            apt-get update -q
            apt-get install -y -q --no-install-recommends /deb/fantastic-app-*.deb /deb/fantastic-session_*_all.deb
            fantastic readme | grep -q "fantastic canvas"
            test -x /usr/bin/fantastic-app
            id fantastic
            test -L /etc/systemd/system/multi-user.target.wants/fantastic-kiosk.service
            systemd-analyze verify /usr/lib/systemd/system/fantastic-kiosk.service
            apt-get remove -y -q fantastic-session
            test "$(readlink /etc/systemd/system/fantastic-kiosk.service)" = /dev/null
            apt-get purge -y -q fantastic-session
            test ! -e /etc/systemd/system/fantastic-kiosk.service
            test ! -e /etc/systemd/system/multi-user.target.wants/fantastic-kiosk.service
            test ! -e /etc/pam.d/fantastic-kiosk
            id fantastic'
      - name: keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.app }}
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # The image (mkosi v27.1) of exactly those packages, booted in QEMU:
  # `os/ci/boot_check.py`. x86-64 runs on KVM and is the gate. `ubuntu-24.04-arm`
  # exposes no /dev/kvm (actions/runner-images#14062), so arm64 boots on TCG, slowly,
  # and does not fail the run until a green boot has been seen.
  os:
    if: inputs.os
    needs: debs
    name: os · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
            app: x86_64-unknown-linux-gnu
            qemu: qemu-system-x86 ovmf
            boot: ""
            minutes: 90
            soft: false
          - os: ubuntu-24.04-arm
            arch: arm64
            app: aarch64-unknown-linux-gnu
            qemu: qemu-system-arm qemu-efi-aarch64
            boot: --timeout 2400 --step 600
            minutes: 120
            # not a gate yet: remove `soft` after a green TCG boot has been seen
            soft: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    continue-on-error: ${{ matrix.soft }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # os.sh reads the version from the last tag
      # makes /dev/kvm usable, removes AppArmor, links mkosi into /usr/bin.
      # Not Ubuntu's own `mkosi` package: it is 20.2.
      - uses: systemd/mkosi@v27.1
      - uses: actions/download-artifact@v7
        with:
          name: deb-${{ matrix.app }}
          path: dist/deb
      - name: the image
        run: |
          echo "FANTASTIC_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_ENV"
          sh scripts/build/os.sh --arch ${{ matrix.arch }} --profile ci
          ls -l dist/os
      - name: qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.qemu }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the check's python (websockets)
        run: (cd src/lib/python && uv sync --locked)
      - name: boot it, and check the kiosk
        run: |
          raw=dist/os/fantastic-os_${FANTASTIC_VERSION}.raw
          echo "the raw image: $(du -h "$raw" | cut -f1) ($(stat -c %s "$raw") bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --project src/lib/python python os/ci/boot_check.py \
            --image "$raw" --arch ${{ matrix.arch }} --out os-check ${{ matrix.boot }}
      - name: keep the check (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: os-check-${{ matrix.arch }}
          path: os-check/
          retention-days: 14
      - name: compress the image
        if: success() && matrix.arch == 'x86-64'
        run: zstd -T0 -10 "dist/os/fantastic-os_${FANTASTIC_VERSION}.raw" -o dist/os/fantastic-os-x86-64.raw.zst
      - name: keep the image
        if: success() && matrix.arch == 'x86-64'
        uses: actions/upload-artifact@v7
        with:
          name: os-image-x86-64
          path: dist/os/fantastic-os-x86-64.raw.zst
          if-no-files-found: error
          retention-days: 7
