# THE BUILD — one reusable workflow, called with what to do:
#
#   profile    debug | release — what every job builds
#   units      the unit tests of every runtime, per OS
#   binaries   the shipping archive of every release target (`release-<target>`;
#              `release.yml` publishes the ones a green run of `ci.yml` kept for
#              the tagged commit), and per OS the kernels and rig the e2e runs
#              (`e2e-<os>`)
#              and the desktop app per OS (`app-<triple>`, built from those CLIs)
#   e2e        the model-free e2e (`e2e/run.py --only-free`) on EXACTLY the
#              binaries this run built (`E2E_ARTIFACTS`) — the e2e runs what
#              ships — each OS's suite as three parallel jobs (`--shard i/3`).
#              Its own call may come after the `binaries` call and the units
#              (`ci.yml`): it takes the `e2e-<os>` artifacts of the same run.
#              And the desktop app's e2e (`src/app/e2e/run.py`) on the `app-*`
#              and `release-*` artifacts of the same run.
#   debs       the app's `.deb` from `scripts/build/deb.sh` on the Linux
#              `app-*` and `release-*` artifacts of the same run, installed on
#              stock Debian 13 in a container. Its own call, after the
#              `binaries` call (`ci.yml`).
#
# `os` (all | linux | macos | windows; empty = all) picks the OS set of EVERY
# job of a call. The `plan` job turns it into each job's matrix; a job whose
# matrix has no entry for that OS is skipped (GitHub fails on an empty matrix,
# so the job's `if` checks the plan first). The Linux-only jobs (debs) run on
# `all` and `linux`. arm64 and amd64 Linux are both Linux.
#
# Callers: `ci.yml` ({debug, units}, {release, binaries}, then {release, e2e}
# and {release, debs}).
# FREE:
# standard GitHub-hosted runners only
# (ubuntu-latest, ubuntu-24.04-arm, xcode-27, windows-latest) — a `-large` /
# `-xlarge` label is billed even on a public repo; never name one here.
#
# macOS is `xcode-27` (macOS 27 + Xcode 27, a preview image): the Apple
# Foundation Models bridge the rust kernel links needs the macOS 27 SDK. The
# swift kernel runtime is retired (#53); only the bridge package stays.

name: build

on:
  workflow_call:
    inputs:
      cleanup:
        type: boolean
        default: false
      profile:
        type: string
        required: true
      units:
        type: boolean
        default: false
      os:
        # the OS set of every job: all (Linux, macOS, Windows), linux, macos or windows
        type: string
        default: all
      binaries:
        type: boolean
        default: false
      e2e:
        type: boolean
        default: false
      debs:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The canvas packer provisions its pinned esbuild with this toolchain
  # (src/lib/ts/scripts/pack.sh); naming it here means no second download.
  GO_VERSION: "1.23.4"
  NODE_VERSION: "24"
  # debian:trixie-slim, a multi-arch index (both runners pull their own
  # architecture), pinned by digest: debian:trixie-20260918-slim
  TRIXIE_SLIM: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
  # cargo's flag for the profile (`debug` is cargo's default `dev`).
  CARGO_PROFILE: ${{ inputs.profile == 'release' && '--release' || '' }}

defaults:
  run:
    shell: bash

jobs:
  # The matrices of this call, for the chosen `os`: every entry has a `kind`
  # (linux | macos | windows); the ones of other kinds are dropped. An empty list
  # skips its job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      units: ${{ steps.plan.outputs.units }}
      binaries: ${{ steps.plan.outputs.binaries }}
      cross: ${{ steps.plan.outputs.cross }}
      app: ${{ steps.plan.outputs.app }}
      app_e2e: ${{ steps.plan.outputs.app_e2e }}
      e2e: ${{ steps.plan.outputs.e2e }}
      debs: ${{ steps.plan.outputs.debs }}
    steps:
      - id: plan
        env:
          OS: ${{ inputs.os }}
        run: |
          pick() { jq -c --arg os "$OS" '[.[] | select($os == "" or $os == "all" or .kind == $os)]'; }
          out() { echo "$1=$(printf '%s' "$2" | pick)" >> "$GITHUB_OUTPUT"; }
          out units '[{"os":"ubuntu-latest","kind":"linux"},{"os":"xcode-27","kind":"macos"},{"os":"windows-latest","kind":"windows"}]'
          out binaries '[
            {"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","e2e":"ubuntu-latest","kind":"linux"},
            {"os":"xcode-27","target":"aarch64-apple-darwin","e2e":"xcode-27","kind":"macos"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","e2e":"windows-latest","kind":"windows"}]'
          out cross '[
            {"os":"xcode-27","target":"x86_64-apple-darwin","kind":"macos"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","kind":"linux"}]'
          out app '[
            {"os":"xcode-27","target":"aarch64-apple-darwin","app":"aarch64-apple-darwin","kind":"macos"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","app":"x86_64-pc-windows-msvc","kind":"windows"},
            {"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","app":"x86_64-unknown-linux-gnu","kind":"linux"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","app":"aarch64-unknown-linux-gnu","kind":"linux"}]'
          out app_e2e '[
            {"os":"xcode-27","target":"aarch64-apple-darwin","app":"aarch64-apple-darwin","kind":"macos"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","app":"x86_64-pc-windows-msvc","kind":"windows"},
            {"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","app":"x86_64-unknown-linux-gnu","kind":"linux"}]'
          # LANES: tests at once. Windows runs one: two software-GL Chromes and
          # their hosts on its 4 vCPUs pushed the canvas waits past their bounds.
          out e2e '[
            {"os":"ubuntu-latest","lanes":2,"shard":1,"kind":"linux"},{"os":"ubuntu-latest","lanes":2,"shard":2,"kind":"linux"},{"os":"ubuntu-latest","lanes":2,"shard":3,"kind":"linux"},
            {"os":"xcode-27","lanes":2,"shard":1,"kind":"macos"},{"os":"xcode-27","lanes":2,"shard":2,"kind":"macos"},{"os":"xcode-27","lanes":2,"shard":3,"kind":"macos"},
            {"os":"windows-latest","lanes":1,"shard":1,"kind":"windows"},{"os":"windows-latest","lanes":1,"shard":2,"kind":"windows"},{"os":"windows-latest","lanes":1,"shard":3,"kind":"windows"}]'
          out debs '[
            {"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","app":"x86_64-unknown-linux-gnu","deb":"amd64","kind":"linux"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","app":"aarch64-unknown-linux-gnu","deb":"arm64","kind":"linux"}]'
  # ── units ────────────────────────────────────────────────────────────────
  python:
    # Rust only (owner 2026-11-11): Python off until the owner turns it back on.
    if: false
    needs: plan
    name: python · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.units).*.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/lib/python
    steps:
      - uses: actions/checkout@v7
      - name: trust roots (#280)
        # fails if a lockfile brings back a bundle that trusts the compromised
        # emSign root (webpki-roots < 1.0.10, certifi < 2026.10.19)
        working-directory: .
        shell: bash
        run: sh scripts/check-trust-roots.sh
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: ${{ inputs.cleanup }}
          cache-dependency-glob: src/lib/python/uv.lock
      - name: build
        run: uv sync --locked
      - name: unit tests
        run: uv run pytest -n auto -q --no-header

  rust:
    if: inputs.units
    needs: plan
    name: rust kernel · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.units).*.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/lib/rust
    steps:
      - uses: actions/checkout@v7
      - name: trust roots (#280)
        # fails if a lockfile brings back a bundle that trusts the compromised
        # emSign root (webpki-roots < 1.0.10, certifi < 2026.10.19)
        working-directory: .
        shell: bash
        run: sh scripts/check-trust-roots.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: src/lib/rust
          key: ${{ inputs.profile }}
      - name: build
        run: cargo build --workspace --locked $CARGO_PROFILE
      - name: unit tests
        # every crate's tests, even after one fails: a Windows run otherwise
        # stopped at the first failing crate and hid the rest
        run: cargo test --workspace --locked --no-fail-fast $CARGO_PROFILE
      - name: Foundation Models bridge (swift tests)
        # the swift package inside the on-device backend crate: its own suite,
        # against a fake engine (no model, no macOS 26)
        if: runner.os == 'macOS'
        run: swift test -c ${{ inputs.profile }} --package-path crates/bundles/fantastic-foundation-models-backend/swift

  cli:
    if: inputs.units
    needs: plan
    name: cli · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.units).*.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: src
          key: ${{ inputs.profile }}
      - name: build
        run: cargo build --locked $CARGO_PROFILE
      - name: unit tests
        run: cargo test --locked --no-fail-fast $CARGO_PROFILE

  desktop-app:
    if: inputs.units
    needs: plan
    name: desktop app · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.units).*.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: src/app
          key: ${{ inputs.profile }}-desktop-app
      - name: the desktop app's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - name: unit tests (desktop app)
        # its own workspace (src/app). tauri-build only needs the canvas sidecar
        # to exist under the host's triple (externalBin); no unit test runs it
        # (home::canvas_bin is called from main() only), so a placeholder file
        # stands in and the CLI is not built in this job
        shell: bash # the job's defaults set no shell, so Windows would take pwsh
        run: |
          X=${{ runner.os == 'Windows' && '.exe' || '' }}
          t=$(rustc --print host-tuple)
          mkdir -p binaries
          : > binaries/fantastic-$t$X
          chmod +x binaries/fantastic-$t$X
          cargo test --locked --no-fail-fast

  ts:
    if: inputs.units
    needs: plan
    name: ts · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.units).*.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/lib/ts/package-lock.json
      - name: build (library)
        working-directory: src/lib/ts
        run: |
          npm ci
          npm run build
      - name: unit tests (library)
        working-directory: src/lib/ts
        run: npm test
      - name: typecheck (canvas page)
        working-directory: src/tui/web/canvas
        run: npm run typecheck
      - name: unit tests (canvas page)
        working-directory: src/tui/web/canvas
        run: npm test

  # ── the shipping binaries (+ the e2e's) ──────────────────────────────────
  binaries:
    if: inputs.binaries && needs.plan.outputs.binaries != '[]'
    needs: plan
    name: build · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.binaries) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: musl (the static Linux targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: |
            src/lib/rust
            src
          key: ${{ matrix.target }}-${{ inputs.profile }}
      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.e2e != ''
        with:
          enable-cache: true
          prune-cache: ${{ inputs.cleanup }}
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the CLI + the e2e's kernels and rig
        if: matrix.e2e != ''
        working-directory: src/lib/python
        run: |
          # Rust only (owner 2026-11-11): Python off until the owner turns it back on.
          uv run python ../../../e2e/build.py --out ../../../dist/e2e \
            --profile ${{ inputs.profile }} --target ${{ matrix.target }} --exclude-runtime python
          # one tar: upload-artifact drops the executable bit
          tar -cf ../../../dist/e2e.tar -C ../../../dist/e2e .
      - name: the CLI
        if: matrix.e2e == ''
        run: sh scripts/build/cli.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      # the binary is static musl (the server image runs it): pure Rust, no C library.
      # `file` calls a static PIE (rustc's musl default) "static-pie linked".
      - name: the binary is statically linked
        if: contains(matrix.target, 'musl')
        run: |
          bin=src/target/${{ matrix.target }}/${{ inputs.profile }}/fantastic
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
      - name: keep the shipping archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/fantastic-${{ matrix.target }}.*
          if-no-files-found: error
          # a release publishes these up to a month after the green run
          retention-days: 30
      - name: keep the e2e's binaries
        if: matrix.e2e != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.e2e }}
          path: dist/e2e.tar
          if-no-files-found: error
          retention-days: 3

  # ── the release targets no e2e runs on (shipped, not tested here) ───────
  cross:
    if: inputs.binaries && needs.plan.outputs.cross != '[]'
    needs: plan
    name: build · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cross) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: musl (the static Linux targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: |
            src/lib/rust
            src
          key: ${{ matrix.target }}-${{ inputs.profile }}
      - name: the CLI
        run: sh scripts/build/cli.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      # the binary is static musl (the server image runs it): pure Rust, no C library.
      # `file` calls a static PIE (rustc's musl default) "static-pie linked".
      - name: the binary is statically linked
        if: contains(matrix.target, 'musl')
        run: |
          bin=src/target/${{ matrix.target }}/${{ inputs.profile }}/fantastic
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
      - name: keep the shipping archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/fantastic-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  # ── the desktop app (src/app), on the CLI just built ─────────────────────
  # `scripts/build/app.sh` is the one build path: it stages the target's CLI as
  # the canvas sidecar and runs `tauri build --no-bundle`. The installers (Phase
  # 6b) take `app-<triple>`. Linux is `ubuntu-24.04`, NOT `ubuntu-latest`: the
  # app links glibc, and Debian 13 (trixie) has glibc 2.41. The Linux
  # arm64 app (`ubuntu-24.04-arm`, glibc 2.39) is for the arm64 Debian 13 packages
  # only; its CLI comes from `cross`.
  app:
    if: inputs.binaries && !cancelled() && !failure() && needs.plan.outputs.app != '[]'
    needs: [plan, binaries, cross]
    name: app · ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.app) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # app.sh reads the version from the last tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.app }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - name: the desktop app's libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ inputs.cleanup || github.ref == 'refs/heads/main' }}
          workspaces: src/app
          key: ${{ matrix.app }}-${{ inputs.profile }}
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release
      - name: the CLI, where cli.sh leaves it
        if: runner.os != 'Windows'
        run: |
          mkdir -p src/target/${{ matrix.target }}/${{ inputs.profile }}
          tar -xzf dist/release/fantastic-${{ matrix.target }}.tar.gz -C src/target/${{ matrix.target }}/${{ inputs.profile }}
      - name: the CLI, where cli.sh leaves it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive dist/release/fantastic-${{ matrix.target }}.zip -DestinationPath src/target/${{ matrix.target }}/${{ inputs.profile }}
      - name: the app
        run: sh scripts/build/app.sh --profile ${{ inputs.profile }} --target ${{ matrix.target }}
      - name: the glibc floor (Debian trixie, 2.41)
        if: runner.os == 'Linux'
        run: |
          bin=src/app/target/${{ matrix.app }}/${{ inputs.profile }}/fantastic-app
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "the app needs $need"
          top=$(printf '%s\nGLIBC_2.41\n' "$need" | sort -V | tail -1)
          [ "$top" = GLIBC_2.41 ] || { echo "::error::the app needs $need, above Debian 13's GLIBC_2.41"; exit 1; }
      - name: keep the app
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist/fantastic-app-${{ matrix.app }}.tar
          if-no-files-found: error
          retention-days: 30

  # The app's e2e (`src/app/e2e/run.py`) on exactly the app and CLI just built.
  # Linux drives the window through tauri-driver (WebKitWebDriver). macOS and
  # Windows launch the app and ask it through the home's socket: macOS has no
  # WKWebView driver, and msedgedriver can't reach the app's WebView2.
  app-e2e:
    if: inputs.e2e && !cancelled() && !failure() && needs.plan.outputs.app_e2e != '[]'
    needs: [plan, binaries, app]
    name: app e2e · ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.app_e2e) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: ${{ inputs.cleanup }}
          cache-dependency-glob: src/lib/python/uv.lock
      - name: the e2e's python (websockets)
        run: (cd src/lib/python && uv sync --locked)
      - uses: actions/download-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist/app-artifact
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release
      - name: the app and the CLI, side by side
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/app
          tar -xf dist/app-artifact/fantastic-app-${{ matrix.app }}.tar -C dist/app
          tar -xzf dist/release/fantastic-${{ matrix.target }}.tar.gz -C dist/app
          ls -l dist/app
      - name: the app and the CLI, side by side (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/app | Out-Null
          tar -xf dist/app-artifact/fantastic-app-${{ matrix.app }}.tar -C dist/app
          Expand-Archive dist/release/fantastic-${{ matrix.target }}.zip -DestinationPath dist/app
          Get-ChildItem dist/app
      - name: no real-time scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: the desktop app's libraries, its WebDriver and a display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev webkit2gtk-driver xvfb
      # WebDriver on Linux only: macOS has no WKWebView driver, and msedgedriver
      # can't reach the app's WebView2 (src/app/e2e/run.py's module docs)
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: app e2e (Linux)
        if: runner.os == 'Linux'
        working-directory: src/lib/python
        run: xvfb-run -a -s "-screen 0 1280x800x24" uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app
      - name: app e2e (macOS)
        if: runner.os == 'macOS'
        working-directory: src/lib/python
        run: uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app
      - name: app e2e (Windows)
        if: runner.os == 'Windows'
        working-directory: src/lib/python
        run: uv run python ../../app/e2e/run.py --app ../../../dist/app/fantastic-app.exe
      - name: keep the run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-runs-${{ matrix.app }}
          path: src/app/e2e/runs/
          retention-days: 14

  # ── the model-free e2e, on the binaries just built ───────────────────────
  # Each OS's suite runs as three jobs side by side (`--shard i/3`): the wall
  # time is a third, and parallel jobs cost nothing on a public repo.
  # `needs: binaries` orders a call that builds AND tests; in a call that only
  # tests, `binaries` is skipped, and only a failed or cancelled run stops this.
  e2e:
    if: inputs.e2e && !cancelled() && !failure() && needs.plan.outputs.e2e != '[]'
    needs: [plan, binaries]
    name: e2e (free) · ${{ matrix.os }} · ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: no real-time scan (Windows)
        # Defender scans every file a kernel writes (each record is a file):
        # off on the throwaway runner VM
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: ${{ inputs.cleanup }}
          cache-dependency-glob: src/lib/python/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Chrome — the runner's own Google Chrome
        id: chrome
        # (Chrome for Testing, as setup-chrome installs it, never answers CDP on
        # the macOS image.) Ubuntu 24.04 forbids the unprivileged user namespaces
        # Chrome's sandbox is built on: allowed here, so the sandbox stays ON.
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              echo "path=/usr/bin/google-chrome" >> "$GITHUB_OUTPUT" ;;
            macOS)
              echo "path=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_OUTPUT" ;;
            Windows)
              # the runner's Chrome comes up too slowly there for the CDP waits;
              # Chrome for Testing (the next step) does not
              ;;
          esac
      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Windows'
        id: cft
      - name: apt packages (ffmpeg; WebKitGTK for E88)
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg python3-gi gir1.2-webkit2-4.1 xvfb ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress -y ;;
          esac
      - uses: actions/download-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: dist
      - name: the binaries
        run: |
          mkdir -p dist/e2e && tar -xf dist/e2e.tar -C dist/e2e
          ls -l dist/e2e
          (cd src/lib/python && uv sync --locked)
      - name: e2e (model-free)
        working-directory: src/lib/python
        env:
          CHROME: ${{ steps.chrome.outputs.path || steps.cft.outputs.chrome-path }}
          # the shell's frames, kept with the run's logs
          E2E_TUI_FRAMES: ${{ github.workspace }}/e2e/runs/tui-frames
          E2E_ARTIFACTS: ${{ github.workspace }}/dist/e2e
          E2E_PROFILE: ${{ inputs.profile }}
        # Rust only (owner 2026-11-11): Python off until the owner turns it back on.
        run: uv run python ../../../e2e/run.py --only-free --lanes ${{ matrix.lanes }} --shard ${{ matrix.shard }}/3 --exclude-runtime python
      - name: the failures' logs, here
        if: failure()
        run: |
          for summary in e2e/runs/*/SUMMARY.txt; do
            dir="$(dirname "$summary")"
            grep -v "^pass" "$summary" | cut -f2 | while read -r name; do
              log="$dir/$(printf '%s' "$name" | tr ':' '@').log"
              echo "::group::$name"
              tail -n 60 "$log"
              echo "::endgroup::"
            done
          done
      - name: keep the run logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runs-${{ matrix.os }}-${{ matrix.shard }}
          # the logs, not the runs' project dirs and browser profiles (~500 MB)
          path: |
            e2e/runs/
            src/tui/e2e/runs/**/*.log
            src/tui/e2e/runs/**/*.txt
            src/tui/e2e/runs/**/*.json
            src/tui/e2e/runs/**/*.html
          retention-days: 14

  # ── the app's Debian package ──
  # `scripts/build/deb.sh` writes the app's .deb from the
  # `app-*` and `release-*` artifacts of the `binaries` call (ci.yml's `debs` call
  # follows it). Unsigned: signing is by hand (src/lib/rust/RELEASING.md).
  debs:
    if: inputs.debs && needs.plan.outputs.debs != '[]'
    needs: plan
    name: debs · ${{ matrix.deb }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.debs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # deb.sh reads the version from the last tag
      - uses: dtolnay/rust-toolchain@stable # `tauri bundle` runs `cargo metadata`
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: app-${{ matrix.app }}
          path: dist
      - name: the binaries, where app.sh leaves them
        run: |
          mkdir -p src/app/binaries "$RUNNER_TEMP/cli" src/app/target/${{ matrix.app }}/release
          tar -xzf dist/fantastic-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP/cli/fantastic" src/app/binaries/fantastic-${{ matrix.app }}
          tar -xf dist/fantastic-app-${{ matrix.app }}.tar -C src/app/target/${{ matrix.app }}/release
          ls -l src/app/binaries src/app/target/${{ matrix.app }}/release
          # one version for the packages and the checks below: deb.sh's rule
          echo "FANTASTIC_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_ENV"
      - name: the packages
        run: sh scripts/build/deb.sh --target ${{ matrix.target }}
      - name: the packages, checked
        run: |
          APP_DEB=dist/deb/fantastic-app-${{ matrix.app }}.deb
          dpkg-deb --info "$APP_DEB"
          dpkg-deb --contents "$APP_DEB"
          field() { dpkg-deb --field "$1" "$2"; }
          bad=0
          want() {  # <what> <got> <want>
            [ "$2" = "$3" ] || { echo "::error::$1 is '$2', wanted '$3'"; bad=1; }
          }
          want "the app .deb's Package" "$(field "$APP_DEB" Package)" aisixteen-fantastic
          want "the app .deb's Architecture" "$(field "$APP_DEB" Architecture)" ${{ matrix.deb }}
          want "the app .deb's Version" "$(field "$APP_DEB" Version)" "$FANTASTIC_VERSION"
          # dpkg-deb lists a member as ./usr/… or usr/… (the tauri bundler writes the latter): compare without ./
          for f in usr/bin/fantastic-app usr/bin/fantastic; do
            mode=$(dpkg-deb --contents "$APP_DEB" | awk -v f="$f" '{ p = $NF; sub(/^\.\//, "", p) } p == f { print $1 }')
            want "the app .deb's mode of $f" "$mode" -rwxr-xr-x
          done
          # the sidecar is the tested bytes: the release archive's binary
          member=$(dpkg-deb --fsys-tarfile "$APP_DEB" | tar -t | grep -xE '(\./)?usr/bin/fantastic')
          packed=$(dpkg-deb --fsys-tarfile "$APP_DEB" | tar -xO "$member" | sha256sum | cut -d' ' -f1)
          archive=$(tar -xzOf dist/fantastic-${{ matrix.target }}.tar.gz fantastic | sha256sum | cut -d' ' -f1)
          want "the sha256 of the .deb's /usr/bin/fantastic" "$packed" "$archive"
          exit $bad
      - name: unit tests of the CI files
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 -m unittest discover -s container/server -p 'test_*.py'
      # the host is not touched: a container
      - name: install on stock Debian 13, no recommends
        run: |
          docker run --rm -v "$PWD/dist/deb:/deb:ro" "$TRIXIE_SLIM" sh -euxc '
            cat /etc/debian_version
            apt-get update -q
            apt-get install -y -q --no-install-recommends /deb/fantastic-app-*.deb
            fantastic readme | grep -q "fantastic canvas"
            test -x /usr/bin/fantastic-app'
      - name: keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.app }}
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 30
